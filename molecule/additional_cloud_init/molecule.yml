dependency:
  name: galaxy

driver:
  name: default

platforms:
  - name: oim_server

provisioner:
  name: ansible
  log: true
  inventory:
    host_vars:
      oim_server:
        ansible_host: ${OIM_SERVER_IP:-localhost}
        ansible_user: ${OIM_SERVER_USER:-root}
        ansible_password: ${OIM_SERVER_PASSWORD:-""}
        ansible_connection: ${ANSIBLE_CONNECTION:-ssh}

verifier:
  name: testinfra
  options:
    # Show detailed output for failed tests
    v: 1
  additional_files_or_dirs:
    - ../conftest.py
