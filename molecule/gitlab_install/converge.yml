---
# =============================================================================
# Molecule Converge - Run gitlab.yml inside omnia_core container
# =============================================================================

- name: Converge - Load configuration and setup inventory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default(playbook_dir + '/../..', true) }}"

  tasks:
    - name: Setup dynamic inventory
      ansible.builtin.include_tasks: ../shared/tasks/setup_inventory.yml

    - name: Set facts for OIM server play
      ansible.builtin.set_fact:
        omnia_test_config: "{{ omnia_test_config }}"
        cacheable: true
      no_log: true


- name: Converge - Run GitLab prerequisite checks and playbook
  hosts: oim_server
  gather_facts: false

  vars:
    omnia_test_config: "{{ hostvars['localhost']['omnia_test_config'] }}"
    omnia_shared_path: "{{ omnia_test_config.omnia_shared_path | default('/opt/omnia') }}"
    container_name: "omnia_core"
    gitlab_playbook: "/omnia/gitlab/gitlab.yml"

  tasks:
    - name: Display target OIM server
      ansible.builtin.debug:
        msg: "Running GitLab on OIM server: {{ ansible_host }}"

    # =========================================================================
    # PREREQUISITE CHECKS
    # =========================================================================

    - name: Check if build_stream is enabled
      ansible.builtin.shell:
        cmd: podman exec {{ container_name }} cat /opt/omnia/input/project_default/build_stream_config.yml | grep -E "^enable_build_stream:" | awk '{print $2}'
      register: build_stream_enabled_check
      changed_when: false

    - name: Fail if build_stream is not enabled
      ansible.builtin.fail:
        msg: |
          ╔══════════════════════════════════════════════════════════════════════════════╗
          ║                    BUILD STREAM NOT ENABLED                                   ║
          ╠══════════════════════════════════════════════════════════════════════════════╣
          ║ enable_build_stream is set to '{{ build_stream_enabled_check.stdout }}'
          ║
          ║ GitLab deployment requires build_stream to be enabled.
          ║ Set enable_build_stream: true in build_stream_config.yml
          ║ and run prepare_oim.yml first.
          ╚══════════════════════════════════════════════════════════════════════════════╝
      when: build_stream_enabled_check.stdout | lower not in ['true', 'yes']

    - name: Check required containers are running
      ansible.builtin.shell:
        cmd: podman ps --format "{{ '{{.Names}}' }}" | grep -E "^(omnia_build_stream|omnia_postgres)$" | wc -l
      register: containers_check
      changed_when: false

    - name: Fail if required containers are not running
      ansible.builtin.fail:
        msg: |
          ╔══════════════════════════════════════════════════════════════════════════════╗
          ║                    REQUIRED CONTAINERS NOT RUNNING                            ║
          ╠══════════════════════════════════════════════════════════════════════════════╣
          ║ Expected: omnia_build_stream, omnia_postgres
          ║ Running: {{ containers_check.stdout }} containers
          ║
          ║ Ensure prepare_oim.yml has been successfully executed with
          ║ enable_build_stream: true before deploying GitLab.
          ╚══════════════════════════════════════════════════════════════════════════════╝
      when: containers_check.stdout | int < 2

    - name: Check playbook_watcher service status
      ansible.builtin.systemd_service:
        name: playbook_watcher.service
      register: watcher_status
      failed_when: false

    - name: Fail if playbook_watcher is not running
      ansible.builtin.fail:
        msg: |
          ╔══════════════════════════════════════════════════════════════════════════════╗
          ║                    PLAYBOOK WATCHER NOT RUNNING                               ║
          ╠══════════════════════════════════════════════════════════════════════════════╣
          ║ playbook_watcher.service is not active.
          ║
          ║ Ensure prepare_oim.yml has been successfully executed with
          ║ enable_build_stream: true before deploying GitLab.
          ╚══════════════════════════════════════════════════════════════════════════════╝
      when: >
        watcher_status.status is not defined or
        watcher_status.status.ActiveState != 'active'

    - name: Check build stream SSL certificate exists
      ansible.builtin.shell:
        cmd: podman exec {{ container_name }} test -f /opt/omnia/build_stream_ssl/ssl/bs_cert.pem && echo "EXISTS" || echo "NOT_FOUND"
      register: ssl_cert_check
      changed_when: false

    - name: Fail if SSL certificate is missing
      ansible.builtin.fail:
        msg: |
          ╔══════════════════════════════════════════════════════════════════════════════╗
          ║                    BUILD STREAM SSL CERTIFICATE MISSING                       ║
          ╠══════════════════════════════════════════════════════════════════════════════╣
          ║ Build stream SSL certificate not found at:
          ║ /opt/omnia/build_stream_ssl/ssl/bs_cert.pem
          ║
          ║ Ensure prepare_oim.yml has been successfully executed with
          ║ enable_build_stream: true before deploying GitLab.
          ╚══════════════════════════════════════════════════════════════════════════════╝
      when: "'NOT_FOUND' in ssl_cert_check.stdout"

    # =========================================================================
    # PREREQUISITE SUMMARY
    # =========================================================================

    - name: Display prerequisite check summary
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "  GITLAB PREREQUISITE CHECK SUMMARY"
          - "============================================"
          - ""
          - "BUILD STREAM:"
          - "  enable_build_stream:     {{ build_stream_enabled_check.stdout }}"
          - "  containers running:      {{ containers_check.stdout }}/2"
          - "  playbook_watcher:        {{ watcher_status.status.ActiveState | default('unknown') }}"
          - "  SSL certificate:         {{ ssl_cert_check.stdout }}"
          - ""
          - "============================================"

    # =========================================================================
    # RUN GITLAB PLAYBOOK
    # =========================================================================

    - name: Check if gitlab playbook exists in container
      ansible.builtin.shell:
        cmd: podman exec -it {{ container_name }} test -f {{ gitlab_playbook }} && echo "EXISTS" || echo "NOT_FOUND"
      register: playbook_check
      changed_when: false

    - name: Display playbook check result
      ansible.builtin.debug:
        msg: "gitlab.yml playbook ({{ gitlab_playbook }}): {{ playbook_check.stdout }}"

    - name: Execute gitlab playbook in omnia_core container
      ansible.builtin.shell:
        cmd: |
          podman exec -it -w /omnia/gitlab {{ container_name }} \
            ansible-playbook gitlab.yml -v
      register: playbook_result
      when: "'EXISTS' in playbook_check.stdout"
      changed_when: playbook_result.rc == 0
      failed_when: false

    - name: Display playbook stdout
      ansible.builtin.debug:
        var: playbook_result.stdout_lines
      when: playbook_result is defined and playbook_result.stdout_lines is defined

    - name: Display playbook execution result
      ansible.builtin.debug:
        msg: |
          ============================================
          GITLAB PLAYBOOK EXECUTION COMPLETE
          ============================================
          Return Code: {{ playbook_result.rc | default('N/A') }}
          ============================================
      when: playbook_result is defined

    - name: Fail if playbook execution failed
      ansible.builtin.fail:
        msg: |
          ╔══════════════════════════════════════════════════════════════════════════════╗
          ║                    GITLAB PLAYBOOK EXECUTION FAILED                           ║
          ╠══════════════════════════════════════════════════════════════════════════════╣
          ║ Exit Code: {{ playbook_result.rc }}
          ║
          ║ HOW TO DEBUG:
          ║   1. SSH to OIM server: ssh root@{{ ansible_host }}
          ║   2. Enter container: podman exec -it omnia_core bash
          ║   3. Run manually: cd /omnia/gitlab && ansible-playbook gitlab.yml -vvv
          ╚══════════════════════════════════════════════════════════════════════════════╝
      when: playbook_result is defined and playbook_result.rc is defined and playbook_result.rc != 0

    - name: Fail if playbook not found
      ansible.builtin.fail:
        msg: "gitlab playbook not found at {{ gitlab_playbook }}"
      when: "'NOT_FOUND' in playbook_check.stdout"
