---
- name: VAST Storage Integration Test Setup
  hosts: oim
  gather_facts: yes
  tasks:
    - name: Display test environment information
      debug:
        msg: |
          VAST Storage Integration Test Environment
          ==========================================
          Test Spec: TSPEC-STOR-2026-001 v1.0.0
          
          This test scenario validates:
          - Storage configuration parsing
          - Backend role assignment
          - InfiniBand network configuration
          - VAST NFS client installation
          - RDMA mount verification
          - PowerScale/PowerVault integration
          - Storage isolation (scratch, /tmp)
          - Slurm integration
          - Performance targets
          - Error handling and recovery
          
          Test Categories:
          - Functional (TC-001 to TC-063, TC-085-087)
          - Negative/Error (TC-010, TC-024, TC-033, TC-066, TC-069-073)
          - Performance (TC-027, TC-076-077)
          - Idempotency (TC-074-075)
          - Compatibility (TC-084)

    - name: Check if storage_config.yaml exists
      stat:
        path: /omnia/input/storage_config.yaml
      register: storage_config_stat

    - name: Create sample storage_config.yaml if not exists
      copy:
        dest: /omnia/input/storage_config.yaml
        content: |
          ---
          # VAST Storage Configuration
          vast:
            enabled: true
            fqdn: hpcpool.vast.corp.com
            export_path: /
            mount_points:
              - path: /home
                perms: "root:root:755"
              - path: /apps
                perms: "root:root:755"
              - path: /hpc_tools
                perms: "root:root:755"
              - path: /scratch
                perms: "root:root:1777"
              - path: /projects
                perms: "root:root:755"
            mount_options:
              proto: rdma
              port: 20049
              nconnect: 8
              rsize: 1048576
              wsize: 1048576
          
          # PowerScale Configuration
          powerscale:
            enabled: false
            server: powerscale.corp.com
            export_path: /ifs/omnia
            mount_points:
              - path: /cert
                perms: "root:root:755"
              - path: /etc/slurm/epilog.d
                perms: "slurm:slurm:755"
              - path: /etc/munge
                perms: "munge:munge:700"
              - path: /var/log/slurm
                perms: "slurm:slurm:755"
            mount_options:
              nfsvers: 3
              proto: tcp
              nconnect: 4
          
          # PowerVault Configuration
          powervault:
            enabled: false
            target: iqn.2003-01.com.dell:powervault
            portal: 10.10.10.10:3260
            mount_points:
              - path: /var/lib/mysql
                perms: "mysql:mysql:755"
              - path: /var/lib/slurm
                perms: "slurm:slurm:755"
          
          # Swap Configuration
          swap:
            enabled: false
            size: 8G
      when: not storage_config_stat.stat.exists

    - name: Check if pxe_mapping.csv exists
      stat:
        path: /omnia/input/pxe_mapping.csv
      register: pxe_mapping_stat

    - name: Create sample pxe_mapping.csv if not exists
      copy:
        dest: /omnia/input/pxe_mapping.csv
        content: |
          ADMIN_MAC,ADMIN_IP,BMC_MAC,BMC_IP,HOSTNAME,BOOT_NIC,BOOT_NIC_SUBNET,BMC_SERIAL,IB_MAC,IB_IP
          00:11:22:33:44:55,10.1.1.101,00:11:22:33:44:56,10.2.1.101,compute01,eth0,10.1.1.0/24,SN001,00:11:22:33:44:57,192.168.1.101
          00:11:22:33:44:58,10.1.1.102,00:11:22:33:44:59,10.2.1.102,compute02,eth0,10.1.1.0/24,SN002,00:11:22:33:44:5a,192.168.1.102
          00:11:22:33:44:5b,10.1.1.103,00:11:22:33:44:5c,10.2.1.103,controller01,eth0,10.1.1.0/24,SN003,,
          00:11:22:33:44:5d,10.1.1.104,00:11:22:33:44:5e,10.2.1.104,login01,eth0,10.1.1.0/24,SN004,00:11:22:33:44:5f,192.168.1.104
      when: not pxe_mapping_stat.stat.exists

    - name: Check if ansible inventory exists
      stat:
        path: /omnia/inventory/ansible_inventory.yml
      register: inventory_stat

    - name: Create sample ansible inventory if not exists
      copy:
        dest: /omnia/inventory/ansible_inventory.yml
        content: |
          all:
            children:
              slurm_node_x86_64:
                hosts:
                  10.1.1.101:
                    ansible_host: 10.1.1.101
                    hostname: compute01
                  10.1.1.102:
                    ansible_host: 10.1.1.102
                    hostname: compute02
              service_kube_control:
                hosts:
                  10.1.1.103:
                    ansible_host: 10.1.1.103
                    hostname: controller01
              login_node:
                hosts:
                  10.1.1.104:
                    ansible_host: 10.1.1.104
                    hostname: login01
      when: not inventory_stat.stat.exists

    - name: Display converge completion message
      debug:
        msg: |
          ==========================================
          VAST Storage test environment prepared
          ==========================================
          
          Configuration files created/verified:
          - /omnia/input/storage_config.yaml
          - /omnia/input/pxe_mapping.csv
          - /omnia/inventory/ansible_inventory.yml
          
          Ready to run test scenarios:
          - Functional tests (sanity/)
          - Negative tests (negative/)
          - Performance tests (performance/)
          
          Run: molecule verify
