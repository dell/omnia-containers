---
# =============================================================================
# Molecule Converge - Test job submission with insufficient resources
# =============================================================================

- name: Converge - Load configuration and setup inventory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default(playbook_dir + '/../..', true) }}"

  tasks:
    - name: Setup dynamic inventory
      ansible.builtin.include_tasks: ../shared/tasks/setup_inventory.yml

    - name: Set facts for Slurm control node play
      ansible.builtin.set_fact:
        user_config: "{{ user_config }}"
        cacheable: true


- name: Converge - Verify Slurm cluster resources and test insufficient resource handling
  hosts: slurm_control_node
  gather_facts: false

  vars:
    user_config: "{{ hostvars['localhost']['user_config'] }}"

  tasks:
    - name: Display target Slurm control node
      ansible.builtin.debug:
        msg: "Testing insufficient resources on: {{ ansible_host }}"

    - name: Check if slurmctld service is running
      ansible.builtin.shell:
        cmd: systemctl is-active slurmctld
      register: slurmctld_check
      changed_when: false
      failed_when: false

    - name: Fail if slurmctld is not running
      ansible.builtin.fail:
        msg: |
          slurmctld service is not running on {{ ansible_host }}.
          Please ensure Slurm is properly installed and configured.
      when: slurmctld_check.rc != 0

    # =========================================================================
    # GET CLUSTER RESOURCE INFORMATION
    # =========================================================================

    - name: Get cluster total resources
      ansible.builtin.shell:
        cmd: sinfo -N -o '%N|%c|%m|%G' --noheader
      register: cluster_resources
      changed_when: false

    - name: Display cluster resources
      ansible.builtin.debug:
        msg: |
          ============================================
          CLUSTER RESOURCE INFORMATION
          ============================================
          Node|CPUs|Memory|GPUs
          {{ cluster_resources.stdout }}
          ============================================

    - name: Get maximum available CPUs per node
      ansible.builtin.shell:
        cmd: sinfo -o '%c' --noheader | sort -n | tail -1
      register: max_cpus
      changed_when: false

    - name: Get maximum available memory per node (MB)
      ansible.builtin.shell:
        cmd: sinfo -o '%m' --noheader | sort -n | tail -1
      register: max_memory
      changed_when: false

    - name: Display max resources
      ansible.builtin.debug:
        msg: |
          Max CPUs per node: {{ max_cpus.stdout }}
          Max Memory per node: {{ max_memory.stdout }} MB

    # =========================================================================
    # TEST INSUFFICIENT CPU RESOURCES
    # =========================================================================

    - name: Calculate excessive CPU request
      ansible.builtin.set_fact:
        excessive_cpus: "{{ (max_cpus.stdout | int) * 10 }}"

    - name: Submit job with excessive CPU request
      ansible.builtin.shell:
        cmd: "sbatch --job-name=test_excess_cpu --cpus-per-task={{ excessive_cpus }} --time=00:01:00 --wrap='hostname' 2>&1"
      register: excess_cpu_job
      changed_when: false
      failed_when: false

    - name: Display excessive CPU job result
      ansible.builtin.debug:
        msg: |
          ============================================
          EXCESSIVE CPU JOB SUBMISSION RESULT
          ============================================
          Requested CPUs: {{ excessive_cpus }}
          Output: {{ excess_cpu_job.stdout }}
          Return Code: {{ excess_cpu_job.rc }}
          ============================================

    # =========================================================================
    # TEST INSUFFICIENT MEMORY RESOURCES
    # =========================================================================

    - name: Calculate excessive memory request (MB)
      ansible.builtin.set_fact:
        excessive_memory: "{{ (max_memory.stdout | int) * 10 }}"

    - name: Submit job with excessive memory request
      ansible.builtin.shell:
        cmd: "sbatch --job-name=test_excess_mem --mem={{ excessive_memory }} --time=00:01:00 --wrap='hostname' 2>&1"
      register: excess_mem_job
      changed_when: false
      failed_when: false

    - name: Display excessive memory job result
      ansible.builtin.debug:
        msg: |
          ============================================
          EXCESSIVE MEMORY JOB SUBMISSION RESULT
          ============================================
          Requested Memory: {{ excessive_memory }} MB
          Output: {{ excess_mem_job.stdout }}
          Return Code: {{ excess_mem_job.rc }}
          ============================================

    # =========================================================================
    # TEST INSUFFICIENT GPU RESOURCES
    # =========================================================================

    - name: Submit job requesting GPUs (may not be available)
      ansible.builtin.shell:
        cmd: "sbatch --job-name=test_gpu --gres=gpu:100 --time=00:01:00 --wrap='hostname' 2>&1"
      register: gpu_job
      changed_when: false
      failed_when: false

    - name: Display GPU job result
      ansible.builtin.debug:
        msg: |
          ============================================
          GPU JOB SUBMISSION RESULT
          ============================================
          Requested GPUs: 100
          Output: {{ gpu_job.stdout }}
          Return Code: {{ gpu_job.rc }}
          ============================================

    # =========================================================================
    # CHECK PENDING JOBS AND THEIR REASONS
    # =========================================================================

    - name: Get pending jobs with reasons
      ansible.builtin.shell:
        cmd: squeue -t PENDING -o '%i|%j|%T|%r' --noheader
      register: pending_jobs
      changed_when: false
      failed_when: false

    - name: Display pending jobs
      ansible.builtin.debug:
        msg: |
          ============================================
          PENDING JOBS WITH REASONS
          ============================================
          {{ pending_jobs.stdout | default('No pending jobs') }}
          ============================================

    # =========================================================================
    # CLEANUP TEST JOBS
    # =========================================================================

    - name: Cancel test jobs
      ansible.builtin.shell:
        cmd: scancel --name=test_excess_cpu --name=test_excess_mem --name=test_gpu 2>/dev/null || true
      changed_when: false
      failed_when: false

    - name: Insufficient resources converge complete
      ansible.builtin.debug:
        msg: |
          ============================================
          insufficient_resources converge complete!
          ============================================
          - Cluster resources: Retrieved
          - Excessive CPU job: Tested
          - Excessive memory job: Tested
          - GPU job: Tested
          - Ready for pytest verification
          ============================================
