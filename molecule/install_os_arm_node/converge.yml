---

- name: Converge - Load configuration and setup inventory
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Setup dynamic inventory
      ansible.builtin.include_tasks: ../shared/tasks/setup_inventory.yml

- name: Converge - Run install_os_arm_node prerequisite checks
  hosts: oim_server
  gather_facts: false
  vars:
    container_name: "omnia_core"
  tasks:
    - name: Verify omnia_core container is running
      ansible.builtin.shell: "podman ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -q {{ container_name }}"
      register: container_check
      failed_when: false
      changed_when: false

    - name: Fail if omnia_core container is not running
      ansible.builtin.fail:
        msg: "omnia_core container is not running. Run prepare_oim.yml first."
      when: container_check.rc != 0

    - name: Verify iso_config.yml exists in input project directory
      ansible.builtin.shell: >-
        podman exec {{ container_name }}
        test -f /opt/omnia/input/project_default/iso_config.yml
        && echo 'EXISTS' || echo 'NOT_FOUND'
      register: iso_config_check
      changed_when: false

    - name: Log iso_config.yml status
      ansible.builtin.debug:
        msg: "iso_config.yml: {{ iso_config_check.stdout | trim }}"

    - name: Execute install_os_arm_node.yml in omnia_core container
      ansible.builtin.shell: |
        podman exec -w /omnia/utils/install_os_arm_node {{ container_name }} \
          ansible-playbook install_os_arm_node.yml -v
      register: playbook_result
      failed_when: false
      changed_when: false

    - name: Display playbook output
      ansible.builtin.debug:
        msg: "{{ playbook_result.stdout_lines | default([]) }}"

    - name: Display playbook errors (if any)
      ansible.builtin.debug:
        msg: "{{ playbook_result.stderr_lines | default([]) }}"
      when: playbook_result.rc != 0
