---

- name: Converge - Load configuration and setup inventory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default(playbook_dir + '/../..', true) }}"

  tasks:
    - name: Setup dynamic inventory
      ansible.builtin.include_tasks: ../shared/tasks/setup_inventory.yml

    - name: Set facts for OIM server play
      ansible.builtin.set_fact:
        omnia_test_config: "{{ omnia_test_config }}"
        omnia_test_credentials: "{{ omnia_test_credentials }}"
        project_dir: "{{ project_dir }}"
        cacheable: true
      no_log: true

- name: Converge - Run install_os_arm_node prerequisite checks and playbook
  hosts: oim_server
  gather_facts: false

  vars:
    omnia_test_config: "{{ hostvars['localhost']['omnia_test_config'] }}"
    omnia_test_credentials: "{{ hostvars['localhost']['omnia_test_credentials'] }}"
    project_dir: "{{ hostvars['localhost']['project_dir'] }}"
    container_name: "omnia_core"
    install_os_arm_node_playbook: "/omnia/utils/install_os_arm_node/install_os_arm_node.yml"

  tasks:
    - name: Verify omnia_core container is running
      ansible.builtin.shell: "set -o pipefail && podman ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -q {{ container_name }}"
      register: container_check
      failed_when: false
      changed_when: false

    - name: Fail if omnia_core container is not running
      ansible.builtin.fail:
        msg: "omnia_core container is not running. Run prepare_oim.yml first."
      when: container_check.rc != 0

    - name: Ensure project_dir for sync
      ansible.builtin.set_fact:
        project_dir: "{{ project_dir | default(playbook_dir + '/../..') }}"

    - name: Sync project_default to container
      ansible.builtin.include_tasks: ../shared/tasks/sync_project_default.yml

    - name: Verify iso_config.yml exists in project_default input directory
      ansible.builtin.shell: >-
        podman exec {{ container_name }}
        test -f /opt/omnia/input/project_default/iso_config.yml
        && echo 'EXISTS' || echo 'NOT_FOUND'
      register: iso_config_check
      changed_when: false

    - name: Log iso_config.yml status
      ansible.builtin.debug:
        msg: "iso_config.yml: {{ iso_config_check.stdout | trim }}"

    - name: Execute install_os_arm_node.yml in omnia_core container
      ansible.builtin.shell: |
        podman exec -w /omnia/utils/install_os_arm_node {{ container_name }} \
          ansible-playbook install_os_arm_node.yml -v
      register: playbook_result
      failed_when: false
      changed_when: false

    - name: Display playbook output
      ansible.builtin.debug:
        msg: "{{ playbook_result.stdout_lines | default([]) }}"

    - name: Display playbook errors (if any)
      ansible.builtin.debug:
        msg: "{{ playbook_result.stderr_lines | default([]) }}"
      when: playbook_result.rc != 0
