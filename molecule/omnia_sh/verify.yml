---
# =============================================================================
# Molecule Verify - Verify omnia_core container is running
# =============================================================================

- name: Verify - Check omnia_core container installation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    container_name: "omnia_core"
    ssh_port: 2222

  tasks:
    - name: Load omnia_sh_config.yml
      ansible.builtin.include_vars:
        file: "{{ project_dir }}/omnia_sh_config.yml"
        name: omnia_sh_config

    # =========================================================================
    # Container Verification
    # =========================================================================

    - name: Check omnia_core container exists
      ansible.builtin.shell:
        cmd: podman ps -a --format '{{ '{{' }}.Names{{ '}}' }}' | grep -E '^{{ container_name }}$'
      register: container_exists
      changed_when: false
      failed_when: container_exists.rc != 0

    - name: Verify container is running
      ansible.builtin.shell:
        cmd: podman ps --format '{{ '{{' }}.Names{{ '}}' }} {{ '{{' }}.State{{ '}}' }}' | grep -E '^{{ container_name }} '
      register: container_state
      changed_when: false

    - name: Assert container is running
      ansible.builtin.assert:
        that:
          - "'running' in container_state.stdout.lower()"
        fail_msg: "Container {{ container_name }} is not running. State: {{ container_state.stdout }}"
        success_msg: "Container {{ container_name }} is running"

    # =========================================================================
    # SSH Verification
    # =========================================================================

    - name: Check SSH port is listening
      ansible.builtin.wait_for:
        port: "{{ ssh_port }}"
        host: localhost
        timeout: 30
      register: ssh_port_check

    - name: Test SSH connection to container (using ssh config)
      ansible.builtin.shell:
        cmd: ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 omnia_core 'echo SSH_OK'
      register: ssh_test
      changed_when: false
      failed_when: "'SSH_OK' not in ssh_test.stdout"

    - name: SSH connection verified
      ansible.builtin.debug:
        msg: "SSH connection to {{ container_name }} successful on port {{ ssh_port }}"

    # =========================================================================
    # Directory Verification
    # =========================================================================

    - name: Check omnia directory exists
      ansible.builtin.stat:
        path: "{{ omnia_sh_config.omnia_shared_path }}/omnia"
      register: omnia_dir

    - name: Assert omnia directory exists
      ansible.builtin.assert:
        that:
          - omnia_dir.stat.exists
          - omnia_dir.stat.isdir
        fail_msg: "Omnia directory not found at {{ omnia_sh_config.omnia_shared_path }}/omnia"
        success_msg: "Omnia directory exists"

    - name: Check SSH config directory exists
      ansible.builtin.stat:
        path: "{{ omnia_sh_config.omnia_shared_path }}/omnia/ssh_config/.ssh"
      register: ssh_config_dir

    - name: Assert SSH config directory exists
      ansible.builtin.assert:
        that:
          - ssh_config_dir.stat.exists
        fail_msg: "SSH config directory not found"
        success_msg: "SSH config directory exists"

    - name: Check log directory exists
      ansible.builtin.stat:
        path: "{{ omnia_sh_config.omnia_shared_path }}/omnia/log/core/container"
      register: log_dir

    - name: Assert log directory exists
      ansible.builtin.assert:
        that:
          - log_dir.stat.exists
        fail_msg: "Log directory not found"
        success_msg: "Log directory exists"

    - name: Check input directory exists
      ansible.builtin.stat:
        path: "{{ omnia_sh_config.omnia_shared_path }}/omnia/input"
      register: input_dir

    - name: Assert input directory exists
      ansible.builtin.assert:
        that:
          - input_dir.stat.exists
        fail_msg: "Input directory not found"
        success_msg: "Input directory exists"

    - name: Check metadata file exists
      ansible.builtin.stat:
        path: "{{ omnia_sh_config.omnia_shared_path }}/omnia/.data/oim_metadata.yml"
      register: metadata_file

    - name: Assert metadata file exists
      ansible.builtin.assert:
        that:
          - metadata_file.stat.exists
        fail_msg: "Metadata file not found at {{ omnia_sh_config.omnia_shared_path }}/omnia/.data/oim_metadata.yml"
        success_msg: "Metadata file exists"

    # =========================================================================
    # Systemd Service Verification
    # =========================================================================

    - name: Check systemd service status
      ansible.builtin.shell:
        cmd: systemctl is-active {{ container_name }}.service || true
      register: service_status
      changed_when: false

    - name: Display service status
      ansible.builtin.debug:
        msg: "Systemd service {{ container_name }}.service status: {{ service_status.stdout }}"

    # =========================================================================
    # Final Summary
    # =========================================================================

    - name: Verification Summary
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "       VERIFICATION PASSED"
          - "============================================"
          - "Container: {{ container_name }} - RUNNING"
          - "SSH Port: {{ ssh_port }} - LISTENING"
          - "SSH Connection: SUCCESSFUL"
          - "Directories: ALL PRESENT"
          - "Metadata: EXISTS"
          - "============================================"
