---
# =============================================================================
# Molecule Create - Setup inventory from user_config.yml
# =============================================================================

- name: Create - Setup OIM server inventory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    molecule_ephemeral_dir: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"

  tasks:
    - name: Load user_config.yml
      ansible.builtin.include_vars:
        file: "{{ project_dir }}/user_config.yml"
        name: user_config

    - name: Display OIM server details
      ansible.builtin.debug:
        msg:
          - "OIM Server IP: {{ user_config.oim_server_ip }}"
          - "OIM SSH User: {{ user_config.oim_ssh_user }}"
          - "OIM SSH Port: {{ user_config.oim_ssh_port | default(22) }}"

    - name: Create molecule inventory directory
      ansible.builtin.file:
        path: "{{ molecule_ephemeral_dir }}"
        state: directory
        mode: '0755'

    - name: Generate molecule inventory file
      ansible.builtin.copy:
        content: |
          ---
          all:
            hosts:
              oim_server:
                ansible_host: "{{ user_config.oim_server_ip }}"
                ansible_user: "{{ user_config.oim_ssh_user }}"
                ansible_password: "{{ user_config.oim_ssh_password }}"
                ansible_port: {{ user_config.oim_ssh_port | default(22) }}
                ansible_connection: ssh
                ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
                ansible_python_interpreter: /usr/bin/python3
        dest: "{{ molecule_ephemeral_dir }}/inventory/hosts.yml"
        mode: '0644'

    - name: Test SSH connection to OIM server
      ansible.builtin.wait_for:
        host: "{{ user_config.oim_server_ip }}"
        port: "{{ user_config.oim_ssh_port | default(22) }}"
        timeout: 30
      register: ssh_check

    - name: OIM server ready
      ansible.builtin.debug:
        msg: "OIM server {{ user_config.oim_server_ip }} is reachable via SSH"
