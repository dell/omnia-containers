# =============================================================================
# Molecule Inventory - Dynamic from user_config.yml
# =============================================================================
# This inventory file is generated/used by create.yml playbook
# OIM server details are read from user_config.yml
# =============================================================================

all:
  hosts:
    oim_server:
      # These will be populated by create.yml from user_config.yml
      ansible_host: "{{ oim_server_ip }}"
      ansible_user: "{{ oim_ssh_user }}"
      ansible_password: "{{ oim_ssh_password }}"
      ansible_port: "{{ oim_ssh_port | default(22) }}"
      ansible_connection: ssh
      ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
