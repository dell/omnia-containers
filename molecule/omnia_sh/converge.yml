---
# =============================================================================
# Molecule Converge - Run omnia.sh --install on OIM Server
# =============================================================================

- name: Converge - Load configuration locally
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"

  tasks:
    - name: Load omnia_sh_config.yml
      ansible.builtin.include_vars:
        file: "{{ project_dir }}/omnia_sh_config.yml"
        name: omnia_sh_config

    - name: Load user_config.yml
      ansible.builtin.include_vars:
        file: "{{ project_dir }}/user_config.yml"
        name: user_config

    - name: Set facts for OIM server play
      ansible.builtin.set_fact:
        omnia_sh_config: "{{ omnia_sh_config }}"
        user_config: "{{ user_config }}"
        cacheable: true


- name: Converge - Run omnia.sh --install on OIM server
  hosts: oim_server
  gather_facts: false

  vars:
    omnia_sh_path: "/opt/omnia-artifactory/omnia.sh"
    omnia_sh_config: "{{ hostvars['localhost']['omnia_sh_config'] }}"
    user_config: "{{ hostvars['localhost']['user_config'] }}"

  tasks:
    - name: Display target OIM server
      ansible.builtin.debug:
        msg: "Running omnia.sh --install on OIM server: {{ ansible_host }}"

    - name: Display configuration
      ansible.builtin.debug:
        msg:
          - "Share Option: {{ omnia_sh_config.share_option }}"
          - "NFS Type: {{ omnia_sh_config.nfs_type | default('N/A') }}"
          - "NFS Server IP: {{ user_config.nfs_server_ip | default('N/A') }}"
          - "NFS Share Path: {{ user_config.nfs_share_path | default('N/A') }}"
          - "Omnia Shared Path: {{ omnia_sh_config.omnia_shared_path }}"

    - name: Make omnia.sh executable
      ansible.builtin.file:
        path: "{{ omnia_sh_path }}"
        mode: '0755'

    - name: Create input file for NFS External
      ansible.builtin.copy:
        content: |
          1
          1
          {{ user_config.nfs_server_ip }}
          {{ user_config.nfs_share_path }}
          {{ omnia_sh_config.omnia_shared_path }}
          {{ omnia_sh_config.omnia_core_password }}
          {{ omnia_sh_config.omnia_core_password }}
        dest: /tmp/omnia_sh_inputs.txt
        mode: '0600'
      when: omnia_sh_config.share_option == "NFS" and omnia_sh_config.nfs_type == "external"

    - name: Create input file for NFS Internal
      ansible.builtin.copy:
        content: |
          1
          2
          {{ user_config.nfs_server_ip }}
          {{ user_config.nfs_share_path }}
          {{ omnia_sh_config.omnia_core_password }}
          {{ omnia_sh_config.omnia_core_password }}
        dest: /tmp/omnia_sh_inputs.txt
        mode: '0600'
      when: omnia_sh_config.share_option == "NFS" and omnia_sh_config.nfs_type == "internal"

    - name: Create input file for Local
      ansible.builtin.copy:
        content: |
          2
          {{ omnia_sh_config.omnia_shared_path }}
          {{ omnia_sh_config.omnia_core_password }}
          {{ omnia_sh_config.omnia_core_password }}
        dest: /tmp/omnia_sh_inputs.txt
        mode: '0600'
      when: omnia_sh_config.share_option == "Local"

    - name: Run omnia.sh --install with inputs
      ansible.builtin.shell:
        cmd: "{{ omnia_sh_path }} --install < /tmp/omnia_sh_inputs.txt"
      register: install_result
      timeout: 600

    - name: Remove input file
      ansible.builtin.file:
        path: /tmp/omnia_sh_inputs.txt
        state: absent

    - name: Display install output
      ansible.builtin.debug:
        var: install_result.stdout_lines
      when: install_result is defined

    - name: Wait for container to start
      ansible.builtin.shell:
        cmd: |
          for i in $(seq 1 30); do
            if podman ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -q omnia_core; then
              echo "Container started"
              exit 0
            fi
            sleep 2
          done
          echo "Timeout waiting for container"
          exit 1
      register: container_wait
      changed_when: false

    - name: Display install result
      ansible.builtin.debug:
        msg: "omnia.sh --install completed successfully on OIM server {{ ansible_host }}"
