# =============================================================================
# Molecule Configuration for omnia.sh Testing
# =============================================================================
#
# This scenario tests the omnia.sh script on the REMOTE OIM server.
# All playbooks and tests run on the OIM server specified in user_config.yml.
#
# USAGE:
# ------
# Default test (keeps container running for other tests):
#   molecule test -s omnia_sh
#
# Individual steps:
#   molecule create -s omnia_sh         # Create inventory only
#   molecule converge -s omnia_sh       # Run omnia.sh --install
#   molecule verify -s omnia_sh         # Run pytest verification tests
#   molecule cleanup -s omnia_sh        # Run omnia.sh --uninstall (MANUAL)
#
# Full cycle with cleanup (when you want fresh install):
#   molecule test -s omnia_sh && molecule cleanup -s omnia_sh
#
# Configuration:
#   - user_config.yml: OIM server IP, SSH credentials, NFS settings
#   - omnia_sh_config.yml: omnia.sh user inputs (share_option, password, paths)
#
# NOTE: Cleanup is NOT in the default test sequence. Container stays running
#       after tests so other modules can use it. Run cleanup manually when needed.
#
# =============================================================================

dependency:
  name: galaxy

driver:
  name: default

platforms:
  - name: oim_server

provisioner:
  name: ansible
  playbooks:
    create: create.yml
    prepare: prepare.yml
    converge: converge.yml
    cleanup: cleanup.yml
  env:
    ANSIBLE_VERBOSITY: 1
    ANSIBLE_HOST_KEY_CHECKING: "false"
    PYTHONPATH: "${MOLECULE_PROJECT_DIRECTORY}"

verifier:
  name: testinfra
  env:
    PYTHONPATH: "${MOLECULE_PROJECT_DIRECTORY}"
  options:
    v: true
    s: true
    tb: short
  additional_files_or_dirs:
    - "-v"

scenario:
  name: omnia_sh
  # Default test sequence - NO CLEANUP (container stays running)
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - verify
    # cleanup is NOT included - run manually: molecule cleanup -s omnia_sh
