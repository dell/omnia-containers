---
# =============================================================================
# Molecule Converge - Run prepare_oim.yml inside omnia_core container
# =============================================================================

- name: Converge - Load configuration and setup inventory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default(playbook_dir + '/../..', true) }}"

  tasks:
    - name: Setup dynamic inventory
      ansible.builtin.include_tasks: ../shared/tasks/setup_inventory.yml

    - name: Set facts for OIM server play
      ansible.builtin.set_fact:
        user_config: "{{ user_config }}"
        cacheable: true


- name: Converge - Copy input files and run prepare_oim.yml
  hosts: oim_server
  gather_facts: false

  vars:
    user_config: "{{ hostvars['localhost']['user_config'] }}"
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default(playbook_dir + '/../..', true) }}"
    input_dir: "{{ project_dir }}/input"
    oim_input_dir: "/opt/omnia/input/project_default"
    omnia_shared_path: "{{ user_config.omnia_shared_path | default('/opt/omnia') }}"
    prepare_oim_playbook: "/omnia/prepare_oim/prepare_oim.yml"
    ssh_alias: "omnia_core"

  tasks:
    - name: Display target OIM server
      ansible.builtin.debug:
        msg: "Running prepare_oim on OIM server: {{ ansible_host }}"

    - name: Check if omnia_core container is running
      ansible.builtin.shell:
        cmd: set -o pipefail && podman ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -q omnia_core
      args:
        executable: /bin/bash
      register: container_check
      changed_when: false
      failed_when: false

    - name: Fail if omnia_core container is not running
      ansible.builtin.fail:
        msg: |
          omnia_core container is not running on {{ ansible_host }}.
          Please run omnia.sh --install first.
      when: container_check.rc != 0

    # =========================================================================
    # COPY INPUT FILES INTO OMNIA_CORE CONTAINER
    # =========================================================================

    - name: Create temp directory on OIM server
      ansible.builtin.file:
        path: /tmp/omnia_input
        state: directory
        mode: '0755'

    - name: Copy input files from automation repo to OIM server
      ansible.posix.synchronize:
        src: "{{ input_dir }}/"
        dest: "/tmp/omnia_input/"
      delegate_to: localhost

    - name: Copy input files into omnia_core container
      ansible.builtin.command:
        cmd: podman cp /tmp/omnia_input/. omnia_core:{{ oim_input_dir }}/
      changed_when: true

    - name: Cleanup temp directory
      ansible.builtin.file:
        path: /tmp/omnia_input
        state: absent

    - name: Verify input files in container
      ansible.builtin.command:
        cmd: podman exec omnia_core ls -la {{ oim_input_dir }}/
      register: container_files
      changed_when: false

    - name: Display container input files
      ansible.builtin.debug:
        var: container_files.stdout_lines

    # =========================================================================
    # RUN PREPARE_OIM PLAYBOOK
    # =========================================================================

    - name: Check if prepare_oim playbook exists in container
      ansible.builtin.shell:
        cmd: podman exec omnia_core test -f /omnia/prepare_oim/prepare_oim.yml && echo "EXISTS" || echo "NOT_FOUND"
      register: playbook_check
      changed_when: false

    - name: Display playbook check result
      ansible.builtin.debug:
        msg: "prepare_oim playbook (/omnia/prepare_oim/prepare_oim.yml): {{ playbook_check.stdout }}"

    - name: Execute prepare_oim playbook in omnia_core container
      ansible.builtin.shell:
        cmd: |
          podman exec -w /omnia omnia_core \
            ansible-playbook prepare_oim/prepare_oim.yml -v \
            -e "config_file_status=true" \
            -e "cred_file_status=true" \
            --vault-password-file {{ oim_input_dir }}/.omnia_config_credentials_key
      register: playbook_result
      timeout: 1800
      when: "'EXISTS' in playbook_check.stdout"
      changed_when: playbook_result.rc == 0
      failed_when: false

    - name: Display playbook execution result
      ansible.builtin.debug:
        msg: |
          ============================================
          PREPARE_OIM PLAYBOOK EXECUTION OUTPUT
          ============================================
          Return Code: {{ playbook_result.rc | default('N/A') }}
          ============================================
      when: playbook_result is defined

    - name: Show full playbook output
      ansible.builtin.debug:
        var: playbook_result.stdout_lines
      when: playbook_result is defined and playbook_result.stdout_lines is defined

    - name: Fail if playbook execution failed
      ansible.builtin.fail:
        msg: |
          ╔══════════════════════════════════════════════════════════════════════════════╗
          ║                    PREPARE_OIM PLAYBOOK EXECUTION FAILED                     ║
          ╠══════════════════════════════════════════════════════════════════════════════╣
          ║ Exit Code: {{ playbook_result.rc }}
          ║
          ║ WHAT HAPPENED:
          ║   The prepare_oim.yml playbook failed during execution inside omnia_core.
          ║
          ║ POSSIBLE CAUSES:
          ║   - OpenCHAMI installation failed (check /opt/omnia/log/openchami/configs.log)
          ║   - Pulp container deployment failed (check /opt/omnia/log/pulp/)
          ║   - Network connectivity issues
          ║   - Missing or invalid configuration in input files
          ║   - Insufficient system resources (disk, memory)
          ║
          ║ HOW TO DEBUG:
          ║   1. SSH to OIM server: ssh root@{{ ansible_host }}
          ║   2. Check logs: ls -la /opt/omnia/log/
          ║   3. Check container status: podman ps -a
          ║   4. Re-run manually inside omnia_core container
          ║
          ║ STDERR:
          ║   {{ playbook_result.stderr | default('No error message') }}
          ╚══════════════════════════════════════════════════════════════════════════════╝
      when: playbook_result is defined and playbook_result.rc is defined and playbook_result.rc != 0

    - name: Fail if playbook not found
      ansible.builtin.fail:
        msg: "prepare_oim playbook not found at /omnia/prepare_oim/prepare_oim.yml"
      when: "'NOT_FOUND' in playbook_check.stdout"

    - name: Prepare OIM converge complete
      ansible.builtin.debug:
        msg: |
          ============================================
          prepare_oim converge complete!
          ============================================
          - omnia_core container: Running
          - prepare_oim playbook: Executed successfully
          - Ready for pytest verification
          ============================================
