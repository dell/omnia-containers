- name: Converge
  hosts: oim
  become: true
  tasks:
    - name: Run prepare_oim playbook inside omnia_core container on remote host
      command: >
        podman exec omnia_core /bin/bash -c
        'cd /omnia && ansible-playbook /omnia/prepare_oim/prepare_oim.yml'
      register: result

    - name: Show playbook output (stdout)
      debug:
        var: result.stdout

    - name: Show playbook errors (stderr)
      debug:
        var: result.stderr
