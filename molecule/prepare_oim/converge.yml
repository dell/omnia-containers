---
# =============================================================================
# Molecule Converge - Run prepare_oim.yml inside omnia_core container
# =============================================================================

- name: Converge - Load configuration and setup inventory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default(playbook_dir + '/../..', true) }}"

  tasks:
    - name: Setup dynamic inventory
      ansible.builtin.include_tasks: ../shared/tasks/setup_inventory.yml

    - name: Set facts for OIM server play
      ansible.builtin.set_fact:
        omnia_test_config: "{{ omnia_test_config }}"
        omnia_test_credentials: "{{ omnia_test_credentials }}"
        cacheable: true
      no_log: true


- name: Converge - Run prepare_oim.yml in omnia_core container
  hosts: oim_server
  gather_facts: false

  vars:
    omnia_test_config: "{{ hostvars['localhost']['omnia_test_config'] }}"
    omnia_test_credentials: "{{ hostvars['localhost']['omnia_test_credentials'] }}"
    oim_input_dir: "/opt/omnia/input/project_default"
    omnia_shared_path: "{{ omnia_test_config.omnia_shared_path | default('/opt/omnia') }}"
    prepare_oim_playbook: "/omnia/prepare_oim/prepare_oim.yml"

  tasks:
    - name: Display target OIM server
      ansible.builtin.debug:
        msg: "Running prepare_oim on OIM server: {{ ansible_host }}"

    - name: Check if omnia_core container is running
      ansible.builtin.shell:
        cmd: set -o pipefail && podman ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -q omnia_core
      args:
        executable: /bin/bash
      register: container_check
      changed_when: false
      failed_when: false

    - name: Fail if omnia_core container is not running
      ansible.builtin.fail:
        msg: |
          omnia_core container is not running on {{ ansible_host }}.
          Please run omnia.sh --install first.
      when: container_check.rc != 0

    # =========================================================================
    # SYNC PROJECT_DEFAULT INTO CONTAINER
    # =========================================================================

    - name: Ensure project_dir for sync
      ansible.builtin.set_fact:
        project_dir: "{{ project_dir | default(playbook_dir + '/../..') }}"

    - name: Sync project_default and generate vault key
      ansible.builtin.include_tasks: ../shared/tasks/sync_project_default.yml

    # =========================================================================
    # RUN PREPARE_OIM PLAYBOOK
    # =========================================================================

    - name: Check if prepare_oim playbook exists in container
      ansible.builtin.shell:
        cmd: podman exec -it omnia_core test -f /omnia/prepare_oim/prepare_oim.yml && echo "EXISTS" || echo "NOT_FOUND"
      register: playbook_check
      changed_when: false

    - name: Display playbook check result
      ansible.builtin.debug:
        msg: "prepare_oim playbook (/omnia/prepare_oim/prepare_oim.yml): {{ playbook_check.stdout }}"

    - name: Execute prepare_oim playbook in omnia_core container
      ansible.builtin.shell:
        cmd: |
          podman exec -it -w /omnia/prepare_oim omnia_core \
            ansible-playbook prepare_oim.yml -v
      register: playbook_result
      when: "'EXISTS' in playbook_check.stdout"
      changed_when: playbook_result.rc == 0
      failed_when: false

    - name: Display playbook stdout
      ansible.builtin.debug:
        var: playbook_result.stdout_lines
      when: playbook_result is defined and playbook_result.stdout_lines is defined

    - name: Display playbook execution result
      ansible.builtin.debug:
        msg: |
          ============================================
          PREPARE_OIM PLAYBOOK EXECUTION COMPLETE
          ============================================
          Return Code: {{ playbook_result.rc | default('N/A') }}
          ============================================
      when: playbook_result is defined

    - name: Fail if playbook execution failed
      ansible.builtin.fail:
        msg: |
          ╔══════════════════════════════════════════════════════════════════════════════╗
          ║                    PREPARE_OIM PLAYBOOK EXECUTION FAILED                     ║
          ╠══════════════════════════════════════════════════════════════════════════════╣
          ║ Exit Code: {{ playbook_result.rc }}
          ║
          ║ HOW TO DEBUG:
          ║   1. SSH to OIM server: ssh root@{{ ansible_host }}
          ║   2. Enter container: podman exec -it omnia_core bash
          ║   3. Check logs: ls -la /opt/omnia/log/
          ║   4. Check container status: podman ps -a
          ╚══════════════════════════════════════════════════════════════════════════════╝
      when: playbook_result is defined and playbook_result.rc is defined and playbook_result.rc != 0

    - name: Fail if playbook not found
      ansible.builtin.fail:
        msg: "prepare_oim playbook not found at /omnia/prepare_oim/prepare_oim.yml"
      when: "'NOT_FOUND' in playbook_check.stdout"
