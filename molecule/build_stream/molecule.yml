# =============================================================================
# Molecule Configuration for Build Stream Pipeline Validation
# =============================================================================
#
# This module validates build_stream pipeline automation including:
#   - Build stream API health
#   - PostgreSQL database tables
#   - GitLab server and runner status
#   - Pipeline triggering via catalog upload
#   - Stage-by-stage monitoring and DB verification
#
# PREREQUISITES:
# --------------
#   - omnia_core container running (omnia.sh --install completed)
#   - prepare_oim.yml completed (build_stream enabled)
#   - gitlab.yml completed (GitLab server deployed)
#
# USAGE:
# ------
#   ./run_molecule.sh build_stream verify    # Run verification only
#   ./run_molecule.sh build_stream test      # Run full test sequence
#
# Configuration:
#   - omnia_test_config.yml: OIM server connection settings
#   - build_stream_config.yml: Build stream configuration
#   - gitlab_config.yml: GitLab configuration
#
# =============================================================================

dependency:
  name: galaxy

driver:
  name: default
  options:
    managed: false

platforms:
  - name: oim_server

provisioner:
  name: ansible
  env:
    ANSIBLE_VERBOSITY: 1
    ANSIBLE_HOST_KEY_CHECKING: "false"

verifier:
  name: testinfra
  directory: ./tests/
  options:
    v: true
    s: true
    tb: short

scenario:
  name: build_stream
  test_sequence:
    - verify
