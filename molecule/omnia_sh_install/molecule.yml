# =============================================================================
# Molecule Configuration for Omnia.sh Install Testing
# =============================================================================
#
# This module tests the omnia.sh --install workflow.
# Tests only — no converge step (install is driven from within tests).
#
# PREREQUISITES:
# --------------
#   - Network access to GitHub (for omnia.sh download)
#   - NFS or Local storage configuration in omnia_test_config.yml
#   - omnia_core_password configured
#
# USAGE:
# ------
#   ./run_molecule.sh omnia_sh_install verify    # Run verification tests
#   ./run_molecule.sh omnia_sh_install test      # Full test sequence
# =============================================================================

dependency:
  name: galaxy

driver:
  name: default
  options:
    managed: false

platforms:
  - name: oim_server

provisioner:
  name: ansible
  playbooks:
    create: create.yml
    converge: converge.yml
  env:
    ANSIBLE_VERBOSITY: 1
    ANSIBLE_HOST_KEY_CHECKING: "false"

verifier:
  name: testinfra
  directory: ./tests/sanity
  options:
    v: true
    s: true
    tb: short

scenario:
  name: omnia_sh_install
  test_sequence:
    - verify
