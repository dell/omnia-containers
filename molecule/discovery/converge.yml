---
# =============================================================================
# Molecule Converge - Run discovery.yml inside omnia_core container
# =============================================================================

- name: Converge - Load configuration and setup inventory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default(playbook_dir + '/../..', true) }}"

  tasks:
    - name: Setup dynamic inventory
      ansible.builtin.include_tasks: ../shared/tasks/setup_inventory.yml

    - name: Set facts for OIM server play
      ansible.builtin.set_fact:
        omnia_test_config: "{{ omnia_test_config }}"
        cacheable: true


- name: Converge - Run discovery prerequisite checks and playbook
  hosts: oim_server
  gather_facts: false

  vars:
    omnia_test_config: "{{ hostvars['localhost']['omnia_test_config'] }}"
    container_name: "omnia_core"
    discovery_playbook: "/omnia/discovery/discovery.yml"
    provision_config_path: "/opt/omnia/input/project_default/provision_config.yml"
    build_stream_config_path: "/opt/omnia/input/project_default/build_stream_config.yml"
    converge_scenario: "discovery"

  tasks:
    - name: Display target OIM server
      ansible.builtin.debug:
        msg: "Running discovery on OIM server: {{ ansible_host }}"

    # =========================================================================
    # GUARD: ABORT IF BUILD_STREAM IS ENABLED
    # =========================================================================

    - name: Guard - abort converge if build_stream is enabled
      ansible.builtin.include_tasks: ../shared/tasks/check_build_stream.yml

    # =========================================================================
    # PREREQUISITE CHECKS
    # =========================================================================
    - name: Check if omnia_core container is running
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          podman ps --format "{{ '{{' }}.Names{{ '}}' }}" | grep -q "^{{ container_name }}$" && echo "RUNNING" || echo "NOT_RUNNING"
        executable: /bin/bash
      register: container_check
      changed_when: false

    - name: Fail if omnia_core container not running
      ansible.builtin.fail:
        msg: |
          ╔══════════════════════════════════════════════════════════════════════════════╗
          ║                    OMNIA_CORE CONTAINER NOT RUNNING                          ║
          ╠══════════════════════════════════════════════════════════════════════════════╣
          ║ HOW TO FIX:                                                                  ║
          ║   1. Run: omnia.sh --install                                                 ║
          ║   2. Or check: podman ps -a | grep omnia_core                                ║
          ╚══════════════════════════════════════════════════════════════════════════════╝
      when: "'NOT_RUNNING' in container_check.stdout"

    # =========================================================================
    # SYNC PROJECT_DEFAULT INTO CONTAINER
    # =========================================================================
    - name: Ensure project_dir for sync
      ansible.builtin.set_fact:
        project_dir: "{{ project_dir | default(playbook_dir + '/../..') }}"

    - name: Sync project_default to container
      ansible.builtin.include_tasks: ../shared/tasks/sync_project_default.yml

    - name: Read provision_config.yml to get pxe_mapping_file_path
      ansible.builtin.command:
        cmd: podman exec {{ container_name }} cat {{ provision_config_path }}
      register: provision_config_content
      changed_when: false

    - name: Extract pxe_mapping_file_path from provision_config.yml
      ansible.builtin.set_fact:
        pxe_mapping_file_path: >-
          {{ provision_config_content.stdout |
             regex_search('pxe_mapping_file_path:\s*["\']?([^"\'#\n]+)["\']?', '\1') |
             first | default('') | trim }}

    - name: Display extracted pxe_mapping_file_path
      ansible.builtin.debug:
        msg: "PXE mapping file path from provision_config.yml: {{ pxe_mapping_file_path | default('NOT FOUND') }}"

    - name: Check if PXE mapping file exists
      ansible.builtin.shell:
        cmd: podman exec {{ container_name }} test -f {{ pxe_mapping_file_path }} && echo "EXISTS" || echo "NOT_FOUND"
      register: pxe_mapping_check
      changed_when: false
      when: pxe_mapping_file_path | default('') | length > 0

    - name: Display PXE mapping check result
      ansible.builtin.debug:
        msg: "PXE mapping file: {{ pxe_mapping_check.stdout | default('SKIPPED - path not found') }}"

    # =========================================================================
    # PREREQUISITE SUMMARY
    # =========================================================================
    - name: Display prerequisite check summary
      ansible.builtin.debug:
        msg: |
          ============================================
          DISCOVERY PREREQUISITE CHECK SUMMARY
          ============================================
          omnia_core container:    {{ container_check.stdout }}
          pxe_mapping_file.csv:    {{ pxe_mapping_check.stdout | default('NOT FOUND') }}
          ============================================

    # =========================================================================
    # RUN DISCOVERY PLAYBOOK
    # =========================================================================
    - name: Check if discovery playbook exists in container
      ansible.builtin.shell:
        cmd: podman exec {{ container_name }} test -f {{ discovery_playbook }} && echo "EXISTS" || echo "NOT_FOUND"
      register: playbook_check
      changed_when: false

    - name: Display playbook check result
      ansible.builtin.debug:
        msg: "discovery.yml playbook ({{ discovery_playbook }}): {{ playbook_check.stdout }}"

    - name: Execute discovery playbook in omnia_core container
      ansible.builtin.shell:
        cmd: |
          podman exec -w /omnia {{ container_name }} \
            ansible-playbook discovery/discovery.yml -v
      register: playbook_result
      when: "'EXISTS' in playbook_check.stdout"
      changed_when: playbook_result.rc == 0
      failed_when: false

    - name: Display playbook execution result
      ansible.builtin.debug:
        msg: |
          ============================================
          DISCOVERY PLAYBOOK EXECUTION COMPLETE
          ============================================
          Return Code: {{ playbook_result.rc | default('N/A') }}
          ============================================
      when: playbook_result is defined

    - name: Fail if playbook execution failed
      ansible.builtin.fail:
        msg: |
          ╔══════════════════════════════════════════════════════════════════════════════╗
          ║                    DISCOVERY PLAYBOOK EXECUTION FAILED                       ║
          ╠══════════════════════════════════════════════════════════════════════════════╣
          ║ Exit Code: {{ playbook_result.rc }}
          ║
          ║ WHAT HAPPENED:
          ║   The discovery.yml playbook failed during execution inside omnia_core.
          ║
          ║ HOW TO DEBUG:
          ║   1. SSH to OIM server: ssh root@{{ ansible_host }}
          ║   2. Enter container: podman exec -it omnia_core bash
          ║   3. Check logs: cat /opt/omnia/log/omnia.log
          ║   4. Check OpenCHAMI: ochami smd component get
          ╚══════════════════════════════════════════════════════════════════════════════╝
      when: playbook_result is defined and playbook_result.rc is defined and playbook_result.rc != 0

    - name: Fail if playbook not found
      ansible.builtin.fail:
        msg: "discovery playbook not found at {{ discovery_playbook }}"
      when: "'NOT_FOUND' in playbook_check.stdout"

    - name: Check minimal OS functional groups in container
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          podman exec {{ container_name }} cat /opt/omnia/.data/functional_groups_config.yml 2>/dev/null | \
            grep -E "os_x86_64|os_aarch64" || echo "NO_MINIMAL_OS"
      register: minimal_os_groups
      changed_when: false
      failed_when: false

    - name: Display minimal OS groups status
      ansible.builtin.debug:
        msg: |
          ============================================
          MINIMAL OS FUNCTIONAL GROUPS
          ============================================
          {% if 'NO_MINIMAL_OS' not in minimal_os_groups.stdout %}
          ✓ Minimal OS groups found in configuration
          {{ minimal_os_groups.stdout }}
          {% else %}
          ⚠ No minimal OS groups configured (optional)
          {% endif %}
          ============================================

    - name: Check minimal OS nodes in PXE mapping
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          podman exec {{ container_name }} cat {{ provision_config_path }} 2>/dev/null | \
            grep pxe_mapping_file_path | awk '{print $2}' | tr -d '"' | \
            xargs -I {} podman exec {{ container_name }} cat {} 2>/dev/null | \
            grep -E "os_x86_64|os_aarch64" || echo "NO_MINIMAL_OS_NODES"
      register: minimal_os_nodes
      changed_when: false
      failed_when: false

    - name: Display minimal OS nodes status
      ansible.builtin.debug:
        msg: |
          ============================================
          MINIMAL OS NODES IN PXE MAPPING
          ============================================
          {% if 'NO_MINIMAL_OS_NODES' not in minimal_os_nodes.stdout %}
          ✓ Minimal OS nodes found in PXE mapping
          {{ minimal_os_nodes.stdout }}
          {% else %}
          ⚠ No minimal OS nodes in PXE mapping (optional)
          {% endif %}
          ============================================

    - name: Discovery converge complete
      ansible.builtin.debug:
        msg: |
          ============================================
          DISCOVERY CONVERGE COMPLETE!
          ============================================
          Discovery playbook executed successfully
          Minimal OS: {{ 'Configured' if 'NO_MINIMAL_OS' not in minimal_os_groups.stdout else 'Not configured' }}
          ============================================
          - omnia_core container: Running
          - Prerequisites: Checked
          - discovery.yml playbook: Executed successfully
          - Ready for pytest verification
          ============================================
