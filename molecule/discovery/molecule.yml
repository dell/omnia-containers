# =============================================================================
# Molecule Configuration for Discovery Testing
# =============================================================================
#
# This module runs discovery.yml playbook inside omnia_core container
# and verifies the BMC discovery via OME was successful.
#
# PREREQUISITES:
# --------------
#   - omnia_core container running (omnia.sh --install completed)
#   - prepare_oim.yml completed
#   - discovery_config.yml configured with OME IP
#   - OME credentials in omnia_config_credentials.yml
#
# USAGE:
# ------
#   ./run_molecule.sh discovery test       # Run prereq checks + playbook + verify
#   ./run_molecule.sh discovery converge   # Run playbook only
#   ./run_molecule.sh discovery verify     # Verify only
#
# Configuration:
#   - omnia_test_config.yml: OIM server connection settings
#   - discovery_config.yml: OME IP and enable_bmc_discovery flag
#
# =============================================================================

dependency:
  name: galaxy

driver:
  name: default
  options:
    managed: false

platforms:
  - name: oim_server

provisioner:
  name: ansible
  playbooks:
    create: create.yml
    converge: converge.yml
  env:
    ANSIBLE_VERBOSITY: 1
    ANSIBLE_HOST_KEY_CHECKING: "false"

verifier:
  name: testinfra
  options:
    v: true
    s: true
    tb: short

scenario:
  name: discovery
  test_sequence:
    - dependency
    - syntax
    - create
    - converge
    - verify