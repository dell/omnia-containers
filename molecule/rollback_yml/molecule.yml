# =============================================================================
# Molecule Configuration for rollback.yml Component Rollback Testing
# =============================================================================
#
# This module validates the per-component rollback.yml workflow:
#   - Pre-flight: Container running, rollback.yml present
#   - Lock check: No upgrade currently in progress
#   - Rollback:   Run rollback.yml (all components in reverse order)
#   - Verify:     rollback_manifest.yml per-component status
#
# Rollback order (reverse of upgrade):
#   slurm -> k8s -> build_stream -> oim
#
# PREREQUISITES:
# --------------
#   - omnia_core container running (post-upgrade state)
#   - An upgrade has already been performed
#   - rollback.yml present inside omnia_core container
#   - 'upgrade' section configured in omnia_test_config.yml
#
# USAGE:
# ------
#   ./run_molecule.sh rollback_yml verify     # Run verification tests
#   ./run_molecule.sh rollback_yml test        # Full test sequence
#
# =============================================================================

dependency:
  name: galaxy

driver:
  name: default
  options:
    managed: false

platforms:
  - name: oim_server

provisioner:
  name: ansible
  env:
    ANSIBLE_VERBOSITY: 1
    ANSIBLE_HOST_KEY_CHECKING: "false"

verifier:
  name: testinfra
  directory: ./tests/sanity
  options:
    v: true
    s: true
    tb: short

scenario:
  name: rollback_yml
  test_sequence:
    - verify
