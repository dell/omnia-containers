# =============================================================================
# DCGM Molecule Variables
# =============================================================================

container_name: "omnia_core"
gpu_playbook: "/omnia/utils/hpc_tools/gpu.yml"
gpu_inventory: "/omnia/inventory"

# CUDA toolkit shared NFS path
cuda_install_path: "/hpc_tools/cuda"

# DCGM service name
dcgm_service: "nvidia-dcgm.service"

# Minimum expected GPU count for multi-GPU test
expected_multi_gpu_count: 4
