# =============================================================================
# Molecule Configuration for DCGM Testing
# =============================================================================
#
# This module runs the Omnia GPU/DCGM provisioning playbook inside the
# omnia_core container and verifies the deployment on GPU nodes.
#
# PREREQUISITES:
# --------------
#   - omnia_core container running (omnia.sh --install completed)
#   - GPU nodes (slurm_node_x86_64) provisioned and reachable
#   - NVIDIA drivers installed on GPU nodes
#   - CUDA 13.x+ toolkit available in Pulp local repo
#   - /hpc_tools NFS mount configured on all cluster nodes
#   - pxe_mapping_file.csv contains slurm_node_x86_64 entries
#   - DCGM metrics enabled in /opt/omnia/input/project_default/telemetry_config.yml
#     (dcgm.metrics_enabled: true)
#
# USAGE:
# ------
#   ./run_molecule.sh dcgm test       # Run prereq checks + playbook + verify
#   ./run_molecule.sh dcgm converge   # Run GPU playbook only
#   ./run_molecule.sh dcgm verify     # Verify only (sanity tests)
#
#   To run negative tests:
#   pytest molecule/dcgm/tests/negative/ -v -s
#
# Configuration:
#   - omnia_test_config.yml: OIM server connection settings
#
# Test Spec: TSPEC-DCGM-2026-001 v1.0.0
# =============================================================================

dependency:
  name: galaxy

driver:
  name: default
  options:
    managed: false

platforms:
  - name: oim_server

provisioner:
  name: ansible
  playbooks:
    create: create.yml
    converge: converge.yml
  env:
    ANSIBLE_VERBOSITY: 1
    ANSIBLE_HOST_KEY_CHECKING: "false"

verifier:
  name: testinfra
  directory: tests/sanity
  options:
    v: true
    s: true
    tb: short

scenario:
  name: dcgm
  test_sequence:
    - dependency
    - syntax
    - create
    - converge
    - verify
