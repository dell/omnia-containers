# =============================================================================
# Shared task to sync project_default into omnia_core container and encrypt
# credential files using the same mechanism as Omnia playbooks
# =============================================================================

- name: Set project_default paths
  ansible.builtin.set_fact:
    project_default_src: "{{ project_dir }}/datasets/{{ omnia_test_config.dataset | default('project_default') }}"
    project_default_dest: "/opt/omnia/input/project_default"
    omnia_config_credentials_file: "omnia_config_credentials.yml"
    omnia_config_credentials_key: ".omnia_config_credentials_key"

- name: Sync project_default to container via rsync  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: >
      rsync -avz --delete
      -e "sshpass -p '{{ omnia_test_config.omnia_core_password }}' ssh -p 2222
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      {{ project_default_src }}/
      root@{{ ansible_host }}:{{ project_default_dest }}/
  delegate_to: localhost
  changed_when: true

# =============================================================================
# CREATE VAULT KEY AND ENCRYPT CREDENTIALS (same as Omnia mechanism)
# =============================================================================

- name: Check if vault key exists in container
  ansible.builtin.shell:
    cmd: >
      sshpass -p '{{ omnia_test_config.omnia_core_password }}' ssh -p 2222
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      root@{{ ansible_host }}
      "test -f {{ project_default_dest }}/{{ omnia_config_credentials_key }} && echo EXISTS || echo NOT_FOUND"
  delegate_to: localhost
  register: vault_key_check
  changed_when: false

- name: Create vault key file in container (32 char random password)  # noqa: risky-shell-pipe
  ansible.builtin.shell:
    cmd: >
      sshpass -p '{{ omnia_test_config.omnia_core_password }}' ssh -p 2222
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      root@{{ ansible_host }}
      "head -c 32 /dev/urandom | base64 | head -c 32 > {{ project_default_dest }}/{{ omnia_config_credentials_key }} &&
      chmod 600 {{ project_default_dest }}/{{ omnia_config_credentials_key }}"
  delegate_to: localhost
  changed_when: true
  when: vault_key_check.stdout == "NOT_FOUND"

- name: Check if credentials file is already encrypted  # noqa: risky-shell-pipe
  ansible.builtin.shell:
    cmd: >
      sshpass -p '{{ omnia_test_config.omnia_core_password }}' ssh -p 2222
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      root@{{ ansible_host }}
      "head -n1 {{ project_default_dest }}/{{ omnia_config_credentials_file }} 2>/dev/null | grep -q 'ANSIBLE_VAULT' && echo ENCRYPTED || echo PLAIN"
  delegate_to: localhost
  register: cred_file_check
  changed_when: false
  failed_when: false

- name: Encrypt omnia_config_credentials.yml in container
  ansible.builtin.shell:
    cmd: >
      sshpass -p '{{ omnia_test_config.omnia_core_password }}' ssh -p 2222
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      root@{{ ansible_host }}
      "cd {{ project_default_dest }} &&
      ansible-vault encrypt {{ omnia_config_credentials_file }}
      --vault-password-file {{ omnia_config_credentials_key }}"
  delegate_to: localhost
  changed_when: true
  when: cred_file_check.stdout == "PLAIN"

- name: Display sync and encryption result
  ansible.builtin.debug:
    msg: "project_default synced and credentials encrypted on {{ ansible_host }}"
