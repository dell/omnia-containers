---
# =============================================================================
# Shared Task: Build Stream Guard
#
# Abort molecule converge if build_stream is enabled. When build_stream is
# enabled the pipeline (build_image / local_repo / discovery) is orchestrated
# automatically by the build_stream API. Running converge manually on top of
# it would cause conflicts or duplicate runs.
#
# Usage (in any converge.yml oim_server play):
#
#   vars:
#     build_stream_config_path: "/opt/omnia/input/project_default/build_stream_config.yml"
#     container_name: "omnia_core"          # container that has the config
#     converge_scenario: "build_image_x86_64"   # shown in the error message
#
#   tasks:
#     - name: Guard - abort if build_stream enabled
#       ansible.builtin.include_tasks: ../shared/tasks/check_build_stream.yml
# =============================================================================


- name: "[build_stream guard] Read build_stream_config.yml from container"
  ansible.builtin.shell:
    cmd: >
      podman exec {{ container_name }} cat {{ build_stream_config_path }} 2>/dev/null || echo ""
  register: _bs_config_raw
  changed_when: false

- name: "[build_stream guard] Detect enable_build_stream flag"
  ansible.builtin.set_fact:
    build_stream_enabled: >-
      {{ (_bs_config_raw.stdout
      | regex_search('^enable_build_stream:\s*(\S+)', multiline=True)
      | default(''))
      | regex_replace('^enable_build_stream:\s*', '')
      | default('false') }}

- name: "[build_stream guard] Abort converge when build_stream is enabled"
  ansible.builtin.fail:
    msg: |
      ╔══════════════════════════════════════════════════════════════════════════════╗
      ║             BUILD STREAM IS ENABLED — CONVERGE SKIPPED                       ║
      ╠══════════════════════════════════════════════════════════════════════════════╣
      ║                                                                               ║
      ║  build_stream is currently ENABLED in build_stream_config.yml.               ║
      ║                                                                               ║
      ║  When build_stream is enabled, the {{ converge_scenario }} pipeline is       ║
      ║  managed automatically by the build_stream API and must NOT be triggered     ║
      ║  manually via molecule converge.                                              ║
      ║                                                                               ║
      ║  WHAT TO DO:                                                                  ║
      ║    To run molecule verify (tests only) without re-running the playbook:      ║
      ║      molecule verify -s {{ converge_scenario }}                               ║
      ║                                                                               ║
      ║    To run the full converge (playbook + tests) without build_stream:         ║
      ║      1. Set enable_build_stream: false in build_stream_config.yml             ║
      ║      2. Re-run: molecule converge -s {{ converge_scenario }}                  ║
      ║      3. Re-enable: set enable_build_stream: true when done                   ║
      ║                                                                               ║
      ╚══════════════════════════════════════════════════════════════════════════════╝
  when: build_stream_enabled | bool
