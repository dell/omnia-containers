# =============================================================================
# Shared task to setup dynamic inventory from omnia_test_config.yml
# Include this in playbooks that need to connect to OIM server
# =============================================================================

- name: Load omnia_test_config.yml
  ansible.builtin.include_vars:
    file: "{{ project_dir }}/omnia_test_config.yml"
    name: user_config
  no_log: true

- name: Add OIM server to inventory dynamically
  ansible.builtin.add_host:
    name: oim_server
    groups: oim
    ansible_host: "{{ user_config.oim_server_ip }}"
    ansible_user: "{{ user_config.oim_ssh_user | default('root') }}"
    ansible_password: "{{ user_config.oim_ssh_password }}"
    ansible_port: "{{ user_config.oim_ssh_port | default(22) }}"
    ansible_connection: ssh
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
  no_log: true

- name: Display target server
  ansible.builtin.debug:
    msg: "Target OIM server: {{ user_config.oim_server_ip }}"
