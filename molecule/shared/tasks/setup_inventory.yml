# =============================================================================
# Shared task to setup dynamic inventory from omnia_test_config.yml
# Include this in playbooks that need to connect to OIM server
# =============================================================================

- name: Load omnia_test_config.yml (plain text)
  ansible.builtin.include_vars:
    file: "{{ project_dir }}/omnia_test_config.yml"
    name: omnia_test_config

- name: Determine execution mode (local vs remote)
  ansible.builtin.set_fact:
    _oim_local_mode: "{{ (omnia_test_config.oim_server_ip | default('') | trim) in ['', 'localhost', '127.0.0.1'] }}"

- name: Add OIM server to inventory (remote mode)
  ansible.builtin.add_host:
    name: oim_server
    groups: oim
    ansible_host: "{{ omnia_test_config.oim_server_ip }}"
    ansible_user: "{{ omnia_test_config.oim_ssh_user | default('root') }}"
    ansible_password: "{{ omnia_test_config.oim_ssh_password }}"
    ansible_port: "{{ omnia_test_config.oim_ssh_port | default(22) }}"
    ansible_connection: ssh
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
  no_log: true
  when: not _oim_local_mode

- name: Add OIM server to inventory (local mode)
  ansible.builtin.add_host:
    name: oim_server
    groups: oim
    ansible_host: localhost
    ansible_connection: local
  when: _oim_local_mode

- name: Display target server
  ansible.builtin.debug:
    msg: >-
      Target OIM server: {{ 'localhost (local mode)' if _oim_local_mode
      else omnia_test_config.oim_server_ip ~ ' (remote via SSH)' }}
