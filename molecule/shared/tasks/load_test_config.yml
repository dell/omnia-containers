# =============================================================================
# Shared task to load omnia_test_config.yml (plain text - no encryption)
#
# Usage:
#   - name: Load test config
#     ansible.builtin.include_tasks: "{{ project_dir }}/molecule/shared/tasks/load_test_config.yml"
#
# Note:
#   - Config file contains non-sensitive settings (IPs, paths, options)
#   - Sensitive credentials are in omnia_test_credentials.yml (encrypted)
# =============================================================================

- name: Define config path
  ansible.builtin.set_fact:
    _config_file: "{{ project_dir }}/omnia_test_config.yml"

- name: Load config (plain text)
  ansible.builtin.include_vars:
    file: "{{ _config_file }}"
    name: omnia_test_config

- name: Config loaded successfully
  ansible.builtin.debug:
    msg: "omnia_test_config.yml loaded successfully"
