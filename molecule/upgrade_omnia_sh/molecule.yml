# =============================================================================
# Molecule Configuration for Omnia Upgrade Testing
# =============================================================================
#
# This module tests the Omnia upgrade workflow (e.g., 2.1.0.0 → 2.2.0.0).
# Tests only — no converge step (upgrade is driven from within tests).
#
# PREREQUISITES:
# --------------
#   - omnia_core container running at the FROM version (e.g., 2.1.0.0)
#   - omnia.sh --install already completed on OIM server
#   - Network access to clone omnia-artifactory repo
#   - 'upgrade' section configured in omnia_test_config.yml
#
# USAGE:
# ------
#   ./run_molecule.sh upgrade_omnia_sh verify     # Run verification tests
#   ./run_molecule.sh upgrade_omnia_sh test        # Full test sequence
#
# Configuration (omnia_test_config.yml):
#   upgrade:
#     operation: "upgrade"        # "upgrade" | "rollback" | "" (fail all)
#     current_version: "2.1.0.0"  # version running NOW
#     new_version: "2.2.0.0"      # target version
#     repo_url: "https://github.com/dell/omnia-artifactory.git"
#     repo_branch: "omnia-container"
#     omnia_branch: "pub/q2_upgrade"
#
# =============================================================================

dependency:
  name: galaxy

driver:
  name: default
  options:
    managed: false

platforms:
  - name: oim_server

provisioner:
  name: ansible
  env:
    ANSIBLE_VERBOSITY: 1
    ANSIBLE_HOST_KEY_CHECKING: "false"

verifier:
  name: testinfra
  directory: ./tests/sanity
  options:
    v: true
    s: true
    tb: short

scenario:
  name: upgrade_omnia_sh
  test_sequence:
    - verify
