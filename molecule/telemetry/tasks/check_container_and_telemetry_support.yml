# Check omnia_core container and idrac_telemetry_support
---
- name: Check if omnia_core container is running
  ansible.builtin.shell:
    cmd: set -o pipefail && podman ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -q omnia_core
  args:
    executable: /bin/bash
  register: container_check
  changed_when: false
  failed_when: false

- name: Fail if omnia_core container is not running
  ansible.builtin.fail:
    msg: |
      omnia_core container is not running on {{ ansible_host }}.
      Please run omnia.sh --install first.
  when: container_check.rc != 0

- name: Read telemetry_config.yml from container
  ansible.builtin.command:
    cmd: podman exec {{ container_name }} cat /opt/omnia/input/project_default/telemetry_config.yml
  register: telemetry_config_content
  changed_when: false

- name: Check if idrac_telemetry_support is enabled
  ansible.builtin.set_fact:
    idrac_telemetry_support: >-
      {{ telemetry_config_content.stdout |
         regex_search('idrac_telemetry_support:\s*(true|false)', '\1') |
         first | default('false') | lower }}

- name: Display idrac_telemetry_support value
  ansible.builtin.debug:
    msg: "idrac_telemetry_support: {{ idrac_telemetry_support }}"

- name: Fail if idrac_telemetry_support is not enabled
  ansible.builtin.fail:
    msg: |
      ╔══════════════════════════════════════════════════════════════════════════════╗
      ║                    PREREQUISITE CHECK FAILED                                  ║
      ╠══════════════════════════════════════════════════════════════════════════════╣
      ║ idrac_telemetry_support is disabled in telemetry_config.yml
      ║
      ║ Current value: {{ idrac_telemetry_support }}
      ║
      ║ HOW TO FIX:
      ║   1. Edit telemetry_config.yml and set idrac_telemetry_support: true
      ║   2. Run provision again with iDRAC telemetry support enabled
      ╚══════════════════════════════════════════════════════════════════════════════╝
  when: idrac_telemetry_support != 'true'
