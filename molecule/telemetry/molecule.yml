# =============================================================================
# Molecule Configuration for Telemetry Testing
# =============================================================================
#
# This module runs telemetry.yml playbook inside omnia_core container
# and verifies the telemetry deployment was successful.
#
# PREREQUISITES:
# --------------
#   - omnia_core container running (omnia.sh --install completed)
#   - prepare_oim.yml completed
#   - Service K8s cluster deployed
#   - provision_config.yml with pxe_mapping_file_path configured
#   - bmc_group_data.csv exists
#   - service_cluster_metadata.yml exists
#
# USAGE:
# ------
#   ./run_molecule.sh telemetry test       # Run prereq checks + playbook + verify
#   ./run_molecule.sh telemetry converge   # Run playbook only
#   ./run_molecule.sh telemetry verify     # Verify only
#
# Configuration:
#   - user_config.yml: OIM server connection settings
#
# =============================================================================

dependency:
  name: galaxy

driver:
  name: default
  options:
    managed: false

platforms:
  - name: oim_server

provisioner:
  name: ansible
  playbooks:
    create: create.yml
    converge: converge.yml
  env:
    ANSIBLE_VERBOSITY: 1
    ANSIBLE_HOST_KEY_CHECKING: "false"

verifier:
  name: testinfra
  options:
    v: true
    s: true
    tb: short

scenario:
  name: telemetry
  test_sequence:
    - dependency
    - syntax
    - create
    - converge
    - verify
