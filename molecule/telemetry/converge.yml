---
# =============================================================================
# Molecule Converge - Run telemetry.yml inside omnia_core container
# =============================================================================

- name: Converge - Load configuration and setup inventory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default(playbook_dir + '/../..', true) }}"

  tasks:
    - name: Setup dynamic inventory
      ansible.builtin.include_tasks: ../shared/tasks/setup_inventory.yml

    - name: Set facts for OIM server play
      ansible.builtin.set_fact:
        omnia_test_config: "{{ omnia_test_config }}"
        cacheable: true
      no_log: true


- name: Converge - Run telemetry prerequisite checks and playbook
  hosts: oim_server
  gather_facts: false

  vars:
    omnia_test_config: "{{ hostvars['localhost']['omnia_test_config'] }}"
    omnia_shared_path: "{{ omnia_test_config.omnia_shared_path | default('/opt/omnia') }}"

  vars_files:
    - vars/vars.yml

  tasks:
    - name: Display target OIM server
      ansible.builtin.debug:
        msg: "Running telemetry on OIM server: {{ ansible_host }}"

    # =========================================================================
    # SYNC PROJECT_DEFAULT INTO CONTAINER
    # =========================================================================

    - name: Ensure project_dir for sync
      ansible.builtin.set_fact:
        project_dir: "{{ project_dir | default(playbook_dir + '/../..') }}"

    - name: Sync project_default and generate vault key
      ansible.builtin.include_tasks: ../shared/tasks/sync_project_default.yml

    # =========================================================================
    # PREREQUISITE CHECKS
    # =========================================================================
    - name: Check container and idrac_telemetry_support
      ansible.builtin.include_tasks: tasks/check_container_and_telemetry_support.yml

    - name: Check service_cluster_metadata and kube_vip
      ansible.builtin.include_tasks: tasks/check_service_cluster.yml

    - name: Check PXE mapping and idrac-telemetry pod count
      ansible.builtin.include_tasks: tasks/check_pxe_and_pod_count.yml

    - name: Check bmc_group_data.csv
      ansible.builtin.include_tasks: tasks/check_bmc_group_data.yml

    # =========================================================================
    # PREREQUISITE SUMMARY
    # =========================================================================
    - name: Display prerequisite check summary
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "  TELEMETRY PREREQUISITE CHECK SUMMARY"
          - "============================================"
          - ""
          - "CONFIGURATION FILES:"
          - "  pxe_mapping_file:             {{ pxe_mapping_check.stdout | default('SKIPPED') }}"
          - "  bmc_group_data.csv:           {{ bmc_group_data_check.stdout }}"
          - "  service_cluster_metadata.yml: {{ service_cluster_metadata_check.stdout }}"
          - ""
          - "TELEMETRY SETTINGS:"
          - "  idrac_telemetry_support:      {{ idrac_telemetry_support }}"
          - ""
          - "SERVICE KUBE NODES:"
          - "  service_kube_node count:      {{ service_kube_node_tags | default([]) | length }}"
          - "  service_kube_node tags:       {{ service_kube_node_tags | default([]) }}"
          - "  slurm_node with svc parent:   {{ slurm_node_with_service_parent_count | default(0) }}"
          - ""
          - "IDRAC TELEMETRY PODS:"
          - "  idrac-telemetry pod count:    {{ idrac_telemetry_pod_count }} (expected: {{ expected_idrac_pod_count }})"
          - "  bmc_group_data parents:       {{ bmc_parent_mappings | default([]) | unique }}"
          - "  bmc parent mapping match:     {{ 'YES' if bmc_parent_match | default(false) else 'NO' }}"
          - ""
          - "KUBERNETES CLUSTER:"
          - "  kube_vip:                     {{ kube_vip | default('N/A') }}"
          - "  kube_vip reachable:           {{ 'YES' if kube_vip_ping.rc == 0 else 'NO' }}"
          - "============================================"

    # =========================================================================
    # RUN TELEMETRY PLAYBOOK
    # =========================================================================
    - name: Check if telemetry playbook exists in container
      ansible.builtin.shell:
        cmd: podman exec -it {{ container_name }} test -f {{ telemetry_playbook }} && echo "EXISTS" || echo "NOT_FOUND"
      register: playbook_check
      changed_when: false

    - name: Display playbook check result
      ansible.builtin.debug:
        msg: "telemetry.yml playbook ({{ telemetry_playbook }}): {{ playbook_check.stdout }}"

    - name: Execute telemetry playbook in omnia_core container
      ansible.builtin.shell:
        cmd: |
          podman exec -it -w /omnia/telemetry {{ container_name }} \
            ansible-playbook telemetry.yml -v
      register: playbook_result
      when: "'EXISTS' in playbook_check.stdout"
      changed_when: playbook_result.rc == 0
      failed_when: false

    - name: Display playbook stdout
      ansible.builtin.debug:
        var: playbook_result.stdout_lines
      when: playbook_result is defined and playbook_result.stdout_lines is defined

    - name: Display playbook execution result
      ansible.builtin.debug:
        msg: |
          ============================================
          TELEMETRY PLAYBOOK EXECUTION COMPLETE
          ============================================
          Return Code: {{ playbook_result.rc | default('N/A') }}
          ============================================
      when: playbook_result is defined

    - name: Fail if playbook execution failed
      ansible.builtin.fail:
        msg: |
          ╔══════════════════════════════════════════════════════════════════════════════╗
          ║                    TELEMETRY PLAYBOOK EXECUTION FAILED                       ║
          ╠══════════════════════════════════════════════════════════════════════════════╣
          ║ Exit Code: {{ playbook_result.rc }}
          ║
          ║ HOW TO DEBUG:
          ║   1. SSH to OIM server: ssh root@{{ ansible_host }}
          ║   2. Enter container: podman exec -it omnia_core bash
          ║   3. Check K8s pods: kubectl get pods -n telemetry
          ║   4. Check logs: kubectl logs -n telemetry <pod-name>
          ╚══════════════════════════════════════════════════════════════════════════════╝
      when: playbook_result is defined and playbook_result.rc is defined and playbook_result.rc != 0

    - name: Fail if playbook not found
      ansible.builtin.fail:
        msg: "telemetry playbook not found at {{ telemetry_playbook }}"
      when: "'NOT_FOUND' in playbook_check.stdout"
