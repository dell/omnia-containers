---
# =============================================================================
# Molecule Converge - Verify PAM Slurm Adopt configuration
# =============================================================================

- name: Converge - Load configuration and setup inventory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default(playbook_dir + '/../../..', true) }}"

  tasks:
    - name: Setup dynamic inventory
      ansible.builtin.include_tasks: "{{ project_dir }}/molecule/shared/tasks/setup_inventory.yml"

    - name: Add Slurm control node to inventory (via OIM server)
      ansible.builtin.add_host:
        name: slurm_control_node
        groups: slurm
        ansible_host: "{{ user_config.oim_server_ip }}"
        ansible_user: "{{ user_config.oim_ssh_user | default('root') }}"
        ansible_password: "{{ user_config.oim_ssh_password }}"
        ansible_port: "{{ user_config.oim_ssh_port | default(22) }}"
        ansible_connection: ssh
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
        slurm_control_node_ip: "{{ user_config.slurm_control_node_ip | default('172.16.107.202') }}"

    - name: Set facts for Slurm control node play
      ansible.builtin.set_fact:
        user_config: "{{ user_config }}"
        cacheable: true


- name: Converge - Verify PAM Slurm Adopt on control node (via omnia_core)
  hosts: slurm_control_node
  gather_facts: false

  vars:
    user_config: "{{ hostvars['localhost']['user_config'] }}"
    slurm_control_ip: "{{ slurm_control_node_ip | default('172.16.107.202') }}"

  tasks:
    - name: Display target Slurm control node
      ansible.builtin.debug:
        msg: "Verifying PAM Slurm Adopt on Slurm control node: {{ slurm_control_ip }} (via OIM server: {{ ansible_host }})"

    - name: Check if slurmctld service is running (via omnia_core)
      ansible.builtin.shell:
        cmd: podman exec omnia_core ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ slurm_control_ip }} "systemctl is-active slurmctld"
      register: slurmctld_check
      changed_when: false
      failed_when: false

    - name: Display slurmctld status
      ansible.builtin.debug:
        msg: "slurmctld status: {{ slurmctld_check.stdout }}"

    - name: Fail if slurmctld is not running
      ansible.builtin.fail:
        msg: |
          slurmctld service is not running on {{ slurm_control_ip }}.
          Please ensure Slurm is properly installed and configured.
      when: slurmctld_check.rc != 0

    # =========================================================================
    # VERIFY PAM SLURM ADOPT CONFIGURATION
    # =========================================================================

    - name: Check PAM Slurm Adopt configuration (via omnia_core)
      ansible.builtin.shell:
        cmd: podman exec omnia_core ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ slurm_control_ip }} "grep -r 'pam_slurm_adopt' /etc/pam.d/ 2>/dev/null || echo 'PAM Slurm Adopt not configured'"
      register: pam_config
      changed_when: false
      failed_when: false

    - name: Display PAM configuration
      ansible.builtin.debug:
        msg: |
          ============================================
          PAM SLURM ADOPT CONFIGURATION
          ============================================
          {{ pam_config.stdout | default('Not found') }}
          ============================================

    - name: Get available compute nodes (via omnia_core)
      ansible.builtin.shell:
        cmd: podman exec omnia_core ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ slurm_control_ip }} "sinfo -N -o '%N|%T' --noheader | grep -v 'down\|drain' | head -5"
      register: compute_nodes
      changed_when: false
      failed_when: false

    - name: Display available compute nodes
      ansible.builtin.debug:
        msg: |
          ============================================
          AVAILABLE COMPUTE NODES
          ============================================
          {{ compute_nodes.stdout | default('No available nodes') }}
          ============================================

    - name: PAM Slurm Adopt converge complete
      ansible.builtin.debug:
        msg: |
          ============================================
          pam_slurm_adopt converge complete!
          ============================================
          - slurmctld service: Running
          - PAM configuration: Checked
          - Compute nodes: Verified
          - Ready for pytest verification
          ============================================
