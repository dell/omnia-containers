# =============================================================================
# Molecule Configuration for Slurm Testing
# =============================================================================
#
# This module verifies Slurm job submission from login nodes
# via the omnia_core container.
#
# PREREQUISITES:
# --------------
#   - omnia_core container running (omnia.sh --install completed)
#   - prepare_oim.yml completed
#   - Slurm cluster deployed with login nodes configured
#   - provision_config.yml with pxe_mapping_file_path configured
#
# USAGE:
# ------
#   ./run_molecule.sh slurm test       # Run slurm tests
#   ./run_molecule.sh slurm converge   # Run converge only
#   ./run_molecule.sh slurm verify     # Verify only
#
# Configuration:
#   - user_config.yml: OIM server connection settings
#
# =============================================================================

dependency:
  name: galaxy

driver:
  name: default
  options:
    managed: false

platforms:
  - name: oim_server

provisioner:
  name: ansible
  playbooks:
    create: create.yml
    converge: converge.yml
  env:
    ANSIBLE_VERBOSITY: 1
    ANSIBLE_HOST_KEY_CHECKING: "false"

verifier:
  name: testinfra
  additional_files_or_dirs:
    -_test_job_submission_root.py
  options:
    v: true
    s: true
    tb: short

scenario:
  name: slurm
  test_sequence:
    - dependency
    - syntax
    - create
    - converge
    - verify
