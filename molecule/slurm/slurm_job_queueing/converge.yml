---
# =============================================================================
# Molecule Converge - Verify Slurm job queueing functionality
# =============================================================================

- name: Converge - Load configuration and setup inventory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default(playbook_dir + '/../../..', true) }}"

  tasks:
    - name: Setup dynamic inventory
      ansible.builtin.include_tasks: ../../shared/tasks/setup_inventory.yml

    - name: Set facts for Slurm control node play
      ansible.builtin.set_fact:
        user_config: "{{ user_config }}"
        cacheable: true


- name: Converge - Verify Slurm job queueing on control node
  hosts: slurm_control_node
  gather_facts: false

  vars:
    user_config: "{{ hostvars['localhost']['user_config'] }}"

  tasks:
    - name: Display target Slurm control node
      ansible.builtin.debug:
        msg: "Verifying Slurm job queueing on: {{ ansible_host }}"

    - name: Check if slurmctld service is running
      ansible.builtin.shell:
        cmd: systemctl is-active slurmctld
      register: slurmctld_check
      changed_when: false
      failed_when: false

    - name: Display slurmctld status
      ansible.builtin.debug:
        msg: "slurmctld status: {{ slurmctld_check.stdout }}"

    - name: Fail if slurmctld is not running
      ansible.builtin.fail:
        msg: |
          slurmctld service is not running on {{ ansible_host }}.
          Please ensure Slurm is properly installed and configured.
      when: slurmctld_check.rc != 0

    # =========================================================================
    # VERIFY SLURM CLUSTER STATUS
    # =========================================================================

    - name: Get Slurm cluster info
      ansible.builtin.shell:
        cmd: sinfo -N -o '%N|%T|%P|%c|%m' --noheader
      register: sinfo_result
      changed_when: false
      failed_when: false

    - name: Display Slurm node status
      ansible.builtin.debug:
        msg: |
          ============================================
          SLURM CLUSTER NODE STATUS
          ============================================
          {{ sinfo_result.stdout | default('No nodes found') }}
          ============================================

    - name: Get Slurm scheduler configuration
      ansible.builtin.shell:
        cmd: scontrol show config | grep -E 'SchedulerType|SelectType|PriorityType'
      register: scheduler_config
      changed_when: false
      failed_when: false

    - name: Display scheduler configuration
      ansible.builtin.debug:
        msg: |
          ============================================
          SLURM SCHEDULER CONFIGURATION
          ============================================
          {{ scheduler_config.stdout | default('Unable to get config') }}
          ============================================

    - name: Get current job queue status
      ansible.builtin.shell:
        cmd: squeue -o '%i|%j|%T|%r' --noheader | head -20
      register: squeue_result
      changed_when: false
      failed_when: false

    - name: Display job queue status
      ansible.builtin.debug:
        msg: |
          ============================================
          SLURM JOB QUEUE STATUS
          ============================================
          {{ squeue_result.stdout | default('Queue is empty') }}
          ============================================

    - name: Slurm job queueing converge complete
      ansible.builtin.debug:
        msg: |
          ============================================
          slurm_job_queueing converge complete!
          ============================================
          - slurmctld service: Running
          - Cluster nodes: Verified
          - Scheduler config: Retrieved
          - Ready for pytest verification
          ============================================
