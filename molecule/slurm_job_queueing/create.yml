---
# =============================================================================
# Molecule Create - Setup inventory and verify connectivity to Slurm nodes
# =============================================================================

- name: Create - Setup Slurm node inventory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"

  tasks:
    - name: Setup dynamic inventory
      ansible.builtin.include_tasks: ../shared/tasks/setup_inventory.yml

    - name: Test SSH connection to Slurm control node via omnia_core
      ansible.builtin.shell:
        cmd: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            omnia_core "ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            {{ user_config.slurm_control_node | default('172.16.107.102') }} hostname"
      register: ssh_test
      changed_when: false
      failed_when: false

    - name: Fail if Slurm control node is not reachable
      ansible.builtin.fail:
        msg: |
          Cannot connect to Slurm control node via omnia_core.
          Target: {{ user_config.slurm_control_node | default('172.16.107.102') }}
          Error: {{ ssh_test.stderr | default('Unknown error') }}
      when: ssh_test.rc != 0

    - name: Slurm control node ready
      ansible.builtin.debug:
        msg: "Slurm control node {{ ssh_test.stdout }} is reachable via omnia_core"
