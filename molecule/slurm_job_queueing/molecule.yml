# =============================================================================
# Molecule Configuration for slurm_job_queueing Testing
# =============================================================================
#
# This module runs Slurm job queueing tests via SSH to the Slurm control node.
# Tests verify job submission, pending states, running transitions, and scheduler.
#
# USAGE:
# ------
#   ./run_molecule.sh slurm_job_queueing test       # Run converge + verify
#   ./run_molecule.sh slurm_job_queueing converge   # Run converge only
#   ./run_molecule.sh slurm_job_queueing verify     # Verify only
#
# Configuration:
#   - user_config.yml: Slurm node connection settings
#   - Tests connect via omnia_core SSH alias to slurm-control-node
#
# =============================================================================

dependency:
  name: galaxy

driver:
  name: default
  options:
    managed: false

platforms:
  - name: slurm_control_node

provisioner:
  name: ansible
  playbooks:
    create: create.yml
    converge: converge.yml
  env:
    ANSIBLE_VERBOSITY: 1
    ANSIBLE_HOST_KEY_CHECKING: "false"

verifier:
  name: testinfra
  options:
    v: true
    s: true
    tb: short

scenario:
  name: slurm_job_queueing
  test_sequence:
    - dependency
    - syntax
    - create
    - converge
    - verify
