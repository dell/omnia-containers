# =============================================================================
# Molecule Configuration for slurm_job_queueing Testing
# =============================================================================
#
# This module runs slurm job queueing tests on Slurm cluster nodes
# and verifies the job queueing functionality.
#
# USAGE:
# ------
#   ./run_molecule.sh slurm_job_queueing test       # Run playbook + verify
#   ./run_molecule.sh slurm_job_queueing converge   # Run playbook only
#   ./run_molecule.sh slurm_job_queueing verify     # Verify only
#
# Configuration:
#   - user_config.yml: Slurm cluster connection settings
#
# =============================================================================

dependency:
  name: galaxy

driver:
  name: default
  options:
    managed: false

platforms:
  - name: slurm_control_node

provisioner:
  name: ansible
  playbooks:
    create: create.yml
    converge: converge.yml
  env:
    ANSIBLE_VERBOSITY: 1
    ANSIBLE_HOST_KEY_CHECKING: "false"

verifier:
  name: testinfra
  options:
    v: true
    s: true
    tb: short

scenario:
  name: slurm_job_queueing
  test_sequence:
    - dependency
    - syntax
    - create
    - converge
    - verify
