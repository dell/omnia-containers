# =============================================================================
# Molecule Configuration for Omnia Rollback Testing
# =============================================================================
#
# This module tests the Omnia rollback workflow (e.g., 2.2.0.0 → 2.1.0.0).
# Tests only — no converge step (rollback is driven from within tests).
#
# PREREQUISITES:
# --------------
#   - omnia_core container running at the NEW version (e.g., 2.2.0.0)
#   - An upgrade has already been performed (backup exists)
#   - The original image (e.g., omnia_core:2.1) is available locally
#   - 'upgrade' section configured in omnia_test_config.yml
#
# USAGE:
# ------
#   ./run_molecule.sh rollback_omnia_sh verify     # Run verification tests
#   ./run_molecule.sh rollback_omnia_sh test        # Full test sequence
#
# Configuration (omnia_test_config.yml):
#   upgrade:
#     operation: "upgrade"        # must be "upgrade" or "rollback"
#     current_version: "2.1.0.0"  # pre-upgrade version (rollback target)
#     new_version: "2.2.0.0"      # post-upgrade version (current state)
#     repo_branch: "omnia-container"
#
# =============================================================================

dependency:
  name: galaxy

driver:
  name: default
  options:
    managed: false

platforms:
  - name: oim_server

provisioner:
  name: ansible
  env:
    ANSIBLE_VERBOSITY: 1
    ANSIBLE_HOST_KEY_CHECKING: "false"

verifier:
  name: testinfra
  directory: ./tests/sanity
  options:
    v: true
    s: true
    tb: short

scenario:
  name: rollback_omnia_sh
  test_sequence:
    - verify
