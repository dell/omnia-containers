---
# =============================================================================
# Molecule Converge - Run local_repo.yml inside omnia_core container
# =============================================================================

- name: Converge - Load configuration and setup inventory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default(playbook_dir + '/../..', true) }}"

  tasks:
    - name: Setup dynamic inventory
      ansible.builtin.include_tasks: ../shared/tasks/setup_inventory.yml

    - name: Set facts for OIM server play
      ansible.builtin.set_fact:
        user_config: "{{ user_config }}"
        cacheable: true
      no_log: true


- name: Converge - Validate pulp, repo access, and run local_repo.yml
  hosts: oim_server
  gather_facts: false

  vars:
    user_config: "{{ hostvars['localhost']['user_config'] }}"
    oim_input_dir: "/opt/omnia/input/project_default"
    local_repo_playbook: "/omnia/local_repo/local_repo.yml"
    pulp_container_name: "pulp"

  tasks:
    - name: Display target OIM server
      ansible.builtin.debug:
        msg: "Running local_repo on OIM server: {{ ansible_host }}"

    - name: Check if omnia_core container is running
      ansible.builtin.shell:
        cmd: set -o pipefail && podman ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -q omnia_core
      args:
        executable: /bin/bash
      register: omnia_core_check
      changed_when: false
      failed_when: false

    - name: Fail if omnia_core container is not running
      ansible.builtin.fail:
        msg: |
          omnia_core container is not running on {{ ansible_host }}.
          Please run omnia.sh --install first.
      when: omnia_core_check.rc != 0

    # =========================================================================
    # SYNC PROJECT_DEFAULT INTO CONTAINER
    # =========================================================================

    - name: Ensure project_dir for sync
      ansible.builtin.set_fact:
        project_dir: "{{ project_dir | default(playbook_dir + '/../..') }}"

    - name: Sync project_default and generate vault key
      ansible.builtin.include_tasks: ../shared/tasks/sync_project_default.yml

    - name: Check if pulp container is running
      ansible.builtin.shell:
        cmd: set -o pipefail && podman ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -q "^{{ pulp_container_name }}$"
      args:
        executable: /bin/bash
      register: pulp_check
      changed_when: false
      failed_when: false

    - name: Fail if pulp container is not running
      ansible.builtin.fail:
        msg: |
          Pulp container '{{ pulp_container_name }}' is not running on {{ ansible_host }}.
          Check: podman ps -a | grep {{ pulp_container_name }}
          Logs:  podman logs {{ pulp_container_name }}
      when: pulp_check.rc != 0

    - name: Check pulp container health status (if available)
      ansible.builtin.shell:
        cmd: podman inspect --format '{{ '{{' }}.State.Health.Status{{ '}}' }}' {{ pulp_container_name }} 2>/dev/null || true
      register: pulp_health
      changed_when: false

    - name: Display pulp health status
      ansible.builtin.debug:
        msg: "Pulp health status: {{ pulp_health.stdout | default('') | trim | default('(none)') }}"

    - name: Wait for Pulp API to become ready (HTTPS)
      ansible.builtin.shell:
        cmd: |
          for i in $(seq 1 60); do
            if curl -k -sSf --max-time 5 https://127.0.0.1:2225/pulp/api/v3/status/ >/dev/null; then
              echo "READY"
              exit 0
            fi
            sleep 5
          done
          echo "TIMEOUT"
          exit 1
      register: pulp_api_ready
      changed_when: false

    - name: Check pulp logs for persistent lock errors
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          podman logs --tail 200 {{ pulp_container_name }} 2>&1 | grep -E "s6-rc: fatal: unable to take locks" || true
      args:
        executable: /bin/bash
      register: pulp_lock_errors
      changed_when: false

    - name: Display pulp lock errors (if any)
      ansible.builtin.debug:
        msg: |
          Pulp log lock messages detected (continuing because API is READY):
          {{ pulp_lock_errors.stdout }}
      when: pulp_lock_errors.stdout is defined and pulp_lock_errors.stdout | trim | length > 0

    - name: Check pulp logs for fatal errors
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          podman logs --since 5m {{ pulp_container_name }} 2>&1 | \
            grep -E "(Traceback|FATAL|\[ERROR\]|ERROR:)" | \
            grep -v -E "s6-rc: fatal: unable to take locks" | \
            grep -v -E "database system is starting up|database system is shutting down" || true
      args:
        executable: /bin/bash
      register: pulp_fatal_errors
      changed_when: false

    - name: Display pulp fatal log snippets (non-fatal)
      ansible.builtin.debug:
        msg: |
          Pulp log snippets matched (Traceback/ERROR). Continuing test.
          {{ pulp_fatal_errors.stdout }}
      when:
        - pulp_api_ready is defined
        - "'READY' in pulp_api_ready.stdout"
        - pulp_fatal_errors.stdout is defined
        - pulp_fatal_errors.stdout | trim | length > 0

    - name: Verify input files exist in omnia_core container
      ansible.builtin.command:
        cmd: podman exec -it omnia_core ls -la {{ oim_input_dir }}/
      register: container_files
      changed_when: false

    - name: Display container input files
      ansible.builtin.debug:
        var: container_files.stdout_lines

    - name: Check if local_repo playbook exists in container
      ansible.builtin.shell:
        cmd: podman exec -it omnia_core test -f {{ local_repo_playbook }} && echo "EXISTS" || echo "NOT_FOUND"
      register: playbook_check
      changed_when: false

    - name: Display playbook check result
      ansible.builtin.debug:
        msg: "local_repo playbook ({{ local_repo_playbook }}): {{ playbook_check.stdout }}"

    - name: Execute local_repo playbook in omnia_core container
      ansible.builtin.shell:
        cmd: |
          podman exec -it -w /omnia/local_repo omnia_core \
            ansible-playbook local_repo.yml -v
      register: playbook_result
      when: "'EXISTS' in playbook_check.stdout"
      changed_when: playbook_result.rc == 0
      failed_when: false

    - name: Display playbook stdout
      ansible.builtin.debug:
        var: playbook_result.stdout_lines
      when: playbook_result is defined and playbook_result.stdout_lines is defined

    - name: Display playbook execution result
      ansible.builtin.debug:
        msg: |
          ============================================
          LOCAL_REPO PLAYBOOK EXECUTION COMPLETE
          ============================================
          Return Code: {{ playbook_result.rc | default('N/A') }}
          ============================================
      when: playbook_result is defined

    - name: Fail if playbook execution failed
      ansible.builtin.fail:
        msg: |
          ╔══════════════════════════════════════════════════════════════════════════════╗
          ║                      LOCAL_REPO PLAYBOOK EXECUTION FAILED                    ║
          ╠══════════════════════════════════════════════════════════════════════════════╣
          ║ Exit Code: {{ playbook_result.rc }}
          ║
          ║ HOW TO DEBUG:
          ║   1. SSH to OIM server: ssh root@{{ ansible_host }}
          ║   2. Enter container: podman exec -it omnia_core bash
          ║   3. Pulp logs: podman logs {{ pulp_container_name }}
          ║   4. Check omnia logs: ls -la /opt/omnia/log/
          ║
          ║ STDERR:
          ║   {{ playbook_result.stderr | default('No error message') }}
          ╚══════════════════════════════════════════════════════════════════════════════╝
      when: playbook_result is defined and playbook_result.rc is defined and playbook_result.rc != 0

    - name: Fail if playbook not found
      ansible.builtin.fail:
        msg: "local_repo playbook not found at {{ local_repo_playbook }}"
      when: "'NOT_FOUND' in playbook_check.stdout"
