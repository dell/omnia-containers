# =============================================================================
# Molecule Configuration for Admin Debug Packages Verification
# =============================================================================
#
# This module verifies that all debug packages defined in admin_debug_packages.json
# are installed on all cluster nodes.
#
# PREREQUISITES:
# --------------
#   - omnia_core container running (omnia.sh --install completed)
#   - Nodes provisioned and accessible via SSH
#   - admin_debug_packages entry present in software_config.json
#
# USAGE:
# ------
#   ./run_molecule.sh admin_debug_packages test       # Run verification
#   ./run_molecule.sh admin_debug_packages verify     # Verify only
#
# Configuration:
#   - user_config.yml: OIM server connection settings
#
# =============================================================================

dependency:
  name: galaxy

driver:
  name: default
  options:
    managed: false

platforms:
  - name: oim_server

provisioner:
  name: ansible
  playbooks:
    create: create.yml
    converge: converge.yml
  env:
    ANSIBLE_VERBOSITY: 1
    ANSIBLE_HOST_KEY_CHECKING: "false"

verifier:
  name: testinfra
  options:
    v: true
    s: true
    tb: short

scenario:
  name: admin_debug_packages
  test_sequence:
    - dependency
    - syntax
    - create
    - converge
    - verify
