---
# =============================================================================
# Molecule Converge - Run build_image_aarch64.yml inside omnia_core container
# =============================================================================

- name: Converge - Load configuration and setup inventory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default(playbook_dir + '/../..', true) }}"

  tasks:
    - name: Setup dynamic inventory
      ansible.builtin.include_tasks: ../shared/tasks/setup_inventory.yml

    - name: Set facts for OIM server play
      ansible.builtin.set_fact:
        user_config: "{{ user_config }}"
        cacheable: true
      no_log: true


- name: Converge - Run build_image_aarch64.yml in omnia_core container
  hosts: oim_server
  gather_facts: false

  vars:
    user_config: "{{ hostvars['localhost']['user_config'] }}"
    omnia_shared_path: "{{ user_config.omnia_shared_path | default('/opt/omnia') }}"
    container_name: "omnia_core"
    build_image_playbook: "/omnia/build_image_aarch64/build_image_aarch64.yml"
    s3_containers:
      - minio-server

  tasks:
    - name: Display target OIM server
      ansible.builtin.debug:
        msg: "Running build_image_aarch64 on OIM server: {{ ansible_host }}"

    # =========================================================================
    # PRECHECK: VALIDATE S3 CONTAINERS ARE RUNNING
    # =========================================================================

    - name: "PRECHECK: Check S3 containers are running"
      ansible.builtin.shell:
        cmd: set -o pipefail && podman ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -q {{ item }}
      args:
        executable: /bin/bash
      register: s3_container_check
      changed_when: false
      failed_when: false
      loop: "{{ s3_containers }}"

    - name: Build list of failed S3 containers
      ansible.builtin.set_fact:
        failed_s3_containers: "{{ s3_container_check.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}"

    - name: "PRECHECK FAILED: S3 containers not running"
      ansible.builtin.fail:
        msg: |
          ╔══════════════════════════════════════════════════════════════════════════════╗
          ║                    S3 CONTAINERS PRECHECK FAILED                              ║
          ╠══════════════════════════════════════════════════════════════════════════════╣
          ║ The following S3 containers are not running:
          ║   {{ failed_s3_containers | join(', ') }}
          ║
          ║ WHAT HAPPENED:
          ║   S3 containers must be running before build_image can execute.
          ║
          ║ HOW TO FIX:
          ║   1. Check container status: podman ps -a | grep -E 'minio'
          ║   2. Check container logs: podman logs minio-server
          ║   3. Restart containers: podman restart minio-server
          ║   4. Re-run prepare_oim.yml if containers don't exist
          ╚══════════════════════════════════════════════════════════════════════════════╝
      when: failed_s3_containers | length > 0

    - name: "PRECHECK PASSED: All S3 containers running"
      ansible.builtin.debug:
        msg: "✔ All S3 containers are running: {{ s3_containers | join(', ') }}"

    # =========================================================================
    # SYNC PROJECT_DEFAULT INTO CONTAINER
    # =========================================================================

    - name: Ensure project_dir for sync
      ansible.builtin.set_fact:
        project_dir: "{{ project_dir | default(playbook_dir + '/../..') }}"

    - name: Sync project_default and generate vault key
      ansible.builtin.include_tasks: ../shared/tasks/sync_project_default.yml

    # =========================================================================
    # RUN BUILD_IMAGE PLAYBOOK
    # =========================================================================

    - name: Check if build_image playbook exists in container
      ansible.builtin.shell:
        cmd: podman exec -it {{ container_name }} test -f {{ build_image_playbook }} && echo "EXISTS" || echo "NOT_FOUND"
      register: playbook_check
      changed_when: false

    - name: Display playbook check result
      ansible.builtin.debug:
        msg: "build_image playbook ({{ build_image_playbook }}): {{ playbook_check.stdout }}"

    - name: Execute build_image_aarch64 playbook in omnia_core container
      ansible.builtin.shell:
        cmd: |
          podman exec -it -w /omnia/build_image_aarch64 {{ container_name }} \
            ansible-playbook build_image_aarch64.yml -v
      register: playbook_result
      when: "'EXISTS' in playbook_check.stdout"
      changed_when: playbook_result.rc == 0
      failed_when: false

    - name: Display playbook stdout
      ansible.builtin.debug:
        var: playbook_result.stdout_lines
      when: playbook_result is defined and playbook_result.stdout_lines is defined

    - name: Display playbook execution result
      ansible.builtin.debug:
        msg: |
          ============================================
          BUILD_IMAGE_AARCH64 PLAYBOOK EXECUTION COMPLETE
          ============================================
          Return Code: {{ playbook_result.rc | default('N/A') }}
          ============================================
      when: playbook_result is defined

    - name: Fail if playbook execution failed
      ansible.builtin.fail:
        msg: |
          ╔══════════════════════════════════════════════════════════════════════════════╗
          ║                    BUILD_IMAGE PLAYBOOK EXECUTION FAILED                      ║
          ╠══════════════════════════════════════════════════════════════════════════════╣
          ║ Exit Code: {{ playbook_result.rc }}
          ║
          ║ HOW TO DEBUG:
          ║   1. SSH to OIM server: ssh root@{{ ansible_host }}
          ║   2. Enter container: podman exec -it {{ container_name }} bash
          ║   3. Check omnia logs: ls -la /opt/omnia/log/
          ║   4. Check container status: podman ps -a
          ╚══════════════════════════════════════════════════════════════════════════════╝
      when: playbook_result is defined and playbook_result.rc is defined and playbook_result.rc != 0

    - name: Fail if playbook not found
      ansible.builtin.fail:
        msg: "build_image playbook not found at {{ build_image_playbook }}"
      when: "'NOT_FOUND' in playbook_check.stdout"
