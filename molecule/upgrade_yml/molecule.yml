# =============================================================================
# Molecule Configuration — upgrade_yml
# =============================================================================
#
# Automates execution of upgrade.yml (per-component upgrade orchestrator)
# inside the omnia_core container after omnia.sh upgrade has been performed.
#
# Tests run in order:
#   1. Pre-flight check        — container running, playbook exists, no lock
#   2. Run upgrade.yml         — all components in order
#   3. Verify manifest         — upgrade_manifest.yml readable + overall status
#   4. Verify OIM              — component_status['oim'] = completed
#   5. Verify K8s              — component_status['k8s'] = completed/skipped
#   6. Verify Slurm            — component_status['slurm'] = completed/skipped
#   7. Verify OpenCHAMI        — component_status['openchami'] = completed/skipped
#
# Upgrade order:
#   oim → local_repo → build_image → provision → k8s → slurm → openchami
#
# PREREQUISITES:
# --------------
#   - upgrade_omnia_sh scenario completed (omnia.sh upgraded)
#   - omnia_core container running with upgrade.yml present
#   - upgrade.yml present at /omnia/upgrade/upgrade.yml inside omnia_core
#   - 'upgrade' section configured in omnia_test_config.yml
#
# USAGE:
# ------
#   ./run_molecule.sh upgrade_yml verify          # Run all component tests
#   ./run_molecule.sh upgrade_yml verify --suite sanity
#
# =============================================================================

dependency:
  name: galaxy

driver:
  name: default
  options:
    managed: false

platforms:
  - name: oim_server

provisioner:
  name: ansible
  env:
    ANSIBLE_VERBOSITY: 1
    ANSIBLE_HOST_KEY_CHECKING: "false"

verifier:
  name: testinfra
  directory: ./tests/sanity
  options:
    v: true
    s: true
    tb: short

scenario:
  name: upgrade_yml
  test_sequence:
    - verify
