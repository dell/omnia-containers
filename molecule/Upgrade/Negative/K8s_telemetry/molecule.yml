# =============================================================================
# Molecule Configuration - K8s & Telemetry Upgrade Negative & Performance Tests
# =============================================================================
#
# Contains negative (error injection), performance, and partial-rollback test
# cases from Section 2 of the test case matrix:
#   - TC-E001 to TC-E015 : K8s upgrade error injection
#   - TC-P001 to TC-P003 : K8s upgrade performance
#   - TC-TEL-E001 to TC-TEL-E007 : Telemetry upgrade error injection
#   - TC-TEL-P001 : Telemetry upgrade performance
#   - TC-R004, TC-R005, TC-R008, TC-R011 : Partial rollback scenarios
#
# WARNING:
# --------
#   These tests perform DESTRUCTIVE operations (killing processes, filling
#   disks, partitioning networks). Run ONLY in dedicated test environments.
#
# PREREQUISITES:
# --------------
#   - Dedicated test cluster (NOT production)
#   - Pre-check scenario has been run (snapshot exists)
#   - omnia_core container running
#   - SSH access to all K8s nodes (for fault injection)
#   - 'upgrade' section configured in omnia_test_config.yml
#
# USAGE:
# ------
#   # Run only negative tests:
#   ./run_molecule.sh upgrade_negative_k8s_telemetry verify -- -m negative
#
#   # Run only performance tests:
#   ./run_molecule.sh upgrade_negative_k8s_telemetry verify -- -m stress
#
#   # Run only security tests:
#   ./run_molecule.sh upgrade_negative_k8s_telemetry verify -- -m security
#
# =============================================================================

dependency:
  name: galaxy

driver:
  name: default
  options:
    managed: false

platforms:
  - name: oim_server

provisioner:
  name: ansible
  playbooks:
    create: create.yml
    converge: converge.yml
  env:
    ANSIBLE_VERBOSITY: 1
    ANSIBLE_HOST_KEY_CHECKING: "false"

verifier:
  name: testinfra
  directory: ./tests/negative
  options:
    v: true
    s: true
    tb: short

scenario:
  name: upgrade_negative_k8s_telemetry
  test_sequence:
    - dependency
    - create
    - converge
    - verify
