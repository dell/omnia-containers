---
# =============================================================================
# Molecule Converge - K8s & Telemetry Upgrade Post-Check
# =============================================================================
# This converge step only sets up inventory and verifies basic OIM
# connectivity.  No upgrade playbook is executed.
# The actual post-check validation happens in the verify step
# (pytest / testinfra tests).
# =============================================================================

- name: Converge - Load configuration and setup inventory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default(playbook_dir + '/../../../..', true) }}"

  tasks:
    - name: Setup dynamic inventory
      ansible.builtin.include_tasks: ../../../shared/tasks/setup_inventory.yml

    - name: Set facts for OIM server play
      ansible.builtin.set_fact:
        omnia_test_config: "{{ omnia_test_config }}"
        cacheable: true
      no_log: true


- name: Converge - Verify OIM connectivity and snapshot exists
  hosts: oim_server
  gather_facts: false

  vars:
    omnia_test_config: "{{ hostvars['localhost']['omnia_test_config'] }}"
    snapshot_path: "{{ omnia_test_config.k8s_upgrade_snapshot_path | default('/tmp/k8s_telemetry_upgrade_precheck.json') }}"

  tasks:
    - name: Display target OIM server
      ansible.builtin.debug:
        msg: "K8s/Telemetry post-check on OIM server: {{ ansible_host }}"

    - name: Verify omnia_core container is running
      ansible.builtin.shell:
        cmd: podman ps --format '{{ '{{' }}.Names{{ '}}' }}' --filter name=omnia_core
      register: container_check
      changed_when: false
      failed_when: "'omnia_core' not in container_check.stdout"

    - name: Verify pre-upgrade snapshot exists
      ansible.builtin.stat:
        path: "{{ snapshot_path }}"
      register: snapshot_stat

    - name: Display readiness
      ansible.builtin.debug:
        msg:
          - "omnia_core container: {{ 'running' if 'omnia_core' in container_check.stdout else 'NOT FOUND' }}"
          - "Pre-upgrade snapshot: {{ 'found' if snapshot_stat.stat.exists else 'NOT FOUND at ' ~ snapshot_path }}"

    - name: Fail if snapshot missing
      ansible.builtin.fail:
        msg: |
          Pre-upgrade snapshot not found at {{ snapshot_path }}.
          Run the Pre_check/K8s_telemetry scenario before the upgrade to capture cluster state.
      when: not snapshot_stat.stat.exists
