# =============================================================================
# Molecule Configuration - K8s & Telemetry Upgrade Post-Check
# =============================================================================
#
# Validates the cluster state AFTER the K8s + Telemetry upgrade by comparing
# against the pre-upgrade snapshot saved by the Pre_check scenario.
#
# NO upgrade playbook is executed by this scenario.
#
# PREREQUISITES:
# --------------
#   - Pre_check/K8s_telemetry scenario has been run (snapshot saved)
#   - K8s + Telemetry upgrade has been completed
#   - omnia_core container running
#   - 'upgrade' section configured in omnia_test_config.yml
#
# USAGE:
# ------
#   ./run_molecule.sh upgrade_post_k8s_telemetry verify
#   ./run_molecule.sh upgrade_post_k8s_telemetry test
#
# =============================================================================

dependency:
  name: galaxy

driver:
  name: default
  options:
    managed: false

platforms:
  - name: oim_server

provisioner:
  name: ansible
  playbooks:
    create: create.yml
    converge: converge.yml
  env:
    ANSIBLE_VERBOSITY: 1
    ANSIBLE_HOST_KEY_CHECKING: "false"

verifier:
  name: testinfra
  directory: ./tests/sanity
  options:
    v: true
    s: true
    tb: short

scenario:
  name: upgrade_post_k8s_telemetry
  test_sequence:
    - dependency
    - create
    - converge
    - verify
