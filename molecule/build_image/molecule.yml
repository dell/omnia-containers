# =============================================================================
# Molecule Configuration for build_image Testing
# =============================================================================
#
# This module runs build_image_x86_64.yml playbook inside omnia_core container
# and verifies the image build was successful.
#
# PRECHECKS:
#   - S3 containers (minio-server) are running
#
# VALIDATIONS:
#   - functional_group.yml is autogenerated with all roles/groups from pxe_mapping
#   - Base and compute images are available in regctl registry
#   - All 3 images (initrd, rootfs, vmlinuz) are pushed to S3 bucket
#
# USAGE:
# ------
#   ./run_molecule.sh build_image test       # Run playbook + verify
#   ./run_molecule.sh build_image converge   # Run playbook only
#   ./run_molecule.sh build_image verify     # Verify only
#
# Configuration:
#   - user_config.yml: OIM server connection settings
#   - project_default/pxe_mapping_file.csv: Functional groups and roles
#
# =============================================================================

dependency:
  name: galaxy

driver:
  name: default
  options:
    managed: false

platforms:
  - name: oim_server

provisioner:
  name: ansible
  playbooks:
    create: create.yml
    converge: converge.yml
  env:
    ANSIBLE_VERBOSITY: 1
    ANSIBLE_HOST_KEY_CHECKING: "false"

verifier:
  name: testinfra
  options:
    v: true
    s: true
    tb: short

scenario:
  name: build_image
  test_sequence:
    - dependency
    - syntax
    - create
    - converge
    - verify
