# =============================================================================
# Molecule Configuration for GitLab Cleanup Testing
# =============================================================================
#
# This module runs cleanup_gitlab.yml playbook inside omnia_core container
# and verifies the GitLab cleanup was successful.
#
# PREREQUISITES:
# --------------
#   - omnia_core container running (omnia.sh --install completed)
#   - GitLab was previously deployed with gitlab.yml
#   - OIM server reachable
#   - GitLab server reachable
#
# USAGE:
# ------
#   ./run_molecule.sh gitlab_cleanup test       # Run prereq checks + playbook + verify
#   ./run_molecule.sh gitlab_cleanup converge   # Run playbook only
#   ./run_molecule.sh gitlab_cleanup verify     # Verify only
#   ./run_molecule.sh gitlab_cleanup verify --sanity  # Run sanity tests only
#
# Configuration:
#   - omnia_test_config.yml: OIM server connection settings
#   - gitlab_config.yml: GitLab deployment configuration
#
# =============================================================================

dependency:
  name: galaxy

driver:
  name: default
  options:
    managed: false

platforms:
  - name: oim_server

provisioner:
  name: ansible
  playbooks:
    create: create.yml
    converge: converge.yml
  env:
    ANSIBLE_VERBOSITY: 1
    ANSIBLE_HOST_KEY_CHECKING: "false"

verifier:
  name: testinfra
  options:
    v: true
    s: true
    tb: short

scenario:
  name: gitlab_cleanup
  test_sequence:
    - dependency
    - syntax
    - create
    - converge
    - verify
