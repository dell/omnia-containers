# =============================================================================
# Molecule Configuration for build_image_x86_64 Testing
# =============================================================================
#
# This module runs build_image_x86_64.yml playbook inside omnia_core container
# and verifies the deployment was successful.
#
# USAGE:
# ------
#   ./run_molecule.sh build_image_x86_64 test       # Run playbook + verify
#   ./run_molecule.sh build_image_x86_64 converge   # Run playbook only
#   ./run_molecule.sh build_image_x86_64 verify     # Verify only
#
# Configuration:
#   - user_config.yml: OIM server connection settings
#
# Validations:
#   - S3 containers are running without errors
#   - functional_group.yml is autogenerated correctly with roles/groups from pxe_mapping.csv
#   - Base and compute images are available in regctl registry
#   - Images are pushed to S3 bucket (all 3 images for each functional group)
#
# =============================================================================

dependency:
  name: galaxy

driver:
  name: default
  options:
    managed: false

platforms:
  - name: oim_server

provisioner:
  name: ansible
  playbooks:
    create: create.yml
    converge: converge.yml
  env:
    ANSIBLE_VERBOSITY: 1
    ANSIBLE_HOST_KEY_CHECKING: "false"

verifier:
  name: testinfra
  options:
    v: true
    s: true
    tb: short

scenario:
  name: build_image_x86_64
  test_sequence:
    - dependency
    - syntax
    - create
    - converge
    - verify
