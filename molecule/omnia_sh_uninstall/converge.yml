---
# =============================================================================
# Molecule Converge - Run omnia.sh --uninstall on OIM Server
# =============================================================================

- name: Cleanup - Setup inventory and load config
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default(playbook_dir + '/../..', true) }}"
  tasks:
    - name: Setup dynamic inventory
      ansible.builtin.include_tasks: ../shared/tasks/setup_inventory.yml

    - name: Set facts for cleanup
      ansible.builtin.set_fact:
        omnia_test_config: "{{ omnia_test_config }}"
        cacheable: true
      no_log: true

- name: Cleanup - Run omnia.sh --uninstall on OIM server
  hosts: oim_server
  gather_facts: false

  vars:
    omnia_test_config: "{{ hostvars['localhost']['omnia_test_config'] }}"
    omnia_clone_path: "{{ omnia_test_config.omnia_clone_path | default('/opt/omnia-artifactory') }}"
    omnia_sh_path: "{{ omnia_clone_path }}/omnia.sh"
    omnia_shared_path: "{{ omnia_test_config.omnia_shared_path | default('/opt/omnia') }}"
    container_name: "omnia_core"
    omnia_branch: "{{ omnia_test_config.upgrade.omnia_branch | default('') }}"
    omnia_git_raw_base_url: "https://raw.githubusercontent.com/dell/omnia"
    omnia_sh_branch_url: "{{ omnia_git_raw_base_url }}/{{ omnia_branch }}/omnia.sh"
    omnia_sh_tag_url: "{{ omnia_git_raw_base_url }}/refs/tags/{{ omnia_branch }}/omnia.sh"

  tasks:
    - name: Display target OIM server
      ansible.builtin.debug:
        msg: "Running cleanup on OIM server: {{ ansible_host }}"

    - name: Check if omnia_core container exists
      ansible.builtin.shell:
        cmd: set -o pipefail && podman ps -a --format '{{ '{{' }}.Names{{ '}}' }}' | grep -E '^{{ container_name }}$'
      register: container_exists
      changed_when: false
      failed_when: false

    - name: Skip cleanup if container doesn't exist
      ansible.builtin.debug:
        msg: "Container {{ container_name }} not found on {{ ansible_host }}, skipping uninstall"
      when: container_exists.rc != 0

    - name: Check if omnia.sh exists
      ansible.builtin.stat:
        path: "{{ omnia_sh_path }}"
      register: omnia_sh_stat
      when: container_exists.rc == 0

    - name: Ensure clone directory exists
      ansible.builtin.file:
        path: "{{ omnia_clone_path }}"
        state: directory
        mode: "0755"
      when:
        - container_exists.rc == 0
        - not (omnia_sh_stat.stat.exists | default(false))
        - omnia_branch | length > 0

    - name: Download omnia.sh from branch URL
      ansible.builtin.get_url:
        url: "{{ omnia_sh_branch_url }}"
        dest: "{{ omnia_sh_path }}"
        mode: "0755"
        force: true
      register: download_branch
      failed_when: false
      when:
        - container_exists.rc == 0
        - not (omnia_sh_stat.stat.exists | default(false))
        - omnia_branch | length > 0

    - name: Download omnia.sh from tag URL (fallback)
      ansible.builtin.get_url:
        url: "{{ omnia_sh_tag_url }}"
        dest: "{{ omnia_sh_path }}"
        mode: "0755"
        force: true
      register: download_tag
      when:
        - container_exists.rc == 0
        - not (omnia_sh_stat.stat.exists | default(false))
        - omnia_branch | length > 0
        - download_branch is failed or (download_branch.status_code | default(0)) != 200

    - name: Fail if omnia.sh not available
      ansible.builtin.fail:
        msg: >-
          omnia.sh not found at {{ omnia_sh_path }} and could not be downloaded.
          Tried: {{ omnia_sh_branch_url }} and {{ omnia_sh_tag_url }}
      when:
        - container_exists.rc == 0
        - not (omnia_sh_stat.stat.exists | default(false))
        - (download_tag is failed | default(true)) or (download_branch is failed | default(true))

    - name: Run omnia.sh --uninstall with auto-confirm
      ansible.builtin.shell:
        cmd: set -o pipefail && echo "y" | {{ omnia_sh_path }} --uninstall
      register: uninstall_result
      when: container_exists.rc == 0
      changed_when: uninstall_result.rc == 0

    - name: Fail if uninstall failed
      ansible.builtin.fail:
        msg: "omnia.sh --uninstall failed: {{ uninstall_result.stderr | default('Unknown error') }}"
      when: container_exists.rc == 0 and uninstall_result.rc != 0

    - name: Cleanup completed
      ansible.builtin.debug:
        msg: "omnia.sh --uninstall completed on {{ ansible_host }}"
      when: container_exists.rc == 0
