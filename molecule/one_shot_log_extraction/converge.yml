---
# =============================================================================
# Molecule Converge - Run one-shot log collection inside omnia_core container
# =============================================================================

- name: Converge - Load configuration and setup inventory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default(playbook_dir + '/../..', true) }}"

  tasks:
    - name: Setup dynamic inventory
      ansible.builtin.include_tasks: ../shared/tasks/setup_inventory.yml

    - name: Set facts for OIM server play
      ansible.builtin.set_fact:
        omnia_test_config: "{{ omnia_test_config }}"
        cacheable: true
      no_log: true


- name: Converge - Verify omnia_core container and log collector
  hosts: oim_server
  gather_facts: false

  vars:
    omnia_test_config: "{{ hostvars['localhost']['omnia_test_config'] }}"
    container_name: omnia_core
    collect_playbook: /omnia/log_collector/collect.yml

  tasks:
    - name: Display target OIM server
      ansible.builtin.debug:
        msg: "Running one-shot log extraction on OIM server: {{ ansible_host }}"

    # =========================================================================
    # SYNC PROJECT_DEFAULT INTO CONTAINER
    # =========================================================================

    - name: Ensure project_dir for sync
      ansible.builtin.set_fact:
        project_dir: "{{ project_dir | default(playbook_dir + '/../..') }}"

    - name: Sync project_default and generate vault key
      ansible.builtin.include_tasks: ../shared/tasks/sync_project_default.yml

    # =========================================================================
    # PREREQUISITE CHECKS
    # =========================================================================

    - name: Verify omnia_core container is running
      ansible.builtin.shell:
        cmd: podman ps --filter name={{ container_name }} --format "{{ '{{' }}.Status{{ '}}' }}"
      register: container_status
      changed_when: false

    - name: Display container status
      ansible.builtin.debug:
        msg: "omnia_core container status: {{ container_status.stdout }}"

    - name: Fail if container not running
      ansible.builtin.fail:
        msg: "omnia_core container is not running. Run omnia.sh --install first."
      when: container_status.stdout == ""

    - name: Check if log collector playbook exists
      ansible.builtin.shell:
        cmd: podman exec {{ container_name }} test -f {{ collect_playbook }} && echo "EXISTS" || echo "NOT_FOUND"
      register: playbook_check
      changed_when: false

    - name: Display playbook check result
      ansible.builtin.debug:
        msg: "collect.yml playbook ({{ collect_playbook }}): {{ playbook_check.stdout }}"

    - name: Fail if playbook not found
      ansible.builtin.fail:
        msg: "Log collector playbook not found at {{ collect_playbook }}"
      when: "'NOT_FOUND' in playbook_check.stdout"

    - name: Display prerequisite summary
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "  ONE-SHOT LOG EXTRACTION PREREQ SUMMARY"
          - "============================================"
          - "  omnia_core container:  RUNNING"
          - "  collect.yml playbook:  EXISTS"
          - "============================================"
