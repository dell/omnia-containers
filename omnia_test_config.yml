# =============================================================================
# Omnia Infrastructure Manager (OIM) - Automation Configuration
# =============================================================================
#
# This is the single configuration file for all OIM automation tasks:
#   - Prerequisite validation checks
#   - Container image build
#   - Omnia.sh installation and testing
#
# Fill in the values below according to your environment.
# All automation scripts read from this file.
#
# =============================================================================

# =============================================================================
# DATASET CONFIGURATION
# =============================================================================
# Specify which dataset folder to use for input configurations.
# The dataset folder should exist under datasets/ directory.
#
# Available datasets:
#   - project_default: Standard configuration (default)
#   - <custom>: Any custom folder you create under datasets/
#
# Each dataset folder contains input files like:
#   - software_config.json
#   - telemetry_config.yml
#   - provision_config.yml
#   - network_spec.yml
#   - etc.
#
dataset: "project_default"

# Sync dataset to omnia_core container
# Set to true to copy dataset files to /opt/omnia/input/project_default in container
# Set to false to skip syncing (use existing files in container)
# Default: false
sync_dataset_to_core: false

# =============================================================================
# EXECUTION CONTROL
# =============================================================================
# Set to true to continue running all checks even if some fail
# Set to false to stop immediately on first failure
skip_on_failure: false

# #############################################################################
#                                                                             #
#                      OIM PREREQUISITE CONFIGURATION                         #
#                                                                             #
# #############################################################################
# Settings for OIM server prerequisite checks (run_prereq_check.py)

# =============================================================================
# TARGET OIM SERVER
# =============================================================================
# Remote OIM server where all operations will be executed via SSH.
#
# LOCAL MODE: If you are running this automation directly on the OIM server,
# leave oim_server_ip empty (or set to "localhost" / "127.0.0.1").
# In local mode, SSH credentials are NOT required — all commands run locally.
#
# REMOTE MODE: If you are running from a different machine, set oim_server_ip
# to the OIM's IP address and provide SSH credentials below.

# OIM server IP address (leave empty for local mode — running on OIM itself)
oim_server_ip: ""

# SSH username for remote OIM server (only needed for remote mode)
oim_ssh_user: ""

# SSH password for remote OIM server (only needed for remote mode)
oim_ssh_password: ""

# SSH port (default: 22, only needed for remote mode)
oim_ssh_port: 22

# =============================================================================
# HOSTNAME CONFIGURATION
# =============================================================================
# Hostname to set for the OIM server (FQDN format required)
# Example: "oim.omnia.test" or "oim-server.lab.local"
# The hostname MUST include a domain (e.g., hostname.domain.tld)
oim_hostname: ""

# =============================================================================
# HARDWARE REQUIREMENTS
# =============================================================================
# Minimum hardware specifications required for OIM server

# Minimum CPU cores required
min_cores: 4

# Minimum memory required (in GB)
min_memory_gb: 8

# Minimum disk space required (in GB)
min_disk_gb: 50

# =============================================================================
# OS VALIDATION
# =============================================================================
# Operating system requirements for OIM server

# Required OS name (e.g., "rhel", "centos", "rocky")
required_os: "rhel"

# Required OS version (e.g., "10", "9.3")
required_os_version: "10"

# Required kernel version (must match exactly)
# Example: "6.12.0-55.9.1.el10_0.x86_64"
# Leave empty to skip kernel version check
required_kernel_version: "6.12.0-55.9.1.el10_0.x86_64"

# =============================================================================
# NETWORK INTERFACES
# =============================================================================
# Network interface configuration for OIM server

# Network type: "dedicated" or "lom" (Lights Out Management)
# - dedicated: Separate interfaces for PXE and iDRAC (default)
# - lom: Single interface shared between PXE and iDRAC (requires two IPs)
network_type: "dedicated"

# PXE interface name (for provisioning)
pxe_interface: ""

# Public interface name (for internet access)
public_interface: ""

# PXE interface IP address with subnet (CIDR notation)
# If not set or empty, default is 172.16.107.254/24
pxe_ip: ""

# iDRAC IP address (only used when network_type is "lom")
# This IP will be configured on the same interface as PXE for LOM setups
idrac_ip: ""

# Force reconfigure PXE NIC even if already configured
# Set to true to remove existing IP and apply new configuration
force_configure_pxe: true

# =============================================================================
# NFS CONFIGURATION
# =============================================================================
# NFS server settings for shared storage

# NFS server IP address
nfs_server_ip: ""

# NFS share path on the server
nfs_share_path: ""

# Minimum NFS capacity required (in GB)
nfs_min_capacity_gb: 100

# =============================================================================
# PODMAN CONFIGURATION
# =============================================================================
# Container runtime requirements

# Minimum Podman version required
podman_min_version: "5.0.0"

# =============================================================================
# CONTAINER IMAGE BUILD
# =============================================================================
# Settings for building Omnia container images

# Set to true to clone Omnia Artifactory and build container images
# Set to false to skip git clone and container build steps
reconfigure_images: false

# Omnia Artifactory Git repository URL
# Leave empty to use default: https://github.com/dell/omnia-artifactory.git
omnia_repo_url: "https://github.com/dell/omnia-artifactory.git"

# Artifactory branch to clone (default: omnia-container)
artifactory_branch: "omnia-container"

# Path where Omnia Artifactory will be cloned (default: /opt/omnia-artifactory)
omnia_clone_path: "/opt/omnia-artifactory"

# Core image version tag
# Usage: ./build_images.sh core core_tag=1.1 omnia_branch=pub/q1_dev
core_tag: ""

# Omnia branch/tag for core image build
# Will build the core container with the below omnia branch/tag code
# Can be a branch (e.g., "main", "pub/q1_dev") or a tag (e.g., "v1.6.0")
omnia_branch: ""

# #############################################################################
#                                                                             #
#                         OMNIA.SH INSTALLATION                               #
#                                                                             #
# #############################################################################
# Configuration for omnia.sh --install command
# These settings are used when running molecule converge or omnia.sh --install

# Storage option (REQUIRED)
# Choose how omnia will store data:
#   "NFS"   - Use NFS share (uses nfs_server_ip and nfs_share_path above)
#   "Local" - Use local disk storage
share_option: "NFS"

# NFS type (only if share_option is "NFS")
#   "external" - External NFS server (outside OIM) - for HA and K8s clusters
#   "internal" - NFS server on OIM itself - for flat provisioning only
nfs_type: "external"

# Omnia shared path (REQUIRED)
# This is the local directory where omnia data will be stored
# - For external NFS: This path will be used as mount point for NFS share
# - For Local: This directory will store omnia data directly
omnia_shared_path: ""

# Root password for accessing omnia_core container via SSH (REQUIRED)
omnia_core_password: ""

# =============================================================================
# LDAP CONFIGURATION (for LDAP login tests)
# =============================================================================
# LDAP user credentials for testing LDAP SSH login on cluster nodes

# LDAP credentials for testing SSH login (REQUIRED for LDAP tests)
# Format: Single user or comma-separated list of user:password pairs
# Examples:
#   ldap_credentials: "ldapuser:ldappassword"
#   ldap_credentials: "ldapuser:ldappassword,ldapuser1:ldappassword1,ldapuser2:ldappassword2"
ldap_credentials: ""

# =============================================================================
# LDAP SLAPD.CONF CONFIGURATION (for external LDAP slapd.conf test)
# =============================================================================

# External LDAP server IP (REQUIRED)
external_ldap_server_ip: ""

# External LDAP server port (REQUIRED)
external_ldap_server_port: ""

# External LDAP server domain (REQUIRED)
# Used to build DC (e.g., omnia.test -> dc=omnia,dc=test)
# For omnia.test.cluster -> dc=omnia,dc=test,dc=cluster
external_ldap_domain: ""

# External LDAP bind username (REQUIRED)
external_ldap_bind_username: ""

# External LDAP bind password (REQUIRED)
external_ldap_bind_password: ""

# =============================================================================
# BUILD STREAM JOB OVERRIDE
# =============================================================================
# When build_stream is enabled, every pipeline run is tracked as a job in
# postgres (build_stream_db). Each module checks that its pipeline stage
# completed before running tests:
#
#   Module              Stage checked
#   ──────────────────  ──────────────────────────
#   build_image_x86_64  build-image-x86_64
#   build_image_aarch64 build-image-aarch64
#   local_repo          create-local-repository
#   discovery           validate-image-on-test
#
# By default the automation resolves the LATEST COMPLETED job automatically
# from the database. To pin verification to a specific pipeline run, set the
# job UUID here — it will be used across ALL modules above.
#
# Format: UUID string (e.g., "c01cdd28-3c60-4124-bcf0-b53a0ef93c8b")
# Leave empty ("") to use the latest completed job (default behavior).
# Wrong UUID → test_build_stream_job_stage skips all tests with a clear error.
build_stream_job_id: ""
