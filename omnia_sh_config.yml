# =============================================================================
# Omnia.sh User Inputs
# =============================================================================
# This file contains ONLY the user inputs required for omnia.sh --install
# These are the values you would enter interactively when running the script.
#
# NFS server IP and share path are read from user_config.yml
# =============================================================================

# -----------------------------------------------------------------------------
# Storage Option (REQUIRED)
# -----------------------------------------------------------------------------
# Choose how omnia will store data:
#   "NFS"   - Use NFS share (nfs_server_ip and nfs_share_path from user_config.yml)
#   "Local" - Use local disk storage
share_option: "NFS"

# NFS type (only if share_option is "NFS")
#   "external" - External NFS server (outside OIM) - for HA and K8s clusters
#   "internal" - NFS server on OIM itself - for flat provisioning only
nfs_type: "external"

# Omnia shared path (REQUIRED)
# - For external NFS: Local mount point where NFS will be mounted
# - For Local: Directory path for omnia data storage
omnia_shared_path: "/opt/omnia"

# -----------------------------------------------------------------------------
# Container Password (REQUIRED)
# -----------------------------------------------------------------------------
# Root password for accessing omnia_core container via SSH
omnia_core_password: ""
