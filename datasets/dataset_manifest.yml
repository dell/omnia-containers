# ---------------------------------------------------------------------------
# TC-02: Dell Storage + Observability
# Slurm + K8s, PowerScale NFS/CSI, iDRAC + LDMS + PowerScale telemetry,
# DNS enabled, cloud-init, OME discovery, repo_config: always
# ---------------------------------------------------------------------------
tc02_dell_storage:
  software_config.json:
    repo_config: "always"
    softwares:
      - { name: "default_packages", arch: ["x86_64"] }
      - { name: "admin_debug_packages", arch: ["x86_64"] }
      - { name: "slurm_custom", arch: ["x86_64"] }
      - { name: "service_k8s", version: "1.35.1", arch: ["x86_64"] }
      - { name: "csi_driver_powerscale", version: "v2.16.0", arch: ["x86_64"] }
      - { name: "ldms", arch: ["x86_64"] }
      - { name: "additional_packages", arch: ["x86_64"] }
    slurm_custom:
      - { name: "slurm_control_node" }
      - { name: "slurm_node" }
      - { name: "login_node" }
      - { name: "login_compiler_node" }
    service_k8s:
      - { name: "service_kube_control_plane_first" }
      - { name: "service_kube_control_plane" }
      - { name: "service_kube_node" }
    additional_packages:
      - { name: "service_kube_control_plane_first" }
      - { name: "service_kube_control_plane" }
      - { name: "service_kube_node" }
      - { name: "slurm_control_node" }
      - { name: "slurm_node" }
      - { name: "login_node" }
      - { name: "login_compiler_node" }

  network_spec.yml:
    Networks:
      - admin_network:
          oim_nic_name: "eno1"
          subnet: "10.20.0.0"
          netmask_bits: "24"
          primary_oim_admin_ip: "10.20.0.1"
          primary_oim_bmc_ip: "10.20.0.251"
          dynamic_range: "10.20.0.100-10.20.0.200"
          dns: ["10.20.0.1"]
          ntp_servers:
            - { address: "ntp.corp.example.com", type: "pool" }
          additional_subnets: []
      - ib_network:
          subnet: "192.168.1.0"
          netmask_bits: "24"
          dns: []

  provision_config.yml:
    pxe_mapping_file_path: "/opt/omnia/input/project_default/pxe_mapping_file.csv"
    language: "en_US.UTF-8"
    default_lease_time: "86400"
    dns_enabled: true
    kernel_version_override: ""
    additional_cloud_init_config_file: "/opt/omnia/input/project_default/additional_cloud_init.yml"

  telemetry_config.yml:
    telemetry_sources:
      idrac:
        metrics_enabled: true
        collection_targets: ["victoria_metrics", "kafka"]
      ldms:
        metrics_enabled: true
        collection_targets: ["kafka"]
      dcgm: { metrics_enabled: false }
      powerscale:
        metrics_enabled: true
        logs_enabled: true
        collection_targets: ["victoria_metrics", "victoria_logs"]
      ufm: { metrics_enabled: false, logs_enabled: false }
      vast: { metrics_enabled: false, logs_enabled: false }
      ome: { metrics_enabled: false, logs_enabled: false }
    telemetry_bridges:
      vector_ldms: { metrics_enabled: true }
      vector_ome: { metrics_enabled: false, logs_enabled: false, ome_identifier: "ome" }

  storage_config.yml:
    mounts:
      - name: "powerscale_home"
        source: "10.43.1.10:/ifs/data/hpc_home"
        mount_point: "/home"
        fs_type: "nfs4"
        mnt_opts: "defaults,nofail,vers=4.1"
        functional_group_prefix: ["slurm", "login"]
      - name: "powerscale_scratch"
        source: "10.43.1.10:/ifs/data/hpc_scratch"
        mount_point: "/scratch"
        fs_type: "nfs4"
        mnt_opts: "defaults,nofail,vers=4.1"
        functional_group_prefix: ["slurm", "login"]
    s3_configurations:
      provider: "powerscale"
      endpoint_url: "https://10.43.1.11:9021"

  omnia_config.yml:
    slurm_cluster:
      - cluster_name: "hpc_cluster"
        nfs_storage_name: "powerscale_home"
        vast_storage_name: ""
    service_k8s_cluster:
      - cluster_name: "service-cluster"
        deployment: true
        etcd_on_local_disk: false
        k8s_cni: "calico"
        pod_external_ip_range: "10.20.0.170-10.20.0.200"
        k8s_service_addresses: "10.233.0.0/18"
        k8s_pod_network_cidr: "10.233.64.0/18"
        nfs_storage_name: ""
        k8s_crio_storage_size: "20G"
        csi_powerscale_driver_secret_file_path: ""
        csi_powerscale_driver_values_file_path: ""

  discovery_config.yml:
    enable_bmc_discovery: true
    ome_ip: "10.20.0.250"

  additional_cloud_init.yml:
    common:
      write_files:
        - path: /etc/motd
          content: "*** Dell HPC Cluster — Authorized Access Only ***\n"
          permissions: "0644"
          owner: "root:root"
      runcmd:
        - "echo \"Node provisioned at $(date)\" >> /var/log/omnia_provision.log"
    groups:
      slurm_node_x86_64:
        runcmd:
          - "echo \"performance\" | tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor"

  pxe_mapping_file.csv: |
    FUNCTIONAL_GROUP_NAME,GROUP_NAME,SERVICE_TAG,PARENT_SERVICE_TAG,HOSTNAME,ADMIN_MAC,ADMIN_IP,BMC_MAC,BMC_IP,IB_NIC_NAME,IB_IP
    service_kube_control_plane_first_x86_64,mgmt,SVC101,,k8s-cp01,BB:CC:DD:01:01:01,10.20.0.11,BB:CC:DD:02:01:01,10.20.0.211,,
    service_kube_control_plane_x86_64,mgmt,SVC102,,k8s-cp02,BB:CC:DD:01:01:02,10.20.0.12,BB:CC:DD:02:01:02,10.20.0.212,,
    service_kube_node_x86_64,mgmt,SVC103,,k8s-wrk01,BB:CC:DD:01:01:03,10.20.0.13,BB:CC:DD:02:01:03,10.20.0.213,,
    slurm_control_node_x86_64,grp1,SVC104,,slurm-ctrl01,BB:CC:DD:01:01:04,10.20.0.14,BB:CC:DD:02:01:04,10.20.0.214,,
    slurm_node_x86_64,grp1,SVC105,,slurm-n01,BB:CC:DD:01:01:05,10.20.0.15,BB:CC:DD:02:01:05,10.20.0.215,,192.168.1.15
    slurm_node_x86_64,grp1,SVC106,,slurm-n02,BB:CC:DD:01:01:06,10.20.0.16,BB:CC:DD:02:01:06,10.20.0.216,,192.168.1.16
    login_node_x86_64,grp1,SVC107,,login01,BB:CC:DD:01:01:07,10.20.0.17,BB:CC:DD:02:01:07,10.20.0.217,,

