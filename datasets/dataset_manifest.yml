# =============================================================================
# Omnia Automation — Dataset Manifest
# =============================================================================
# Single source of truth for all TC dataset workflows.
# Run `python generate_datasets.py` to produce overlay directories.
#
# Each TC entry defines ONLY the values that differ from project_default/.
# The generator deep-merges these overrides with the base files and writes
# only the files that changed into datasets/<tc_name>/.
# =============================================================================

# ---------------------------------------------------------------------------
# TC-01: Production Standard
# Slurm + K8s, iDRAC + LDMS telemetry, OpenLDAP, MinIO, single-subnet
# ---------------------------------------------------------------------------
tc01_production_standard:
  software_config.json:
    repo_config: "partial"
    softwares:
      - { name: "default_packages", arch: ["x86_64"] }
      - { name: "admin_debug_packages", arch: ["x86_64"] }
      - { name: "openldap", arch: ["x86_64"] }
      - { name: "slurm_custom", arch: ["x86_64"] }
      - { name: "service_k8s", version: "1.35.1", arch: ["x86_64"] }
      - { name: "ldms", arch: ["x86_64"] }
      - { name: "additional_packages", arch: ["x86_64"] }
    slurm_custom:
      - { name: "slurm_control_node" }
      - { name: "slurm_node" }
      - { name: "login_node" }
      - { name: "login_compiler_node" }
    service_k8s:
      - { name: "service_kube_control_plane_first" }
      - { name: "service_kube_control_plane" }
      - { name: "service_kube_node" }
    additional_packages:
      - { name: "service_kube_control_plane_first" }
      - { name: "service_kube_control_plane" }
      - { name: "service_kube_node" }
      - { name: "slurm_control_node" }
      - { name: "slurm_node" }
      - { name: "login_node" }
      - { name: "login_compiler_node" }

  network_spec.yml:
    Networks:
      - admin_network:
          oim_nic_name: "eno1"
          subnet: "10.10.0.0"
          netmask_bits: "24"
          primary_oim_admin_ip: "10.10.0.1"
          primary_oim_bmc_ip: ""
          dynamic_range: "10.10.0.100-10.10.0.200"
          dns: []
          ntp_servers:
            - { address: "10.10.0.1", type: "server" }
          additional_subnets: []
      - ib_network:
          subnet: "192.168.0.0"
          netmask_bits: "24"
          dns: []

  provision_config.yml:
    pxe_mapping_file_path: "/opt/omnia/input/project_default/pxe_mapping_file.csv"
    language: "en_US.UTF-8"
    default_lease_time: "86400"
    dns_enabled: false
    kernel_version_override: ""
    additional_cloud_init_config_file: ""

  telemetry_config.yml:
    telemetry_sources:
      idrac:
        metrics_enabled: true
        collection_targets: ["victoria_metrics", "kafka"]
      ldms:
        metrics_enabled: true
        collection_targets: ["kafka"]
      dcgm: { metrics_enabled: false }
      powerscale: { metrics_enabled: false, logs_enabled: false }
      ufm: { metrics_enabled: false, logs_enabled: false }
      vast: { metrics_enabled: false, logs_enabled: false }
      ome: { metrics_enabled: false, logs_enabled: false }
    telemetry_bridges:
      vector_ldms: { metrics_enabled: true }
      vector_ome: { metrics_enabled: false, logs_enabled: false, ome_identifier: "ome" }

  storage_config.yml:
    mounts: []
    s3_configurations:
      provider: "minio"
      endpoint_url: ""

  omnia_config.yml:
    slurm_cluster:
      - cluster_name: "hpc_cluster"
        nfs_storage_name: ""
        vast_storage_name: ""
    service_k8s_cluster:
      - cluster_name: "service-cluster"
        deployment: true
        etcd_on_local_disk: false
        k8s_cni: "calico"
        pod_external_ip_range: "10.10.0.170-10.10.0.200"
        k8s_service_addresses: "10.233.0.0/18"
        k8s_pod_network_cidr: "10.233.64.0/18"
        nfs_storage_name: ""
        k8s_crio_storage_size: "20G"
        csi_powerscale_driver_secret_file_path: ""
        csi_powerscale_driver_values_file_path: ""

  local_repo_config.yml:
    user_repo_url_x86_64:
      - { url: "https://slurm-repo.example.com/rhel10/x86_64/", gpgkey: "", name: "slurm_custom" }

  pxe_mapping_file.csv: |
    FUNCTIONAL_GROUP_NAME,GROUP_NAME,SERVICE_TAG,PARENT_SERVICE_TAG,HOSTNAME,ADMIN_MAC,ADMIN_IP,BMC_MAC,BMC_IP,IB_NIC_NAME,IB_IP
    service_kube_control_plane_first_x86_64,mgmt,SVC001,,k8s-cp01,AA:BB:CC:01:01:01,10.10.0.11,AA:BB:CC:02:01:01,10.10.0.211,,
    service_kube_control_plane_x86_64,mgmt,SVC002,,k8s-cp02,AA:BB:CC:01:01:02,10.10.0.12,AA:BB:CC:02:01:02,10.10.0.212,,
    service_kube_node_x86_64,mgmt,SVC003,,k8s-wrk01,AA:BB:CC:01:01:03,10.10.0.13,AA:BB:CC:02:01:03,10.10.0.213,,
    slurm_control_node_x86_64,grp1,SVC004,,slurm-ctrl01,AA:BB:CC:01:01:04,10.10.0.14,AA:BB:CC:02:01:04,10.10.0.214,,
    slurm_node_x86_64,grp1,SVC005,,slurm-n01,AA:BB:CC:01:01:05,10.10.0.15,AA:BB:CC:02:01:05,10.10.0.215,,192.168.0.15
    slurm_node_x86_64,grp1,SVC006,,slurm-n02,AA:BB:CC:01:01:06,10.10.0.16,AA:BB:CC:02:01:06,10.10.0.216,,192.168.0.16
    slurm_node_x86_64,grp1,SVC007,,slurm-n03,AA:BB:CC:01:01:07,10.10.0.17,AA:BB:CC:02:01:07,10.10.0.217,,192.168.0.17
    slurm_node_x86_64,grp1,SVC008,,slurm-n04,AA:BB:CC:01:01:08,10.10.0.18,AA:BB:CC:02:01:08,10.10.0.218,,192.168.0.18
    login_node_x86_64,grp1,SVC009,,login01,AA:BB:CC:01:01:09,10.10.0.19,AA:BB:CC:02:01:09,10.10.0.219,,
