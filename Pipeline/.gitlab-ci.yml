workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always

stages:
  - initialization
  - setup_environment
  - oim_cleanup
  - omnia_sh_uninstall
  - oim_prereq_check
  - omnia_sh_install
  - prepare_oim
  - local_repo
  - build_image_x86_64
  - provision
  - slurm
  - kubernetes
  - telemetry
  - summary

variables:
  AUTOMATION_REPO: "https://github.com/dell/omnia-artifactory.git"
  AUTOMATION_BRANCH: "automation-v2.2.0.0"
  REMOTE_WORK_DIR: "/root/omnia-artifactory"
  PIPELINE_VERSION: "2.2"

initialization:
  stage: initialization
  when: on_success
  allow_failure: false
  timeout: 3h
  script:
    - echo "Pipeline Version $PIPELINE_VERSION"
    - echo "Validating input files"
    - test -f "omnia_test_config.yml" || exit 1
    - test -f "omnia_test_credentials.yml" || exit 1
    - test -d "datasets/project_default" || exit 1
    - echo "Extracting target server credentials from omnia_test_config.yml"
    - |
      python3 << 'PYEOF'
      import yaml
      config = yaml.safe_load(open('omnia_test_config.yml'))
      with open('target.env', 'w') as f:
          f.write(f"TARGET_IP={config.get('oim_server_ip', '')}\n")
          f.write(f"TARGET_USER={config.get('oim_ssh_user', 'root')}\n")
          f.write(f"TARGET_PASS={config.get('oim_ssh_password', '')}\n")
      PYEOF
    - |
      python3 << 'PYEOF'
      from datetime import datetime
      ts = datetime.now().strftime("%Y-%m-%d_%H-%M-%S")
      with open('pipeline_time.env', 'w') as f:
          f.write(f"PIPELINE_TRIGGER_TIME={ts}\n")
      PYEOF
    - cat target.env
    - cat pipeline_time.env
  artifacts:
    paths:
      - target.env
      - pipeline_time.env

setup_environment:
  stage: setup_environment
  timeout: 3h
  needs:
    - job: initialization
      artifacts: true
  script:
    - echo "Setting up environment on target server"
    - source target.env
    - echo "Target server is $TARGET_IP"
    - SSH_CMD="sshpass -p $TARGET_PASS ssh -o StrictHostKeyChecking=no"
    - SCP_CMD="sshpass -p $TARGET_PASS scp -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"
    - echo "Step 1 Testing SSH connectivity"
    - $SSH_CMD -o ConnectTimeout=10 $TARGET "echo SSH connection successful"
    - echo "Step 2 Checking if git is installed on target server"
    - |
      $SSH_CMD $TARGET \
        "command -v git || (dnf install -y git || yum install -y git || apt-get install -y git)"
    - echo "Step 3 Checking if automation repo exists"
    - $SSH_CMD $TARGET "if [ -d $REMOTE_WORK_DIR ]; then rm -rf $REMOTE_WORK_DIR; fi"
    - echo "Step 4 Cloning automation repo on target server"
    - $SSH_CMD $TARGET "cd /root && git clone -b $AUTOMATION_BRANCH $AUTOMATION_REPO"
    - echo "Step 5 Copying input files to target server"
    - $SCP_CMD -r $CI_PROJECT_DIR/omnia_test_config.yml $TARGET:$REMOTE_WORK_DIR/
    - $SCP_CMD -r $CI_PROJECT_DIR/omnia_test_credentials.yml $TARGET:$REMOTE_WORK_DIR/
    - $SCP_CMD -r $CI_PROJECT_DIR/datasets/project_default $TARGET:$REMOTE_WORK_DIR/datasets/
    - echo "Step 6 Verifying files on target server"
    - $SSH_CMD $TARGET "ls -la $REMOTE_WORK_DIR/omnia_test_config.yml"
    - $SSH_CMD $TARGET "ls -la $REMOTE_WORK_DIR/omnia_test_credentials.yml"
    - $SSH_CMD $TARGET "ls -la $REMOTE_WORK_DIR/datasets/project_default/"
    - echo "Step 7 Running setup_env.sh to create virtual environment"
    - $SSH_CMD $TARGET "cd $REMOTE_WORK_DIR && chmod +x setup_env.sh && ./setup_env.sh"
    - echo "Step 8 Verifying virtual environment"
    - |
      $SSH_CMD $TARGET \
        "cd $REMOTE_WORK_DIR && source .venv/bin/activate && python3 --version && pip list"
    - echo "Environment setup completed"

oim_cleanup:
  stage: oim_cleanup
  timeout: 3h
  needs:
    - job: setup_environment
    - job: initialization
      artifacts: true
  script:
    - echo "Checking if any container is running on target server"
    - source target.env
    - echo "Target server is $TARGET_IP"
    - SSH_CMD="sshpass -p $TARGET_PASS ssh -o StrictHostKeyChecking=no"
    - SCP_CMD="sshpass -p $TARGET_PASS scp -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"
    - |
      if $SSH_CMD $TARGET \
        "podman ps -a --format '{{.Names}}' | grep -q ."; then
        echo "Container(s) found, proceeding with cleanup"
        $SSH_CMD $TARGET \
          "cd $REMOTE_WORK_DIR && source .venv/bin/activate && molecule converge -s oim_cleanup"
        $SSH_CMD $TARGET \
          "cd $REMOTE_WORK_DIR && source .venv/bin/activate && \
          PYTEST_ADDOPTS='-m sanity' molecule verify -s oim_cleanup"
        echo "Cleaning up NFS path from storage_config inside core container"
        $SSH_CMD $TARGET "
          CLIENT_SHARE_PATH=\$(podman exec omnia_core \
            cat /opt/omnia/input/project_default/storage_config.yml \
            | grep 'client_share_path' | awk '{print \$2}');
          if [ -n \"\$CLIENT_SHARE_PATH\" ]; then
            echo \"Removing NFS path: \$CLIENT_SHARE_PATH\";
            rm -rf \$CLIENT_SHARE_PATH;
          else
            echo \"No client_share_path found in storage_config.yml\";
          fi"
        echo "oim_cleanup completed"
        mkdir -p reports
        $SCP_CMD -r $TARGET:$REMOTE_WORK_DIR/reports/* reports/
        cd reports && mv test_report.html \
          "report_oim_cleanup_$PIPELINE_TRIGGER_TIME.html" || true
      else
        echo "No containers found, skipping cleanup stage"
        echo "This is expected for fresh installations"
        mkdir -p reports
        echo "Cleanup skipped - no containers found" \
          > reports/report_oim_cleanup_$PIPELINE_TRIGGER_TIME.html
      fi
  artifacts:
    paths:
      - reports/
    when: always

omnia_sh_uninstall:
  stage: omnia_sh_uninstall
  timeout: 3h
  needs:
    - job: oim_cleanup
    - job: initialization
      artifacts: true
  script:
    - echo "Running omnia_sh_uninstall on target server"
    - source target.env
    - source pipeline_time.env
    - echo "Target server is $TARGET_IP"
    - echo "Pipeline trigger time is $PIPELINE_TRIGGER_TIME"
    - SSH_CMD="sshpass -p $TARGET_PASS ssh -o StrictHostKeyChecking=no"
    - SCP_CMD="sshpass -p $TARGET_PASS scp -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"
    - |
      if $SSH_CMD $TARGET \
        "podman ps --format '{{.Names}}' | grep -q '^omnia_core$'"; then
        echo "omnia_core container is running, proceeding with uninstall"
        $SSH_CMD $TARGET \
          "cd $REMOTE_WORK_DIR && source .venv/bin/activate && \
          ./run_molecule.sh omnia_sh_uninstall test --suite sanity"
        echo "omnia_sh_uninstall completed"
        mkdir -p reports
        $SCP_CMD -r $TARGET:$REMOTE_WORK_DIR/reports/* reports/
        cd reports && mv test_report.html \
          "report_omnia_sh_uninstall_$PIPELINE_TRIGGER_TIME.html" || true
      else
        echo "omnia_core container is not running, skipping uninstall stage"
        echo "This is expected for fresh installations"
        mkdir -p reports
        echo "Uninstall skipped - no core container found" \
          > reports/report_omnia_sh_uninstall_$PIPELINE_TRIGGER_TIME.html
      fi
  artifacts:
    paths:
      - reports/
    when: always

