build_image_x86_64:
  stage: build_image_x86_64
  timeout: 3h
  needs:
    - job: local_repo
    - job: initialization
      artifacts: true
  script:
    - echo "Running build_image_x86_64 directly in omnia_core container"
    - source target.env
    - source pipeline_time.env
    - echo "Target server is $TARGET_IP"
    - echo "Pipeline trigger time is $PIPELINE_TRIGGER_TIME"
    - SSH_CMD="sshpass -p $TARGET_PASS ssh -o StrictHostKeyChecking=no"
    - SCP_CMD="sshpass -p $TARGET_PASS scp -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"
    # Running ansible-playbook directly inside omnia_core container
    - echo "Running build_image_x86_64 playbook directly in omnia_core container"
    - |
      $SSH_CMD $TARGET \
        "podman exec -w /omnia/build_image_x86_64 omnia_core \
        ansible-playbook build_image_x86_64.yml -v"
    - echo "Running verify tests"
    - |
      $SSH_CMD $TARGET \
        "cd $REMOTE_WORK_DIR && source .venv/bin/activate && \
        PYTEST_ADDOPTS='-m sanity' molecule verify -s build_image_x86_64"
    - echo "build_image_x86_64 completed"
    - echo "Copying reports from target server"
    - mkdir -p reports
    - $SCP_CMD -r $TARGET:$REMOTE_WORK_DIR/reports/* reports/
    - cd reports && mv test_report.html "report_build_image_x86_64_$PIPELINE_TRIGGER_TIME.html" || true
  artifacts:
