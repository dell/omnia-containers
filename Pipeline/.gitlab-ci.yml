    - echo "omnia_sh_install completed"
    - echo "Copying reports from target server"
    - mkdir -p reports
    - $SCP_CMD -r $TARGET:$REMOTE_WORK_DIR/reports/* reports/
    - cd reports && mv test_report.html "report_omnia_sh_install_$PIPELINE_TRIGGER_TIME.html" || true
