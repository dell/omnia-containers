summary:
  stage: summary
  when: always
  allow_failure: true
  needs:
    - job: initialization
      artifacts: true
    - job: oim_cleanup
      artifacts: true
    - job: omnia_sh_uninstall
      artifacts: true
    - job: oim_prereq_check
    - job: omnia_sh_install
      artifacts: true
    - job: prepare_oim
      artifacts: true
    - job: local_repo
      artifacts: true
    - job: build_image_x86_64
      artifacts: true
    - job: provision
      artifacts: true
    - job: slurm
      artifacts: true
    - job: kubernetes
      artifacts: true
    - job: telemetry
      artifacts: true
  script:
    - echo "Using target.env and pipeline_time.env from initialization job"
    - source target.env
    - source pipeline_time.env
    - SSH_CMD="sshpass -p $TARGET_PASS ssh -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"
    - echo "============================================"
    - echo "Omnia Core Container - Last Commit Info"
    - echo "============================================"
    - |
      $SSH_CMD $TARGET \
        "podman exec omnia_core git -C /omnia log -1 --oneline" \
        || echo "Could not get git log from core container"
    - echo "============================================"
    - echo "Collecting all stage reports from job artifacts"
    - mkdir -p final_reports
    - |
      # GitLab downloads artifacts from each job separately
      # Collect all report files from all artifact directories
      find . -name "report_*.html" -type f 2>/dev/null | while read report_file; do
        echo "Found report: $report_file"
        cp "$report_file" final_reports/
      done
    - |
      # Prefer actual test reports over cleanup/uninstall placeholders
      # Look for reports from stages that run molecule tests (in reverse order to get latest)
      for stage in telemetry kubernetes slurm provision build_image_x86_64 local_repo prepare_oim omnia_sh_install; do
        if ls final_reports/report_${stage}_*.html 1> /dev/null 2>&1; then
          first_report=$(ls final_reports/report_${stage}_*.html | head -1)
          cp "$first_report" "final_reports/test_report_${PIPELINE_TRIGGER_TIME}.html"
          echo "Selected report from stage: $stage"
          break
        fi
      done
    - |
      # Fallback: if no test stage reports found, use first available report
      if [ ! -f "final_reports/test_report_${PIPELINE_TRIGGER_TIME}.html" ] && ls final_reports/report_*.html 1> /dev/null 2>&1; then
        first_report=$(ls final_reports/report_*.html | head -1)
        cp "$first_report" "final_reports/test_report_${PIPELINE_TRIGGER_TIME}.html"
        echo "Fallback: using first available report"
      fi
    - ls -la final_reports/ || echo "No reports collected"
    - echo "============================================"
    - echo "Pipeline Status - $CI_PIPELINE_ID"
    - echo "Pipeline URL - $CI_PIPELINE_URL"
    - echo "============================================"
    - echo "Generating pipeline summary file"
    - echo "Pipeline Trigger Time - $PIPELINE_TRIGGER_TIME" > final_reports/pipeline_summary_${PIPELINE_TRIGGER_TIME}.txt
    - echo "Pipeline ID - $CI_PIPELINE_ID" >> final_reports/pipeline_summary_${PIPELINE_TRIGGER_TIME}.txt
    - echo "Pipeline URL - $CI_PIPELINE_URL" >> final_reports/pipeline_summary_${PIPELINE_TRIGGER_TIME}.txt
    - echo "Project Name - $CI_PROJECT_NAME" >> final_reports/pipeline_summary_${PIPELINE_TRIGGER_TIME}.txt
    - echo "Branch - $CI_COMMIT_REF_NAME" >> final_reports/pipeline_summary_${PIPELINE_TRIGGER_TIME}.txt
    - echo "Commit - $CI_COMMIT_SHA" >> final_reports/pipeline_summary_${PIPELINE_TRIGGER_TIME}.txt
  artifacts:
    paths:
      - final_reports/
