site_name: "Omnia: Everything at once!"
site_description: "Deploy and manage HPC, AI, and data analytics clusters on Dell PowerEdge infrastructure"
# For deployment, set to the actual URL (e.g., https://dell.github.io/omnia/)
site_url: ""

# Repository
repo_name: dell/omnia
repo_url: https://github.com/dell/omnia
edit_uri: edit/main/docs/

# Flat URLs for offline/file:// browsing (page.html instead of page/index.html)
use_directory_urls: false

# Theme
theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/omnia-logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: octicons/tag-16
      tip: octicons/squirrel-16
      warning: octicons/alert-16
      danger: octicons/zap-16
      info: octicons/info-16
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - announce.dismiss
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    # - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    # - header.autohide

# Plugins
plugins:
  - offline
  - search
  - tags
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.snippets:
      base_path:
        - docs

# Custom CSS
extra_css:
  - stylesheets/dell-brand.css
  - stylesheets/omnia.css
  - stylesheets/custom-admonitions.css
  - stylesheets/omnia-flowchart.css

# Custom JS
extra_javascript:
  - javascripts/palette-fallback.js
  - javascripts/language-badges.js
  - javascripts/csv-table-formatter.js
  - javascripts/collapsible-tables-height.js
  - javascripts/omnia-flowchart.js

# Footer
extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dell/omnia
  generator: false

# Copyright
copyright: "Â© Copyright Dell Inc. All Rights Reserved."

