# =============================================================================
# Omnia Test Credentials
# =============================================================================
# Sensitive credentials for automation testing.
# This file should be encrypted using ansible-vault before committing.

# =============================================================================
# SSH CREDENTIALS
# =============================================================================

# SSH password for remote OIM server (only needed for remote mode)
oim_ssh_password: ""

# Root password for accessing omnia_core container via SSH (port 2222)
omnia_core_password: ""

# =============================================================================
# LDAP CREDENTIALS
# =============================================================================

# LDAP user credentials for testing SSH login on cluster nodes
# Used by slurm module to test LDAP user authentication
# Format: Single user or comma-separated list of user:password pairs
# Examples: "ldapuser:ldappass" or "user1:pass1,user2:pass2"
ldap_credentials: ""

# External LDAP bind username for slapd.conf configuration
# Used by provision module for external LDAP server authentication
external_ldap_bind_username: ""

# External LDAP bind password for slapd.conf configuration  
# Used by provision module for external LDAP server authentication
external_ldap_bind_password: ""
