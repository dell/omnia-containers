# ========================  BUILD IMAGE x86_64  =============================
build_image_x86_64:
  stage: build_image_x86_64
  timeout: 3h
  needs:
    - job: local_repo
      artifacts: true
    - job: initialization
      artifacts: true
  script:
    - echo "Running build_image_x86_64 on cluster $CLUSTER"
    - source target.env
    - source pipeline_time.env
    - export SSHPASS="$TARGET_PASS"
    - SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=no"
    - SCP_CMD="sshpass -e scp -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"
    - STAGE_RC=0
    - echo "Running ansible-playbook inside container"
    - echo "Running build_image_x86_64 playbook directly in $CONTAINER_NAME container"
    - |
      $SSH_CMD $TARGET \
        "podman exec -w /omnia/build_image_x86_64 $CONTAINER_NAME \
        ansible-playbook build_image_x86_64.yml -v" || STAGE_RC=$?
    - |
      if [ "$STAGE_RC" -eq 0 ]; then
        echo "Running verify tests"
        $SSH_CMD $TARGET \
          "cd $REMOTE_WORK_DIR && source .venv/bin/activate && \
          PYTEST_ADDOPTS='-m $TEST_SUITE_MARKER' molecule verify -s build_image_x86_64" || STAGE_RC=$?
      fi
    - mkdir -p reports
    - $SCP_CMD -r $TARGET:$REMOTE_WORK_DIR/reports/* reports/ || true
    - cd reports && mv test_report.html
        "report_build_image_x86_64_${CLUSTER}_${PIPELINE_TRIGGER_TIME}.html" || true
    - |
      if [ "$STAGE_RC" -ne 0 ]; then
        echo "ERROR: build_image_x86_64 failed (exit code: $STAGE_RC)"
        exit 1
      fi
      echo "build_image_x86_64 completed successfully"
  artifacts:
    paths:
      - reports/
    when: always

