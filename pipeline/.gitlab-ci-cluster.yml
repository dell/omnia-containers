# ============================  TELEMETRY  ==================================
telemetry:
  stage: telemetry
  timeout: 3h
  needs:
    - job: kubernetes
      artifacts: true
    - job: initialization
      artifacts: true
  script:
    - echo "Running telemetry on cluster $CLUSTER"
    - source target.env
    - source pipeline_time.env
    - export SSHPASS="$TARGET_PASS"
    - SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=no"
    - SCP_CMD="sshpass -e scp -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"
    - STAGE_RC=0
    - echo "Running telemetry verify (converge step disabled)"
    - |
      $SSH_CMD $TARGET \
        "cd $REMOTE_WORK_DIR && source .venv/bin/activate && \
        PYTEST_ADDOPTS='-m $TEST_SUITE_MARKER' molecule verify -s telemetry" || STAGE_RC=$?
    - mkdir -p reports
    - $SCP_CMD -r $TARGET:$REMOTE_WORK_DIR/reports/* reports/ || true
    - cd reports && mv test_report.html
        "report_telemetry_${CLUSTER}_${PIPELINE_TRIGGER_TIME}.html" || true
    - |
      if [ "$STAGE_RC" -ne 0 ]; then
        echo "ERROR: telemetry tests failed (exit code: $STAGE_RC)"
        exit 1
      fi
      echo "telemetry completed successfully"
  artifacts:
    paths:
      - reports/
    when: always

# =============================  SUMMARY  ===================================
summary:
  stage: summary
  when: always
  allow_failure: true
  before_script: []
  needs:
    - job: initialization
      artifacts: true
    - job: oim_cleanup
      artifacts: true
    - job: omnia_sh_uninstall
      artifacts: true
    - job: oim_prereq_check
      artifacts: true
    - job: omnia_sh_install
      artifacts: true
    - job: prepare_oim
      artifacts: true
    - job: local_repo
      artifacts: true
    - job: build_image_x86_64
      artifacts: true
    - job: provision
      artifacts: true
    - job: slurm
      artifacts: true
    - job: kubernetes
      artifacts: true
    - job: telemetry
      artifacts: true
  script:
    - echo "============================================"
    - echo "Cluster $CLUSTER Pipeline Summary"
    - echo "============================================"
    - mkdir -p final_reports
    - echo "Collecting all report files"
    - |
      find . -name "report_*.html" -type f 2>/dev/null | while read report_file; do
        echo "Found report: $report_file"
        cp "$report_file" final_reports/
      done
    - |
      count=$(ls final_reports/report_*.html 2>/dev/null | wc -l)
      echo "Cluster $CLUSTER: $count reports"
    - ls -la final_reports/ || echo "No reports collected"
    - echo "============================================"
    - echo "Pipeline Status  - $CI_PIPELINE_ID"
    - echo "Pipeline URL     - $CI_PIPELINE_URL"
    - echo "============================================"
    - echo "Writing pipeline summary file"
    - |
      echo "Cluster $CLUSTER Pipeline Summary" > final_reports/pipeline_summary.txt
      echo "Pipeline ID  - $CI_PIPELINE_ID" >> final_reports/pipeline_summary.txt
      echo "Pipeline URL - $CI_PIPELINE_URL" >> final_reports/pipeline_summary.txt
      echo "Project      - $CI_PROJECT_NAME" >> final_reports/pipeline_summary.txt
      echo "Branch       - $CI_COMMIT_REF_NAME" >> final_reports/pipeline_summary.txt
      echo "Commit       - $CI_COMMIT_SHA" >> final_reports/pipeline_summary.txt
    - echo "Sending email notification for cluster $CLUSTER"
    - python3 send_email.py || echo "Email notification failed (non-fatal)"
  artifacts:
    paths:
      - final_reports/
