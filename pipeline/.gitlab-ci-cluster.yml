# ---------------------------------------------------------------------------
# Omnia Single-Cluster Child Pipeline
# ---------------------------------------------------------------------------
# Triggered by the parent pipeline (.gitlab-ci.yml) with a CLUSTER variable.
# Runs all stages independently for that single cluster.
#
# Repository layout:
#   clusters/<name>/cluster.env             -> connection details + DATASET
#   datasets/<dataset>/omnia_test_config.yml -> cluster-specific automation config
#   datasets/<dataset>/credentials.yml      -> cluster-specific credentials
# ---------------------------------------------------------------------------

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
      when: always

variables:
  SSH_CONNECT_TIMEOUT: "30"
  CONTAINER_NAME: "omnia_core"
  AUTOMATION_REPO: "https://github.com/dell/omnia-containers.git"
  AUTOMATION_BRANCH: "main"
  GIT_CLONE_BASE_DIR: "/root"
  REMOTE_WORK_DIR: "/root/omnia-containers"
  PIPELINE_VERSION: "2.2"
  TEST_SUITE_MARKER: "sanity"
  EMAIL_SENDER: "omnia-cicd@cicdhost.omnia.test"

stages:
  - initialization
  - setup_environment
  - oim_cleanup
  - omnia_sh_uninstall
  - oim_prereq_check
  - omnia_sh_install
  - prepare_oim
  - local_repo
  - build_image_x86_64
  - provision
  - slurm
  - kubernetes
  - telemetry
  - summary

# ===========================  INPUT RE-SYNC  ================================
# When a stage is retried, only that job re-runs (same commit SHA).
# setup_environment does NOT re-run, so input files on the target are stale.
# This before_script fetches the latest branch changes and re-copies
# dataset + config files to the target server before every stage.
# ---------------------------------------------------------------------------
default:
  before_script:
    - |
      if [ -f target.env ]; then
        source target.env
        export SSHPASS="$TARGET_PASS"
        SCP_CMD="sshpass -e scp -o StrictHostKeyChecking=no"
        SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=no"
        TARGET="$TARGET_USER@$TARGET_IP"
        # Fetch latest changes from the branch so retries see new commits
        echo "Refreshing input files from latest branch commit"
        git fetch origin "$CI_COMMIT_REF_NAME" 2>/dev/null && \
          git checkout "origin/$CI_COMMIT_REF_NAME" -- datasets/ clusters/ 2>/dev/null || true
        # Re-copy input files to target server
        if [ -n "$DATASET" ] && [ -d "$CI_PROJECT_DIR/datasets/$DATASET" ]; then
          echo "Syncing dataset '$DATASET' to target server"
          $SSH_CMD $TARGET "mkdir -p $REMOTE_WORK_DIR/datasets/$DATASET" 2>/dev/null || true
          $SCP_CMD -r $CI_PROJECT_DIR/datasets/$DATASET/. $TARGET:$REMOTE_WORK_DIR/datasets/$DATASET/ 2>/dev/null || true
        fi
        if [ -f "$CI_PROJECT_DIR/clusters/$CLUSTER/omnia_test_config.yml" ]; then
          $SCP_CMD $CI_PROJECT_DIR/clusters/$CLUSTER/omnia_test_config.yml $TARGET:$REMOTE_WORK_DIR/ 2>/dev/null || true
        fi
        if [ -f "$CI_PROJECT_DIR/clusters/$CLUSTER/credentials.yml" ]; then
          $SCP_CMD $CI_PROJECT_DIR/clusters/$CLUSTER/credentials.yml $TARGET:$REMOTE_WORK_DIR/omnia_test_credentials.yml 2>/dev/null || true
        fi
      fi

# ===========================  INITIALIZATION  ==============================
initialization:
  stage: initialization
  when: on_success
  allow_failure: false
  timeout: 3h
  before_script: []
  script:
    - echo "Pipeline Version $PIPELINE_VERSION"
    - echo "Current Cluster $CLUSTER"
    - echo "Loading cluster configuration for $CLUSTER"
    - source clusters/$CLUSTER/cluster.env
    - echo "Expanding GitLab CI/CD variable references"
    - |
      TARGET_PASS=$(eval echo "$TARGET_PASS")
      TARGET_USER=$(eval echo "$TARGET_USER")
      TARGET_IP=$(eval echo "$TARGET_IP")
    - echo "Cluster Name $CLUSTER_NAME"
    - echo "Target IP $TARGET_IP"
    - echo "Target User $TARGET_USER"
    - echo "Dataset $DATASET"
    - echo "Validating input files"
    - test -f "clusters/$CLUSTER/omnia_test_config.yml" || exit 1
    - test -f "clusters/$CLUSTER/credentials.yml" || exit 1
    - echo "Writing env file for later stages"
    - echo "TARGET_IP=$TARGET_IP" > target.env
    - echo "TARGET_USER=$TARGET_USER" >> target.env
    - echo "TARGET_PASS=$TARGET_PASS" >> target.env
    - echo "CLUSTER_NAME=$CLUSTER_NAME" >> target.env
    - echo "DATASET=$DATASET" >> target.env
    - python3 -c "from datetime import datetime; open('pipeline_time.env','w').write(f'PIPELINE_TRIGGER_TIME={datetime.now().strftime(\"%Y-%m-%d_%H-%M-%S\")}\n')"
    - cat target.env
    - cat pipeline_time.env
  artifacts:
    paths:
      - target.env
      - pipeline_time.env
    when: always

# ========================  SETUP ENVIRONMENT  ==============================
setup_environment:
  stage: setup_environment
  timeout: 3h
  before_script: []
  needs:
    - job: initialization
      artifacts: true
  script:
    - echo "Setting up environment on cluster $CLUSTER"
    - source target.env
    - export SSHPASS="$TARGET_PASS"
    - SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=no"
    - SCP_CMD="sshpass -e scp -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"
    - echo "Step 1 Testing SSH connectivity"
    - rm -f ~/.ssh/known_hosts
    - ssh-keygen -R $TARGET_IP || true
    - $SSH_CMD -o ConnectTimeout=$SSH_CONNECT_TIMEOUT $TARGET "echo SSH connection successful"
    - echo "Step 2 Checking if git is installed on target server"
    - $SSH_CMD $TARGET "command -v git || (dnf install -y git || yum install -y git || apt-get install -y git)"
    - echo "Step 3 Removing any existing automation repo"
    - $SSH_CMD $TARGET "if [ -d $REMOTE_WORK_DIR ]; then rm -rf $REMOTE_WORK_DIR; fi"
    - echo "Step 4 Cloning automation repo on target server"
    - $SSH_CMD $TARGET "cd $GIT_CLONE_BASE_DIR && git clone -b $AUTOMATION_BRANCH $AUTOMATION_REPO"
    - echo "Step 4b Patching run_molecule.sh for proper exit code propagation"
    - $SSH_CMD $TARGET "cd $REMOTE_WORK_DIR && sed -i 's/^set -e$/set -eo pipefail/' run_molecule.sh"
    - echo "Step 5 Copying cluster config files to target server"
    - $SCP_CMD $CI_PROJECT_DIR/clusters/$CLUSTER/omnia_test_config.yml $TARGET:$REMOTE_WORK_DIR/
    - $SCP_CMD $CI_PROJECT_DIR/clusters/$CLUSTER/credentials.yml $TARGET:$REMOTE_WORK_DIR/omnia_test_credentials.yml
    - echo "Copying dataset directory to target"
    - |
      if [ -d "$CI_PROJECT_DIR/datasets/$DATASET" ]; then
        $SSH_CMD $TARGET "mkdir -p $REMOTE_WORK_DIR/datasets/$DATASET"
        $SCP_CMD -r $CI_PROJECT_DIR/datasets/$DATASET/. $TARGET:$REMOTE_WORK_DIR/datasets/$DATASET/
        echo "Copied dataset files to $REMOTE_WORK_DIR/datasets/$DATASET/"
      else
        echo "WARNING: Dataset directory $CI_PROJECT_DIR/datasets/$DATASET not found"
      fi
    - echo "Step 5b Patching sync_project_default.yml to remove --delete flag"
    - $SSH_CMD $TARGET "cd $REMOTE_WORK_DIR && sed -i 's/rsync -avz --delete/rsync -avz/' molecule/shared/tasks/sync_project_default.yml"
    - echo "Step 6 Verifying files on target server"
    - $SSH_CMD $TARGET "ls -la $REMOTE_WORK_DIR/omnia_test_config.yml"
    - $SSH_CMD $TARGET "ls -la $REMOTE_WORK_DIR/omnia_test_credentials.yml"
    - $SSH_CMD $TARGET "ls -la $REMOTE_WORK_DIR/datasets/$DATASET/"
    - echo "Step 7 Running setup_env.sh to create virtual environment"
    - $SSH_CMD $TARGET "cd $REMOTE_WORK_DIR && chmod +x setup_env.sh && ./setup_env.sh"
    - echo "Step 8 Verifying virtual environment"
    - $SSH_CMD $TARGET "cd $REMOTE_WORK_DIR && source .venv/bin/activate && python3 --version && pip list"
    - echo "Environment setup completed for cluster $CLUSTER"

# ============================  OIM CLEANUP  ================================
oim_cleanup:
  stage: oim_cleanup
  timeout: 3h
  needs:
    - job: setup_environment
      artifacts: true
    - job: initialization
      artifacts: true
  script:
    - echo "Checking if any container is running on cluster $CLUSTER"
    - source target.env
    - source pipeline_time.env
    - export SSHPASS="$TARGET_PASS"
    - SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=no"
    - SCP_CMD="sshpass -e scp -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"
    - STAGE_RC=0
    - |
      if $SSH_CMD $TARGET "podman ps -a --format '{{.Names}}' | grep -q ."; then
        echo "Container(s) found, proceeding with cleanup"
        $SSH_CMD $TARGET \
          "cd $REMOTE_WORK_DIR && source .venv/bin/activate && molecule converge -s oim_cleanup" || STAGE_RC=$?
        if [ "$STAGE_RC" -eq 0 ]; then
          $SSH_CMD $TARGET \
            "cd $REMOTE_WORK_DIR && source .venv/bin/activate && \
            PYTEST_ADDOPTS='-m $TEST_SUITE_MARKER' molecule verify -s oim_cleanup" || STAGE_RC=$?
        fi
        echo "Cleaning up NFS path from storage_config inside core container"
        $SSH_CMD $TARGET "
          CLIENT_SHARE_PATH=\$(podman exec $CONTAINER_NAME \
            cat /opt/omnia/input/$DATASET/storage_config.yml \
            | grep 'client_share_path' | awk '{print \$2}');
          if [ -n \"\$CLIENT_SHARE_PATH\" ]; then
            echo \"Removing NFS path: \$CLIENT_SHARE_PATH\";
            rm -rf \$CLIENT_SHARE_PATH;
          else
            echo \"No client_share_path found in storage_config.yml\";
          fi" || true
      else
        echo "No containers found, skipping cleanup stage"
        echo "This is expected for fresh installations"
      fi
    - mkdir -p reports
    - $SCP_CMD -r $TARGET:$REMOTE_WORK_DIR/reports/* reports/ || true
    - |
      if [ -f reports/test_report.html ]; then
        cd reports && mv test_report.html \
          "report_oim_cleanup_${CLUSTER}_${PIPELINE_TRIGGER_TIME}.html" || true
      else
        echo "Cleanup skipped - no containers found" \
          > reports/report_oim_cleanup_${CLUSTER}_${PIPELINE_TRIGGER_TIME}.html
      fi
    - |
      if [ "$STAGE_RC" -ne 0 ]; then
        echo "ERROR: oim_cleanup tests failed (exit code: $STAGE_RC)"
        exit 1
      fi
  artifacts:
    paths:
      - reports/
    when: always

# =======================  OMNIA SH UNINSTALL  ==============================
omnia_sh_uninstall:
  stage: omnia_sh_uninstall
  timeout: 3h
  needs:
    - job: oim_cleanup
      artifacts: true
    - job: initialization
      artifacts: true
  script:
    - echo "Running omnia_sh_uninstall on cluster $CLUSTER"
    - source target.env
    - source pipeline_time.env
    - export SSHPASS="$TARGET_PASS"
    - SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=no"
    - SCP_CMD="sshpass -e scp -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"
    - STAGE_RC=0
    - |
      if $SSH_CMD $TARGET "podman ps --format '{{.Names}}' | grep -q '^${CONTAINER_NAME}$'"; then
        echo "$CONTAINER_NAME container is running, proceeding with uninstall"
        $SSH_CMD $TARGET \
          "cd $REMOTE_WORK_DIR && source .venv/bin/activate && \
          ./run_molecule.sh omnia_sh_uninstall test --suite $TEST_SUITE_MARKER" || STAGE_RC=$?
      else
        echo "$CONTAINER_NAME container is not running, skipping uninstall stage"
        echo "This is expected for fresh installations"
      fi
    - mkdir -p reports
    - $SCP_CMD -r $TARGET:$REMOTE_WORK_DIR/reports/* reports/ || true
    - |
      if [ -f reports/test_report.html ]; then
        cd reports && mv test_report.html \
          "report_omnia_sh_uninstall_${CLUSTER}_${PIPELINE_TRIGGER_TIME}.html" || true
      else
        echo "Uninstall skipped - no core container found" \
          > reports/report_omnia_sh_uninstall_${CLUSTER}_${PIPELINE_TRIGGER_TIME}.html
      fi
    - |
      if [ "$STAGE_RC" -ne 0 ]; then
        echo "ERROR: omnia_sh_uninstall tests failed (exit code: $STAGE_RC)"
        exit 1
      fi
  artifacts:
    paths:
      - reports/
    when: always

# =======================  OIM PREREQ CHECK  ================================
