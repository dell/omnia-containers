        "cd $REMOTE_WORK_DIR && source .venv/bin/activate && molecule converge -s provision"
    - |
      $SSH_CMD $TARGET \
        "cd $REMOTE_WORK_DIR && source .venv/bin/activate && \
        PYTEST_ADDOPTS='-m $TEST_SUITE_MARKER' molecule verify -s provision"
    - echo "provision completed"
