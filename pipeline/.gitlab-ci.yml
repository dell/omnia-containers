# =============================  SUMMARY  ===================================
summary:
  stage: summary
  when: always
  allow_failure: true
  needs:
    - job: initialization
      artifacts: true
    - job: oim_cleanup
      artifacts: true
    - job: omnia_sh_uninstall
      artifacts: true
    - job: oim_prereq_check
      artifacts: true
    - job: omnia_sh_install
      artifacts: true
    - job: prepare_oim
      artifacts: true
    - job: local_repo
      artifacts: true
    - job: build_image_x86_64
      artifacts: true
    - job: provision
      artifacts: true
    - job: slurm
      artifacts: true
    - job: kubernetes
      artifacts: true
    - job: telemetry
      artifacts: true
  script:
    - echo "============================================"
    - echo "Multi-Cluster Pipeline Summary"
    - echo "============================================"
    - mkdir -p final_reports
    # Collect all report files from every cluster
    - |
      find . -name "report_*.html" -type f 2>/dev/null | while read report_file; do
        echo "Found report: $report_file"
        cp "$report_file" final_reports/
      done
    # Per-cluster report summary
    - |
      IFS=',' read -ra CLUSTER_ARRAY <<< "$CLUSTERS"
      for cluster in "${CLUSTER_ARRAY[@]}"; do
        cluster=$(echo $cluster | xargs)
        count=$(ls final_reports/report_*_${cluster}_*.html 2>/dev/null | wc -l)
        echo "Cluster $cluster: $count reports"
      done
    - ls -la final_reports/ || echo "No reports collected"
    - echo "============================================"
    - echo "Pipeline Status  - $CI_PIPELINE_ID"
    - echo "Pipeline URL     - $CI_PIPELINE_URL"
    - echo "============================================"
    # Write pipeline summary file
    - |
      cat > final_reports/pipeline_summary.txt <<EOF
      Multi-Cluster Pipeline Summary
      Pipeline ID  - $CI_PIPELINE_ID
      Pipeline URL - $CI_PIPELINE_URL
      Project      - $CI_PROJECT_NAME
      Branch       - $CI_COMMIT_REF_NAME
      Commit       - $CI_COMMIT_SHA
      ============================================
      EOF
    - |
      IFS=',' read -ra CLUSTER_ARRAY <<< "$CLUSTERS"
      for cluster in "${CLUSTER_ARRAY[@]}"; do
        cluster=$(echo $cluster | xargs)
        count=$(ls final_reports/report_*_${cluster}_*.html 2>/dev/null | wc -l)
        echo "  $cluster: $count reports" >> final_reports/pipeline_summary.txt
      done
    # Email notification (optional)
    - |
      if [ -n "$EMAIL_RECIPIENTS" ]; then
        echo "Sending email notification"
        python3 pipeline/send_email.py || echo "Email notification failed (non-fatal)"
      else
        echo "EMAIL_RECIPIENTS not set, skipping email notification"
      fi
  artifacts:
    paths:
      - final_reports/
