  timeout: 3h
  parallel:
    matrix:
      - CLUSTER: [cluster1, cluster2, cluster3]
  needs:
    - job: omnia_sh_install
      artifacts: true
    - job: initialization
      artifacts: true
  script:
    - echo "Running prepare_oim on cluster $CLUSTER"
    - source target_${CLUSTER}.env
    - source pipeline_time_${CLUSTER}.env
    - SSH_CMD="sshpass -p \"$TARGET_PASS\" ssh -o StrictHostKeyChecking=no"
    - SCP_CMD="sshpass -p \"$TARGET_PASS\" scp -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"
    - |
      $SSH_CMD $TARGET \
        "cd $REMOTE_WORK_DIR && source .venv/bin/activate && molecule converge -s prepare_oim"
    - |
      $SSH_CMD $TARGET \
        "cd $REMOTE_WORK_DIR && source .venv/bin/activate && \
        PYTEST_ADDOPTS='-m $TEST_SUITE_MARKER' molecule verify -s prepare_oim"
    - echo "prepare_oim completed"
    - mkdir -p reports_${CLUSTER}
    - $SCP_CMD -r $TARGET:$REMOTE_WORK_DIR/reports/* reports_${CLUSTER}/
    - cd reports_${CLUSTER} && mv test_report.html
