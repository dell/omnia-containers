# ========================  BUILD IMAGE x86_64  =============================
build_image_x86_64:
  stage: build_image_x86_64
  timeout: 3h
  parallel:
    matrix:
      - CLUSTER: [cluster1, cluster2, cluster3]
  needs:
    - job: local_repo
      artifacts: true
    - job: initialization
      artifacts: true
  script:
    - echo "Running build_image_x86_64 on cluster $CLUSTER"
    - source target_${CLUSTER}.env
    - source pipeline_time_${CLUSTER}.env
    - SSH_CMD="sshpass -p \"$TARGET_PASS\" ssh -o StrictHostKeyChecking=no"
    - SCP_CMD="sshpass -p \"$TARGET_PASS\" scp -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"
    # Run ansible-playbook directly inside omnia_core container
    - echo "Running build_image_x86_64 playbook directly in $CONTAINER_NAME container"
    - |
      $SSH_CMD $TARGET \
        "podman exec -w /omnia/build_image_x86_64 $CONTAINER_NAME \
        ansible-playbook build_image_x86_64.yml -v"
    - echo "Running verify tests"
    - |
      $SSH_CMD $TARGET \
        "cd $REMOTE_WORK_DIR && source .venv/bin/activate && \
        PYTEST_ADDOPTS='-m $TEST_SUITE_MARKER' molecule verify -s build_image_x86_64"
    - echo "build_image_x86_64 completed"
    - mkdir -p reports_${CLUSTER}
    - $SCP_CMD -r $TARGET:$REMOTE_WORK_DIR/reports/* reports_${CLUSTER}/
    - cd reports_${CLUSTER} && mv test_report.html
        "report_build_image_x86_64_${CLUSTER}_${PIPELINE_TRIGGER_TIME}.html" || true
  artifacts:
    paths:
      - reports_${CLUSTER}/
    when: always

