    - TARGET="$TARGET_USER@$TARGET_IP"
    - |
      $SSH_CMD $TARGET \
        "cd $REMOTE_WORK_DIR && source .venv/bin/activate && \
        PYTEST_ADDOPTS='-m $TEST_SUITE_MARKER' molecule verify -s slurm"
    - echo "slurm completed"
    - |
      $SSH_CMD $TARGET \
        "cd $REMOTE_WORK_DIR && source .venv/bin/activate && \
        PYTEST_ADDOPTS='-m $TEST_SUITE_MARKER' molecule verify -s dcgm"
    - echo "dcgm completed"
    - |
      $SSH_CMD $TARGET \
        "cd $REMOTE_WORK_DIR && source .venv/bin/activate && \
        PYTEST_ADDOPTS='-m $TEST_SUITE_MARKER' molecule verify -s hpc_benchmarks"
