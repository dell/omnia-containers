# ---------------------------------------------------------------------------
# Omnia Multi-Cluster CI/CD Pipeline
# ---------------------------------------------------------------------------
# Runs all pipeline stages in parallel across every cluster defined in the
# CLUSTER matrix. Per-cluster config lives under pipeline/clusters/:
#
#   pipeline/clusters/<name>/cluster.env            -> connection details + DATASET selection
#   pipeline/clusters/<name>/credentials.yml        -> sensitive creds; copied to the target
#                                                     as omnia_test_credentials.yml
#   pipeline/clusters/<name>/omnia_test_config.yml  -> cluster-specific config; copied to target
#                                                     (each cluster has its own file)
#
# For a single-cluster setup, keep one entry in the matrix and one
# pipeline/clusters/<name>/ directory.
# ---------------------------------------------------------------------------

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "manual"'
      when: always
    - when: always

stages:
  - initialization
  - setup_environment
  - oim_cleanup
  - omnia_sh_uninstall
  - oim_prereq_check
  - omnia_sh_install
  - prepare_oim
  - local_repo
  - build_image_x86_64
  - provision
  - slurm
  - kubernetes
  - telemetry
  - summary

variables:
  # Repository Configuration (override via GitLab CI/CD Variables)
  AUTOMATION_REPO: "https://github.com/dell/omnia-artifactory.git"
  AUTOMATION_BRANCH: "automation-v2.2.0.0"
  REMOTE_WORK_DIR: "/root/omnia-artifactory"
  GIT_CLONE_BASE_DIR: "/root"
  PIPELINE_VERSION: "2.2"

  # Dataset Configuration
  DEFAULT_DATASET: "project_default"

  # Container Configuration
  CONTAINER_NAME: "omnia_core"

  # SSH Configuration
  SSH_CONNECT_TIMEOUT: "10"

  # Test Configuration
  DEFAULT_TIMEOUT: "3h"
  TEST_SUITE_MARKER: "sanity"

  # Email Configuration (optional)
  SMTP_SERVER: ""
  SMTP_PORT: "25"
  SENDER_EMAIL: ""
  EMAIL_RECIPIENTS: ""

  # Multi-Cluster Configuration
  # Comma-separated list used for runtime validation.
  # Must match the CLUSTER matrix entries below.
  CLUSTERS: "cluster1,cluster2,cluster3"

# ===========================  INITIALIZATION  ==============================
initialization:
  stage: initialization
  when: on_success
  allow_failure: false
  timeout: 3h
  parallel:
    matrix:
      - CLUSTER: [cluster1, cluster2, cluster3]
  script:
    - echo "Pipeline Version $PIPELINE_VERSION"
    - echo "Configured Clusters $CLUSTERS"
    - echo "Current Cluster $CLUSTER"
    # Validate cluster is in the configured list
    - |
      if [[ ! ",$CLUSTERS," == *",$CLUSTER,"* ]]; then
        echo "Error: Cluster $CLUSTER is not in configured clusters list: $CLUSTERS"
        echo "Update the CLUSTERS variable or the matrix configuration"
        exit 1
      fi
    - echo "Loading cluster configuration for $CLUSTER"
    - source pipeline/clusters/$CLUSTER/cluster.env
    # Expand GitLab CI/CD variable references (e.g. ${CLUSTER1_TARGET_PASS})
    - |
      TARGET_PASS=$(eval echo "$TARGET_PASS")
      TARGET_USER=$(eval echo "$TARGET_USER")
      TARGET_IP=$(eval echo "$TARGET_IP")
    - echo "Cluster Name $CLUSTER_NAME"
    - echo "Target IP $TARGET_IP"
    - echo "Dataset $DATASET"
    - echo "Validating input files"
    - test -f "pipeline/clusters/$CLUSTER/omnia_test_config.yml" || exit 1
    - test -f "pipeline/clusters/$CLUSTER/credentials.yml" || exit 1
    - test -d "datasets/$DATASET" || exit 1
    # Write per-cluster env files consumed by later stages
    - |
      cat > target_${CLUSTER}.env <<EOF
      TARGET_IP=$TARGET_IP
      TARGET_USER=$TARGET_USER
      TARGET_PASS=$TARGET_PASS
      CLUSTER_NAME=$CLUSTER_NAME
      DATASET=$DATASET
      EOF
    - python3 -c "from datetime import datetime; open('pipeline_time_${CLUSTER}.env','w').write(f'PIPELINE_TRIGGER_TIME={datetime.now().strftime(\"%Y-%m-%d_%H-%M-%S\")}\n')"
    - cat target_${CLUSTER}.env
    - cat pipeline_time_${CLUSTER}.env
  artifacts:
    paths:
      - target_${CLUSTER}.env
      - pipeline_time_${CLUSTER}.env
    when: always

# ========================  SETUP ENVIRONMENT  ==============================
setup_environment:
  stage: setup_environment
  timeout: 3h
  parallel:
    matrix:
      - CLUSTER: [cluster1, cluster2, cluster3]
  needs:
    - job: initialization
      artifacts: true
  script:
    - echo "Setting up environment on cluster $CLUSTER"
    - source target_${CLUSTER}.env
    - SSH_CMD="sshpass -p \"$TARGET_PASS\" ssh -o StrictHostKeyChecking=no"
    - SCP_CMD="sshpass -p \"$TARGET_PASS\" scp -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"
    - echo "Step 1 Testing SSH connectivity"
    - ssh-keygen -R $TARGET_IP || true
    - $SSH_CMD -o ConnectTimeout=$SSH_CONNECT_TIMEOUT $TARGET "echo SSH connection successful"
    - echo "Step 2 Checking if git is installed on target server"
    - $SSH_CMD $TARGET "command -v git || (dnf install -y git || yum install -y git || apt-get install -y git)"
    - echo "Step 3 Removing any existing automation repo"
    - $SSH_CMD $TARGET "if [ -d $REMOTE_WORK_DIR ]; then rm -rf $REMOTE_WORK_DIR; fi"
    - echo "Step 4 Cloning automation repo on target server"
    - $SSH_CMD $TARGET "cd $GIT_CLONE_BASE_DIR && git clone -b $AUTOMATION_BRANCH $AUTOMATION_REPO"
    - echo "Step 5 Copying input files to target server"
    - $SCP_CMD -r $CI_PROJECT_DIR/pipeline/clusters/$CLUSTER/omnia_test_config.yml $TARGET:$REMOTE_WORK_DIR/
    # Copy this cluster's credentials as omnia_test_credentials.yml (auto-encrypted on target)
    - $SCP_CMD $CI_PROJECT_DIR/pipeline/clusters/$CLUSTER/credentials.yml $TARGET:$REMOTE_WORK_DIR/omnia_test_credentials.yml
    - $SSH_CMD $TARGET "mkdir -p $REMOTE_WORK_DIR/datasets"
    - $SCP_CMD -r $CI_PROJECT_DIR/datasets/ $TARGET:$REMOTE_WORK_DIR/datasets_source/
    - |
      CLUSTER_DATASET="${DATASET:-$DEFAULT_DATASET}"
      echo "Using dataset: $CLUSTER_DATASET (for cluster: $CLUSTER)"
      $SSH_CMD $TARGET "cd $REMOTE_WORK_DIR && \
        cp -r datasets_source/$CLUSTER_DATASET datasets/ && \
        rm -rf datasets_source"
    - echo "Step 6 Verifying files on target server"
    - $SSH_CMD $TARGET "ls -la $REMOTE_WORK_DIR/omnia_test_config.yml"
    - $SSH_CMD $TARGET "ls -la $REMOTE_WORK_DIR/omnia_test_credentials.yml"
    - $SSH_CMD $TARGET "ls -la $REMOTE_WORK_DIR/datasets/"
    - echo "Step 7 Running setup_env.sh to create virtual environment"
    - $SSH_CMD $TARGET "cd $REMOTE_WORK_DIR && chmod +x setup_env.sh && ./setup_env.sh"
    - echo "Step 8 Verifying virtual environment"
    - $SSH_CMD $TARGET "cd $REMOTE_WORK_DIR && source .venv/bin/activate && python3 --version && pip list"
    - echo "Environment setup completed for cluster $CLUSTER"

# ============================  OIM CLEANUP  ================================
oim_cleanup:
  stage: oim_cleanup
  timeout: 3h
  parallel:
    matrix:
      - CLUSTER: [cluster1, cluster2, cluster3]
  needs:
    - job: setup_environment
      artifacts: true
    - job: initialization
      artifacts: true
  script:
    - echo "Checking if any container is running on cluster $CLUSTER"
    - source target_${CLUSTER}.env
    - source pipeline_time_${CLUSTER}.env
    - SSH_CMD="sshpass -p \"$TARGET_PASS\" ssh -o StrictHostKeyChecking=no"
    - SCP_CMD="sshpass -p \"$TARGET_PASS\" scp -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"
    - |
      if $SSH_CMD $TARGET "podman ps -a --format '{{.Names}}' | grep -q ."; then
        echo "Container(s) found, proceeding with cleanup"
        $SSH_CMD $TARGET \
          "cd $REMOTE_WORK_DIR && source .venv/bin/activate && molecule converge -s oim_cleanup"
        $SSH_CMD $TARGET \
          "cd $REMOTE_WORK_DIR && source .venv/bin/activate && \
          PYTEST_ADDOPTS='-m $TEST_SUITE_MARKER' molecule verify -s oim_cleanup"
        echo "Cleaning up NFS path from storage_config inside core container"
        $SSH_CMD $TARGET "
          CLIENT_SHARE_PATH=\$(podman exec $CONTAINER_NAME \
            cat /opt/omnia/input/$DATASET/storage_config.yml \
            | grep 'client_share_path' | awk '{print \$2}');
          if [ -n \"\$CLIENT_SHARE_PATH\" ]; then
            echo \"Removing NFS path: \$CLIENT_SHARE_PATH\";
            rm -rf \$CLIENT_SHARE_PATH;
          else
            echo \"No client_share_path found in storage_config.yml\";
          fi"
        echo "oim_cleanup completed"
        mkdir -p reports_${CLUSTER}
        $SCP_CMD -r $TARGET:$REMOTE_WORK_DIR/reports/* reports_${CLUSTER}/
        cd reports_${CLUSTER} && mv test_report.html \
          "report_oim_cleanup_${CLUSTER}_${PIPELINE_TRIGGER_TIME}.html" || true
      else
        echo "No containers found, skipping cleanup stage"
        echo "This is expected for fresh installations"
        mkdir -p reports_${CLUSTER}
        echo "Cleanup skipped - no containers found" \
          > reports_${CLUSTER}/report_oim_cleanup_${CLUSTER}_${PIPELINE_TRIGGER_TIME}.html
      fi
  artifacts:
    paths:
      - reports_${CLUSTER}/
    when: always

# =======================  OMNIA SH UNINSTALL  ==============================
omnia_sh_uninstall:
  stage: omnia_sh_uninstall
  timeout: 3h
  parallel:
    matrix:
      - CLUSTER: [cluster1, cluster2, cluster3]
  needs:
    - job: oim_cleanup
      artifacts: true
    - job: initialization
      artifacts: true
  script:
    - echo "Running omnia_sh_uninstall on cluster $CLUSTER"
    - source target_${CLUSTER}.env
    - source pipeline_time_${CLUSTER}.env
    - SSH_CMD="sshpass -p \"$TARGET_PASS\" ssh -o StrictHostKeyChecking=no"
    - SCP_CMD="sshpass -p \"$TARGET_PASS\" scp -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"
    - |
      if $SSH_CMD $TARGET "podman ps --format '{{.Names}}' | grep -q '^${CONTAINER_NAME}$'"; then
        echo "$CONTAINER_NAME container is running, proceeding with uninstall"
        $SSH_CMD $TARGET \
          "cd $REMOTE_WORK_DIR && source .venv/bin/activate && \
          ./run_molecule.sh omnia_sh_uninstall test --suite $TEST_SUITE_MARKER"
        echo "omnia_sh_uninstall completed"
        mkdir -p reports_${CLUSTER}
        $SCP_CMD -r $TARGET:$REMOTE_WORK_DIR/reports/* reports_${CLUSTER}/
        cd reports_${CLUSTER} && mv test_report.html \
          "report_omnia_sh_uninstall_${CLUSTER}_${PIPELINE_TRIGGER_TIME}.html" || true
      else
        echo "$CONTAINER_NAME container is not running, skipping uninstall stage"
        echo "This is expected for fresh installations"
        mkdir -p reports_${CLUSTER}
        echo "Uninstall skipped - no core container found" \
          > reports_${CLUSTER}/report_omnia_sh_uninstall_${CLUSTER}_${PIPELINE_TRIGGER_TIME}.html
      fi
  artifacts:
    paths:
      - reports_${CLUSTER}/
    when: always

# =======================  OIM PREREQ CHECK  ================================
oim_prereq_check:
  stage: oim_prereq_check
  timeout: 3h
  parallel:
    matrix:
      - CLUSTER: [cluster1, cluster2, cluster3]
  needs:
    - job: omnia_sh_uninstall
      artifacts: true
    - job: initialization
      artifacts: true
  script:
    - echo "Running OIM prerequisite checks on cluster $CLUSTER"
    - source target_${CLUSTER}.env
    - SSH_CMD="sshpass -p \"$TARGET_PASS\" ssh -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"
    - $SSH_CMD $TARGET "cd $REMOTE_WORK_DIR && source .venv/bin/activate && oim-prereq-check"
    - echo "OIM prerequisite check completed"

